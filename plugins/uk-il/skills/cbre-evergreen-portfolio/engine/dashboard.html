/* Does a cluster of RUNNING expiries straddle a band boundary? Two adjacent
   calendar years in different bands that together hold a quarter of the
   running floorspace (each at least 8%): banding would split that cliff
   across two columns, so the chart goes to one column per year. */
function cliffStraddles(){
  const Y = YEAR0, run = DATA.filter(r => r._ls === "running"), tot = sum(run);
  if(!tot) return false;
  const band = y => y <= Y+1 ? 0 : y <= Y+4 ? 1 : y <= Y+9 ? 2 : 3;
  const at = y => sum(run.filter(r => r.expiryYear === y));
  for(let y = Y; y <= Y+10; y++){
    if(band(y) === band(y+1)) continue;
    const a = at(y), b = at(y+1);
    if(a + b >= tot * .25 && a >= tot * .08 && b >= tot * .08) return true;
  }
  return false;
}
STOCK.expiry = {
  id:"expiry", layout:"full",
  title:"When the leases move",
  sub: (rows) => { const o = rows.filter(r=>r.owned).length, inView = anyFilter() ? " in view" : "";
    return T("Leased {units} only, by the year the recorded lease ends") +
      (STOCK.expiry.mode() === "years" ? ", one column per calendar year" : "") + T(". Height is floorspace, not {unit} count.") +
      (o ? " The "+plural(o,"owned unit")+inView+" "+noun(o,"has","have")+" no lease event and "+noun(o,"is","are")+" left out." : ""); },
  // no leases at all: nothing to chart and nothing missing, so the panel is
  // skipped; leases with no dates are a gap, so that gets an empty state
  when: () => { const l = leasedOf(DATA);
    if(!l.length) return false;
    if(!l.some(r=>r.expiry)) return "No lease expiry is recorded on any of the "+plural(l.length,"leased unit")+
      ". Unknown dates are never merged into a year.";
    return true; },
  /* "bands" (Y–Y+1, Y+2–Y+4, Y+5–Y+9, Y+10+) or "years" (one column per
     calendar year to Y+5, then the rest). copy.expiry.mode picks one; the
     default "auto" takes years whenever a cliff straddles a band boundary. */
  mode(){
    const m = CFG.copy.expiry && CFG.copy.expiry.mode;
    if(m === "bands" || m === "years") return m;
    if(this._auto === undefined) this._auto = cliffStraddles() ? "years" : "bands";
    return this._auto;
  },
  /* Year columns hold RUNNING leases only. A passed expiry is its own column
     ("Recorded expiry passed", never "Lapsed"); a lease that has not started
     is set apart with a dashed outline; no expiry on record is hatched. */
  buckets(){
    const Y = YEAR0, yy = n => String(n).slice(2), L = leasedOf(DATA), run = r => r._ls === "running";
    const list = [];
    if(L.some(r => r._ls === "passed")) list.push({label:lbl("bucket.passed"), key:"passed", t:r => r._ls === "passed"});
    if(this.mode() === "years"){
      // single years through the as-at year + 5 (where a cliff matters), the rest as "(year)+",
      // so the chart stays in columns at desktop width
      const last = Math.min(Y + 5, Math.max(Y, ...L.filter(run).map(r => r.expiryYear)));
      for(let y = Y; y <= last; y++) list.push({label:String(y), key:"y"+y, t:(yr => r => run(r) && r.expiryYear === yr)(y)});
      if(L.some(r => run(r) && r.expiryYear > last)) list.push({label:(last+1)+"+", key:"later", t:r => run(r) && r.expiryYear > last});
    } else list.push(
      {label:Y+"–"+yy(Y+1), key:"b1", t:r=>run(r) && r.expiryYear<=Y+1},
      {label:(Y+2)+"–"+yy(Y+4), key:"b2", t:r=>run(r) && r.expiryYear>=Y+2 && r.expiryYear<=Y+4},
      {label:(Y+5)+"–"+yy(Y+9), key:"b3", t:r=>run(r) && r.expiryYear>=Y+5 && r.expiryYear<=Y+9},
      {label:(Y+10)+"+", key:"b4", t:r=>run(r) && r.expiryYear>=Y+10});
    if(L.some(r => r._ls === "not started")) list.push({label:lbl("bucket.notStarted"), key:"ns", t:r => r._ls === "not started", gap:true, form:"dashed"});
    if(L.some(r => r._ls === "undated")) list.push({label:lbl("bucket.undated"), key:"nr", t:r => r._ls === "undated", gap:true, hatch:true});
    return list;
  },
  /* the chart's one unit (millions, or exact sq ft under 100,000), shared by
     its labels and its basis line */
  scale(rows){
    const L = leasedOf(rows);
    return chartFmt(ticks(Math.max(1, ...STOCK.expiry.buckets().map(b => sum(L.filter(b.t)))), 5).top);
  },
  render(el, rows){
    const leased = leasedOf(rows);
    if(!leased.length){ emptyState(el, T("No leased {units} in this selection."), "Nothing in view"); return; }
    /* With the group dimension on, running columns stack by company and a
       state is form (dashed, hatched, its label). With it off, nothing is a
       company colour: running columns are the neutral mark and the passed
       column is the lease-state colour, as on the map. */
    const stacked = GROUP.enabled, flat = s => String(s).replace("\n", " ");
    const fmt = STOCK.expiry.scale(rows), q = v => (fmt(v) || "0") + " sq ft";
    const buckets = this.buckets().map(b=>{
      const set = leased.filter(b.t);
      const segs = stacked && !b.form && !b.hatch
        ? GROUP.order.map(gk => { const s = set.filter(r=>r._g===gk);
            return {value:sum(s), colour:GC(gk), title:flat(b.label)+" · "+gk+" · "+q(sum(s))}; })
        : [Object.assign({value:sum(set), title:flat(b.label)+" · "+q(sum(set))},
            !stacked && b.key === "passed" ? {colour:THEME.sem.passed} : {})];
      return {label:b.label, key:b.key, sub:set.length ? plural(set.length,"unit") : "none", segments:segs, gap:b.gap,
              hatch:b.hatch, style: b.form === "dashed" ? {fill:"#FFFFFF", stroke:THEME.sem.unknown, dash:true} : null,
              set, title:flat(b.label)+" · "+q(sum(set))+" · "+plural(set.length,"unit")};
    });
    // a key names the colours and the forms (direct labels above four groups)
    const present = GROUP.order.filter(k => leased.some(r => r._g === k && !isFolded(k)));
    const key = (stacked ? present.map(k => ({label:k, colour:GC(k)}))
        .concat(GROUP.folded.some(k => leased.some(r => r._g === k)) ? [{label:"Other ("+GROUP.folded.length+")", colour:THEME.other}] : [])
      : buckets.some(b => b.key === "passed" && b.set.length) ? [{label:lbl("state.passed"), colour:THEME.sem.passed}] : [])
      .concat(buckets.some(b => b.key === "ns") ? [{label:lbl("state.not started"), form:"dashed"}] : [])
      .concat(buckets.some(b => b.key === "nr") ? [{label:lbl("state.undated"), form:"hatch"}] : []);
    columns(el, buckets, {key, format:fmt, label:"Lease expiry profile by floorspace. "+
      buckets.map(b=>flat(b.label)+": "+q(sum(b.set))).join("; "),
      onClick: b => { if(b.set.length) openDrawer(b.set.slice().sort((p,q)=>sizeOf(q)-sizeOf(p))[0]); }});
  },
  basis: (rows) => {
    const L = leasedOf(rows); if(!L.length) return "";
    const st = s => L.filter(r => r._ls === s), own = rows.filter(r=>r.owned).length;
    const run = st("running"), p = st("passed"), ns = st("not started"), u = st("undated");
    const fmt = STOCK.expiry.scale(rows), q = v => (fmt(v) || "0") + " sq ft";   // the chart's own unit
    const parts = [plural(run.length, "running lease")];
    if(p.length) parts.push(p.length + " whose recorded expiry has passed (" + q(sum(p)) +
      ": holding over, regeared but not updated, or vacated)");
    if(ns.length) parts.push(ns.length + " " + esc(lbl("state.not started").toLowerCase()) + " (" + q(sum(ns)) + "), set apart and never counted as running");
    if(u.length) parts.push("<b>" + u.length + " with no expiry on record (" + q(sum(u)) + ")</b>, detached and hatched, " +
      "never merged into a year");
    // the parts hold commas of their own, so they are listed with semicolons
    const list = parts.length < 3 ? andList(parts) : parts.slice(0, -1).join("; ") + "; and " + parts[parts.length - 1];
    return (GROUP.enabled ? "Stacked by " + esc(GROUP.label.toLowerCase()) + ". " : "") +
      plural(L.length, "leased unit") + " in view: " + list + "." +
      (own ? " The " + plural(own, "owned unit") + " " + noun(own, "is", "are") + T(" left out: an owned {unit} has no lease event.") : "") +
      T(" Click a column to open its largest {unit}.");
  }
};

STOCK.landlords = {
  id:"landlords", layout:"block",

    if(!l.some(r=>r.landlord)) return "No landlord is recorded on any of the "+plural(l.length,"leased unit")+".";
    return true; },
  /* Third-party landlords only: leased units, never an intra-group landlord
     (the client itself or a group company is not exposure). agg(rows) keeps
     the shape {k, sf, n} a report's clone relies on, with unrecorded
     landlords under NR; intra-group leases are counted by intra(rows). */
  agg(rows){
    const agg = {};
    leasedOf(rows).filter(r => !r.landlordIntra).forEach(r=>{ const k = r.landlord || NR;
      if(!agg[k]) agg[k] = {sf:0,n:0,intra:false};
      agg[k].sf += sizeOf(r); agg[k].n++; });
    return Object.entries(agg).map(([k,v])=>({k,...v})).sort((a,b)=>(a.k===NR)-(b.k===NR) || b.sf-a.sf);
  },
  intra(rows){
    const L = leasedOf(rows).filter(r => r.landlordIntra);

  },
  render(el, rows){
    const leased = leasedOf(rows);
    if(!leased.length){ emptyState(el, T("No leased {units} in this selection: an owned {unit} has no landlord view."), "Nothing in view"); return; }

        title:b.k+" · "+sf(b.sf)+" sq ft · "+plural(b.n,"lease"), inert:!canFilter}))
      // the tail is a real group of landlords: a receding fill, never the not-recorded hatch
      .concat(restSf ? [{label:plural(rest.length, "other landlord"), full:rest.map(r=>r.k).join(", "), value:restSf,
        colour:THEME.sem.context, muted:true, inert:true,
        title:plural(rest.length, "smaller landlord")+" · "+sf(restSf)+" sq ft · "+plural(restN,"lease")}] : [])
      .concat(intra ? [{label:lbl("intraSet"), value:intra.sf, colour:THEME.sem.context, muted:true, key:INTRA_KEY,
        inert:!canFilter || !FILTERS.find(f => f.id === "landlord").intra,
        title:cap(lbl("intraWho"))+" as landlord, not third-party exposure · "+sf(intra.sf)+" sq ft · "+plural(intra.n,"lease")}] : [])
      .concat(none ? [{label:NR, value:none.sf, hatch:true, muted:true, inert:true,
        title:"No landlord recorded · "+sf(none.sf)+" sq ft · "+plural(none.n,"lease")}] : []);
    hbars(el, items, {label:"Floorspace by third-party landlord. "+top.slice(0,6).map(b=>b.k+": "+sf(b.sf)+" square feet").join("; "),

    const ownedN = rows.filter(r=>r.owned).length;

      (named.length > 1 ? (k === 1 ? 'The largest landlord holds' : 'The largest '+word(k)+' hold')+' <b>'+msfT(tk)+' sq ft ('+pctS(tk,tot)+
          '% of the third-party leased floorspace)</b>. '
        : named.length === 1 ? '<b>One third-party landlord holds all '+msfT(tk)+' sq ft.</b> ' : '')+
      (intra ? plural(intra.n, "lease")+' ('+msfT(intra.sf)+' sq ft) '+noun(intra.n,'has','have')+' '+esc(lbl("intraWho"))+
        ' as landlord: shown apart, not counted as exposure. ' : '')+
      (ownedN ? 'The '+plural(ownedN,"owned unit")+' '+noun(ownedN,'is','are')+T(' left out: an owned {unit} has no landlord view. ') : '')+

  }
};

let FINDING_ITEMS = [];
function resolveFindings(){
  let f = CFG.findings;
  if(!f) { FINDING_ITEMS = []; return; }
  if(Array.isArray(f) || typeof f === "function") f = {items:f};
  let items = f.items;
  try { if(typeof items === "function") items = items(DATA, API); } catch(e){ report("findings", e); items = []; }
  FINDING_ITEMS = (Array.isArray(items) ? items : []).map(it => {
    try { if(typeof it === "function") it = it(DATA, API); } catch(e){ report("finding", e); return null; }
    if(!it || !it.h) return null;
    const h = val(it.h, DATA); if(!h) return null;
    return {h, b:val(it.b, DATA), a:val(it.a, DATA)};
  }).filter(Boolean);
  if(f.title) CFG.copy.findings = Object.assign({title:f.title}, CFG.copy.findings);
  if(f.note || f.sub) CFG.copy.findings = Object.assign({sub:f.note || f.sub}, CFG.copy.findings);
}

    const t = el.querySelector("table");
    t.style.minWidth = Math.max(640, Math.min(1080, COLS.length * 120)) + "px";
    /* The box scrolls sideways ONLY when the table does not fit, measured, so
       the header stays sticky whenever it can (a scroll box breaks sticky
       against the viewport). A fixed "more than ten columns" rule unstuck the
       header on wide screens where a twelve-column table fitted. */
    new ResizeObserver(() => fitTable()).observe(el.querySelector(".t-scroll"));

function fitTable(){
  const box = ROOT.querySelector(".t-scroll"), t = box && box.querySelector("table");
  if(!t || !box.clientWidth) return;
  box.classList.remove("scrolls");
  box.classList.toggle("scrolls", t.scrollWidth > box.clientWidth + 1);
}

STOCK.events = {
  id:"events", layout:"block",
  title:"The next lease events",
  sub: () => "Expiries, breaks, rent reviews and lease starts dated in the next "+word(STOCK.events.years())+" years, soonest first.",
  years: () => (CFG.copy.events && CFG.copy.events.years) || 3,
  /* list(rows) -> [{r, d (ISO), kind}] soonest first. Expiries, breaks and
     reviews of RUNNING leases; the start of a lease that has not started.
     A report's clone may reuse it (DASH.stock.events.list). */
  list(rows){
    const hz = new Date(TODAY); hz.setUTCFullYear(hz.getUTCFullYear() + (this.years ? this.years() : 3));
    const out = [], add = (r, k, kind) => { const d = r[k] ? isoDate(r[k]) : null;
      if(d && d >= TODAY && d <= hz) out.push({r, d:r[k], kind}); };
    leasedOf(rows).forEach(r => {
      if(r._ls === "running"){ add(r, "expiry", "Expiry"); add(r, "breakDate", "Break"); add(r, "rentReview", "Rent review"); }
      else if(r._ls === "not started") add(r, "leaseStart", "Lease starts");
    });

      '</button></li>').join("")+'</ul>';
    el.querySelectorAll(".ev-row").forEach(b => b.onclick = () => openDrawer(ev[+b.dataset.i].r));
  },
  basis: rows => { const ev = STOCK.events.list(rows), max = (CFG.copy.events && CFG.copy.events.max) || 8;
    return ev.length > max ? "Showing the first "+max+" of "+ev.length+" dated events." : ""; }

/* ============================================================== TABLE */
const STOCK_COLS = {
  short:   {k:"short",   t:"Unit",       cls:"nm",  get:r=>'<strong>'+esc(r.short)+'</strong><span>'+
      esc([r.town, r.postcode].filter(Boolean).join(" · ") || "—")+'</span>'},
  group:   {k:"_g",      t:()=>GROUP.short, get:r=>'<span class="dot" style="background:'+GC(r._g)+
      '"></span>'+esc(r._g)},
  region:  {k:"region",  t:"Region",     get:r=>r.region ? esc(r.region) : UNK},
  size:    {k:"size",    t:"Size",       cls:"n", num:true,
   get:r=>r.size ? '<span class="szbar"><i style="width:'+(r.size/MAX_SF*100)+'%"></i></span>'+sf(r.size) : UNK},
  tenure:  {k:"tenure",  t:"Tenure",     get:r=> r.owned ? '<span class="pill p-own">Owned</span>'
      : r.tenure === "Leased (regeared)" ? '<span class="pill p-regear">Regeared</span>'
      : r.tenure ? '<span class="pill p-lease">'+esc(/^leased?$/i.test(r.tenure) ? "Leased" : r.tenure)+'</span>'
      : '<span class="pill p-none">n/r</span>'},
  landlord:{k:"landlord",t:"Landlord",   get:r=>r.owned?'<span class="unk">—</span>':
      (r.landlord ? esc(llShort(r.landlord)) + (r.landlordIntra && lbl("intraTag") ? ' <span class="unk">('+esc(lbl("intraTag"))+')</span>' : '') : UNK)},
  expiry:  {k:"expiry",  t:"Lease expiry",cls:"n",
   get:r=>{
     if(r.owned) return '<span class="unk">owned</span>';
     if(!r.expiry) return UNK;
     return stateDot(r)+dmy(r.expiry);
   }},
  rent:    {k:"rent",    t:"Rent £/sq ft", cls:"n", num:true, get:r=>has(r.rent)?money(r.rent):UNK},
  epc:     {k:"epc",     t:"EPC",        get:r=>epcPill(r.epc)}
};
/* the lease state as a dot beside its date: a fill on the urgency ramp, or
   FORM (dashed = not yet started, hollow = no expiry) */
function stateDot(r){
  const b = eventBand(r), f = EVENT_FORM[b];
  return f ? '<span class="dot '+f+'" title="'+esc(b)+'"></span>'
           : '<span class="dot" style="background:'+EVENT_C[b]+'" title="'+esc(b)+'"></span>';
}
/* EPC: the letter is always printed; the band colour is a swatch beside it
   (design-system §3c), so the text itself always reaches AA */
function epcPill(epc){
  if(!epc) return '<span class="pill p-none">n/r</span>';
  const c = EPC_C[epc] || NEUTRAL, e = edgeFor(c);
  return '<span class="pill p-epc"><i style="background:'+c+(e ? ';box-shadow:inset 0 0 0 1px '+e : '')+'"></i>'+esc(epc)+'</span>';
}
let COLS = [];
function resolveColumns(){
  const want = Array.isArray(CFG.table.columns) ? CFG.table.columns
    : ["short","group","region","size","tenure","landlord","expiry","rent","epc"];
  const anyLeased = DATA.some(r=>!r.owned);
  const drop = {
    group: !GROUP.enabled, region: !DATA.some(r=>r.region),
    landlord: !anyLeased, expiry: !anyLeased, rent: !DATA.some(r=>r.rent), epc: !DATA.some(r=>r.epc)
  };
  COLS = want.map(c => {
    if(typeof c === "string"){
      if(STOCK_COLS[c]) return Array.isArray(CFG.table.columns) || !drop[c] ? STOCK_COLS[c] : null;
      return {k:c, t:c, get:r=>has(r[c]) ? esc(r[c]) : UNK};   // a raw field by name
    }
    if(!c || !c.k) return null;
    return {k:c.k, t:c.t || c.k, cls:c.num ? "n" : (c.cls || ""), num:!!c.num, sortKey:c.sortKey,
      get: c.get ? (r => { try { const v = c.get(r, API); return has(v) ? String(v) : UNK; } catch(e){ return UNK; } })
                 : (r => has(r[c.k]) ? esc(c.num && typeof r[c.k] === "number" ? nf.format(r[c.k]) : r[c.k]) + (c.unit ? " " + esc(c.unit) : "") : UNK)};
  }).filter(Boolean);
  if(!COLS.some(c => c.k === S.sort)) S.sort = COLS.some(c=>c.k==="size") ? "size" : (COLS[0] || {}).k;
}
function sortRows(rows){
  const k = S.sort, d = S.dir, col = COLS.find(c=>c.k===k) || {};
  const get = col.sortKey ? (r => { try { return col.sortKey(r); } catch(e){ return null; } }) : (r => r[k]);
  return rows.slice().sort((a,b)=>{
    let x = get(a), y = get(b);
    // nulls always last, whichever direction
    const xn = !has(x), yn = !has(y);
    if(xn && yn) return sizeOf(b) - sizeOf(a);
    if(xn) return 1;
    if(yn) return -1;
    if(typeof x === "boolean") { x = +x; y = +y; }
    if(typeof x === "string") return d * x.localeCompare(String(y), "en-GB");
    return d * (x - y);
  });
}

function renderTable(){
  const thead = byId("thead"), tb = byId("tbody"); if(!thead) return;
  thead.innerHTML = COLS.map(c=>{
    const on = S.sort===c.k;
    return '<th scope="col" class="'+(c.cls==="n"?"r":"")+'"'+
      (on?' aria-sort="'+(S.dir===1?"ascending":"descending")+'"':'')+'>'+
      '<button type="button" data-k="'+esc(c.k)+'">'+esc(typeof c.t === "function" ? c.t() : c.t)+
      '<svg class="caret" viewBox="0 0 8 8" aria-hidden="true"><path d="M4 1 L7.2 6.4 L0.8 6.4 Z" '+
      'fill="currentColor"/></svg></button></th>';
  }).join("");
  thead.querySelectorAll("button").forEach(b=>{
    b.onclick = ()=>{
      const k = b.dataset.k, col = COLS.find(c=>c.k===k) || {};
      if(S.sort===k) S.dir = -S.dir;
      else { S.sort = k; S.dir = col.num || k === "expiry" || k === "size" ? -1 : 1; }
      renderTable();
    };
  });

  const rows = sortRows(visible());
  if(!rows.length){
    tb.innerHTML = '<tr class="empty-row"><td colspan="'+COLS.length+'">'+
      esc(lbl("noMatch"))+' <button class="btn-reset" type="button">'+esc(lbl("clearAll") || "Clear all")+'</button></td></tr>';
    tb.querySelector(".btn-reset").onclick = reset;
    return;
  }
  tb.innerHTML = rows.map(r=>
    '<tr tabindex="0" data-id="'+esc(r.id)+'"'+(S.selId===r.id?' aria-selected="true"':'')+'>'+
    COLS.map(c=>'<td class="'+(c.cls||"")+'">'+c.get(r)+'</td>').join("")+'</tr>').join("");

  const byRow = new Map(DATA.map(d=>[d.id, d]));
  tb.querySelectorAll("tr").forEach(tr=>{
    const r = byRow.get(tr.dataset.id);
    tr.onclick = ()=>openDrawer(r);
    tr.onkeydown = e=>{
      if(e.key==="Enter"||e.key===" "){ e.preventDefault(); openDrawer(r); }
      if(e.key==="ArrowDown"&&tr.nextElementSibling){ e.preventDefault(); tr.nextElementSibling.focus(); }
      if(e.key==="ArrowUp"&&tr.previousElementSibling){ e.preventDefault(); tr.previousElementSibling.focus(); }
    };
    tr.onmouseenter = ()=>{ const m = markers[r.id]; if(m) m.setStyle({weight:3.5}); };
    tr.onmouseleave = ()=>{ const m = markers[r.id]; if(m) m.setStyle({weight:2}); };
  });
  fitTable();
}

/* ============================================================= DRAWER */
let lastFocus = null;
function row(dt, dd){ return has(dd) ? '<dt>'+esc(dt)+'</dt><dd>'+dd+'</dd>' : null; }
const nrBig = '<span class="unk" style="font-size:15px">n/r</span>';

/* MEES note for one unit (uk-rules.md §1). Two tests, never merged: the E
   minimum is IN FORCE for every let building in England and Wales, any size;
   the B target from 2031 over 1,000 m² is SET TO apply where cost-effective,
   not yet law. "Let" = leased; an owned unit is not let. No EPC = unrated. */
function meesNote(r){
  if(r.owned) return null;
  const t = MEES(), n = nationOf(r), rank = r.epc ? EPC_RANK[r.epc] : null;
  if(n === "Scotland") return "In Scotland the England and Wales minimum energy standards do not apply; Scottish rules differ.";
  if(n === "Northern Ireland") return "Northern Ireland has no minimum energy standard for let non-domestic property.";
  const floor = "The EPC "+t.floor+" minimum is in force for every let building in England and Wales";
  const tgt = "From "+t.year+", let buildings over "+t.m2+" are set to need EPC "+t.target+
    " where cost-effective: a government target, not yet law.";
  /* Certainty follows the rule: the minimum in force IS the landlord's
     obligation; the target is only "set to" apply, so no obligation word is
     ever attached to it. */
  if(rank && rank > EPC_RANK[t.floor]) return "EPC "+r.epc+" is below the EPC "+t.floor+" minimum, which is in force for "+
    "every let building in England and Wales and is the landlord's obligation. Check whether an exemption is registered "+
    "on the PRS Exemptions Register.";
  if(!r.size) return (r.epc ? "EPC "+r.epc+". " : "No EPC on record (unrated, not failing). ")+floor+
    ". Size is not recorded, so whether the "+t.year+" target applies is unknown.";
  if(r.size > t.sqft){
    if(!r.epc) return "No EPC on record (unrated, not failing). "+floor+". "+tgt+T(" An EPC would show where this {unit} stands.");
    if(rank > EPC_RANK[t.target]) return "EPC "+r.epc+" meets the EPC "+t.floor+" minimum in force today, which is the "+
      "landlord's obligation. "+tgt+" Worth raising at renewal.";
    return null;
  }
  if(!r.epc) return "No EPC on record (unrated, not failing). "+floor+"; at "+t.m2+" or less, the "+t.year+
    " EPC "+t.target+" target does not apply.";
  return null;
}

/* The drawer is built from a MODEL, so a report changes it without touching
   the markup (a run once regex-patched the HTML against five anchors):
     hero  [{key, value, caption}]               4 cells
     notes [{key, html}]                          the callouts under the hero
     rows  [{sec, key, label, value, cls?, after?}]
           sec = identity | lease | ops | compliance | provenance | a custom title
   Hooks (DASH.set({drawer:{...}})): rows(r, rows, api), notes(r, notes, api),
   hero(r, cells, api) each return the new list: filter to hide, map to
   relabel, push to add ({after: key} places a row after another). Values are
   html; escape data with api.esc. The body carries no event handlers. */
const DR_SECS = [["identity","Identity"],["lease",null],["ops","Operational fit"],
                 ["compliance","Compliance and ESG"],["provenance","Record provenance"]];
/* one decimal where it says something, never a trailing ".0" (12.0 -> "12") */
const dp1 = v => { const x = Math.round(Number(v) * 10 + 1e-9) / 10; return nf.format(x); };
/* a whole-number percentage, rounded half up (40.05 -> "40%", never "40.0%") */
const pct0 = v => Math.round(Number(v) + 1e-9) + "%";
function drawerModel(r){
  const ls = r._ls, t = MEES(), rows = [], notes = [], missing = [], order = [];
  // labels.rows.<key> relabels any stock row; `order` keeps every key, valued or not,
  // so a report row placed {after} a key this unit has no value for still lands there
  const add = (sec, key, label, value, cls) => {
    order.push({sec, key});
    if(!has(value)) return;
    const own = LBL.rows && has(LBL.rows[key]) ? lbl("rows." + key, value, r) : null;
    rows.push({sec, key, label: own || label, value:String(value), cls});
  };
  const need = (lab, v) => { if(!has(v)) missing.push(lab); return v; };
  const past = iso => iso && iso < AS_AT;
  const who = esc(LBL.client);
  const thirdPartyOwner = r.owned && r.landlord && !r.landlordIntra;

  const hero = [
    {key:"size", value: r.size ? sf(r.size) : null, caption:"sq ft GIA"},
    {key:"rent", value: has(r.rent) ? money(r.rent) : null, caption:"rent per sq ft"},
    r.owned ? {key:"tenure", value:lbl("state.owned"), caption: thirdPartyOwner ? "tenure, title to confirm" : "tenure"}
      : {key:"expiry", value: r.expiry ? String(r.expiryYear) : null,
         caption: ls === "passed" ? "recorded expiry, passed" : ls === "not started" ? "recorded expiry, not started" : "recorded expiry"},
    {key:"site", value: has(r.siteAcres) ? dp1(r.siteAcres) : null, caption:"site acres"}
  ];

  if(ls === "passed") notes.push({key:"passed", html:"The recorded expiry ("+dmy(r.expiry)+T(") has passed. The {unit} may be ")+
    "holding over, regeared but not updated in EverGreen, or vacated; the export does not say which. Confirm status."});
  if(ls === "not started") notes.push({key:"notStarted", html:"The recorded lease starts on "+longDate(r.leaseStart)+
    ", after the as-at date: signed but not yet running, so it counts in no unexpired or WAULT figure. "+
    T("How the {unit} is occupied today is not recorded.")});
  if(ls === "undated") notes.push({key:"undated", html: r.landlordIntra
    ? "No lease expiry is recorded, and the landlord is "+esc(lbl("intraWho"))+". Confirm with "+who+T(" how this {unit} is held.")
    : !r.landlord ? T("No lease expiry and no landlord are recorded. Obtain the lease to confirm how this {unit} is held.")
    : T("No lease expiry is recorded against this {unit}. CBRE to request the lease from the landlord.")});
  if(thirdPartyOwner) notes.push({key:"ownedThirdParty", html:"The record lists an owner-occupied status but names <b>"+
    esc(r.landlord)+"</b> as landlord, so title needs confirming: a sale and leaseback or a mis-keyed status would make this a lease."});

  /* identity: the group label only when the dimension is on */
  const full = toStr(r[GROUP.full]) || (r._g !== NR ? r._g : null);
  if(GROUP.enabled) add("identity", "group", GROUP.label, full ? esc(full) : null);
  add("identity", "town", "Town", r.town ? esc(r.town) : null);
  add("identity", "postcode", "Postcode", r.postcode ? esc(r.postcode) : null);
  add("identity", "region", "Region", r.region ? esc(r.region) : null);
  add("identity", "corridor", "Road corridor", r.corridor && r.corridor !== "N/A" ? esc(r.corridor) : null);
  add("identity", "park", "Logistics park", r.park ? esc(r.park) : null);
  add("identity", "setting", "Setting", r.solus ? esc(r.solus) : null);
  // the grade as EverGreen records it ("Recorded as New Grade A"), not a finding about today
  add("identity", "quality", "Quality", r.quality ? esc(lbl("quality", r.quality, r) || r.quality) : null);
  add("identity", "provenance", "Procurement", r.provenance ? esc(r.provenance) : null);
  // pcDate ("2022-06", evergreen_units.py) reads as a month; else the year
  add("identity", "pcYear", "Practical completion",
    typeof r.pcDate === "string" && /^\d{4}-\d{2}$/.test(r.pcDate) ? monthYear(r.pcDate + "-01") : r.pcYear);

  /* tenure and lease */
  if(r.owned){
    add("lease", "tenure", "Tenure", thirdPartyOwner ? "Recorded as owned (title to confirm)" : "Owned (recorded as owner-occupied)");
    if(thirdPartyOwner) add("lease", "landlordOnRecord", "Landlord on record", esc(r.landlord));
    add("lease", "dealDate", "Deal date", dmy(r.dealDate));
  } else {
    add("lease", "tenure", "Tenure", r.tenure ? esc(r.tenure) : need("tenure", null));
    add("lease", "landlord", "Landlord", r.landlord ? esc(r.landlord) +
      (r.landlordIntra && lbl("intraTag") ? " (" + esc(lbl("intraTag")) + ")" : "") : need("landlord", null));
    add("lease", "developer", "Developer", r.developer ? esc(r.developer) : null);
    add("lease", "leaseStart", ls === "not started" ? "Lease starts" : "Lease start", dmy(r.leaseStart));
    add("lease", "term", "Term", has(r.leaseTerm) ? r.leaseTerm+" yrs" : need("lease term", null));
    add("lease", "expiry", ls === "passed" ? "Recorded expiry (passed)" : "Recorded expiry", r.expiry ? dmy(r.expiry) : need("lease expiry", null));
    // unexpired only while the lease is running: never on a passed or not-started lease
    add("lease", "unexpired", "Unexpired", ls === "running" && has(r.yearsToExpiry) ? r.yearsToExpiry.toFixed(1)+" yrs" : null);
    add("lease", "break", past(r.breakDate) ? "Recorded break (passed)" : "Break", dmy(r.breakDate));
    add("lease", "review", past(r.rentReview) ? "Last recorded review" : "Next review", dmy(r.rentReview));
    add("lease", "reviewType", "Review type", r.reviewType ? esc(/^omrr$/i.test(r.reviewType) ? "Open-market rent review (OMRR)" : r.reviewType) : null);
    add("lease", "contractedOut", "1954 Act", r.contractedOut === true ? "Contracted out: no statutory right to renew"
      : r.contractedOut === false ? "Not contracted out (protected)" : null);
    add("lease", "rent", "Achieved rent", has(r.rent) ? money(r.rent)+" / sq ft" : need("rent", null));
    // EverGreen's own recorded figure only: never achieved rent x size
    add("lease", "rentPa", "Rent per annum", has(r.rentPa) ? "£"+nf.format(Math.round(r.rentPa)) : null);
    add("lease", "dealDate", "Deal date", dmy(r.dealDate));
    add("lease", "incentive", "Incentive", has(r.incentive) ? r.incentive+" months" : null);
  }

  /* operational fit */
  add("ops", "eaves", "Eaves", has(r.eaves) ? r.eaves+" m" : need("eaves", null));
  add("ops", "yard", "Yard depth", has(r.yard) ? r.yard+" m" : need("yard depth", null));
  add("ops", "dockDoors", "Dock doors", sf(r.dockDoors));
  add("ops", "levelDoors", "Level access doors", sf(r.levelDoors));
  add("ops", "totalDoors", "Total doors", sf(r.totalDoors));
  add("ops", "doorRatio", "Sq ft per door", has(r.doorRatio) ? nf.format(Math.round(r.doorRatio)) : null);
  add("ops", "floorLoad", "Floor loading", has(r.floorLoad) ? r.floorLoad+" kN/sq m" : null);
  add("ops", "power", "Power", has(r.power) ? nf.format(r.power)+" KVA" : need("power", null));
  add("ops", "office", "Office content", has(r.office) ? sf(r.office)+" sq ft" : null);
  add("ops", "siteCover", "Site cover", has(r.siteCover) ? pct0(r.siteCover) : null);
  add("ops", "trailers", "Trailer spaces", sf(r.trailers));
  add("ops", "carSpaces", "Car spaces", sf(r.carSpaces));
  add("ops", "rail", "Rail", r.rail && r.rail !== "No Rail connection" ? esc(r.rail) : null);

  /* compliance */
  add("compliance", "epc", "EPC", r.epc ? epcPill(r.epc) : '<span class="pill p-none">n/r</span>');
  add("compliance", "breeam", "BREEAM", r.breeam ? esc(r.breeam) : '<span class="unk">n/r</span>');

  /* report sections (legacy form: [{title, rows:(r, api) => [[label, value]]}]) */
  (Array.isArray(CFG.drawer.sections) ? CFG.drawer.sections : []).forEach((sec, si) => {
    let rs = [];
    try { rs = (typeof sec.rows === "function" ? sec.rows(r, API) : []) || []; } catch(e){ report("drawer section", e); }
    rs.forEach(([k, v], i) => add(sec.title || "Report notes", "report"+si+"."+i, k, has(v) ? String(v) : null));
  });

  /* provenance */
  add("provenance", "id", "Building ID", esc(r.id));
  add("provenance", "updated", "Last updated", r.updated || r.updatedBy ? esc([dmy(r.updated), r.updatedBy].filter(Boolean).join(" · ")) : null);
  add("provenance", "agentDisposal", "Disposal agent", r.agentDisposal.length ? esc(r.agentDisposal.join(", ")) : null);
  add("provenance", "agentAcq", "Acquisition agent", r.agentAcq.length ? esc(r.agentAcq.join(", ")) : null);
  /* Field completeness is OFF unless the report opts in (drawer.completeness:
     true): the score counts lease fields an owned building cannot have, and
     no ledger row stands behind it. */
  if(CFG.drawer.completeness === true)
    add("provenance", "completeness", lbl("completeness") || "Field completeness",
      has(r.completeness) ? Math.round(r.completeness)+"% of core fields" : null);

  return {hero, notes, rows, missing, order, mees: meesNote(r)};
}
function drawerHook(name, r, list){
  const fn = CFG.drawer[name];
  if(typeof fn !== "function") return list;
  try { const out = fn(r, list.slice(), API); return Array.isArray(out) ? out : list; }
  catch(e){ report("drawer." + name, e); return list; }
}

function openDrawer(r){
  if(!r || !r.id) return;
  r = DATA.find(d => d.id === r.id) || r;
  lastFocus = document.activeElement;
  S.selId = r.id;
  byId("drLoc").textContent = [r.region, r.corridor && r.corridor !== "N/A" ? r.corridor : null].filter(Boolean).join(" · ");
  const txt = (fn, name, dflt) => { if(typeof fn !== "function") return dflt;
    try { const v = fn(r, API); return has(v) ? String(v) : dflt; } catch(e){ report("drawer." + name, e); return dflt; } };
  byId("drTitle").textContent = txt(CFG.drawer.title, "title", r.short);
  /* The subtitle never repeats the title: the full address when it says more
     than the short name, otherwise town and postcode (each only if the title
     does not already hold it). The park only when the address does not
     already name every part of it. drawer.subtitle(r, api) replaces it. */
  // compared on words, so "Unit 4, Acme Park, Townsville" already names the park "Acme Park Townsville"
  const words = s => " " + String(s || "").toLowerCase().replace(/[^a-z0-9]+/g, " ").trim() + " ";
  const inTitle = s => words(r.short).indexOf(words(s)) >= 0;
  const same = !r.name || r.name === r.short;
  const parkIn = r.park && String(r.park).split(/\s*,\s*/).filter(Boolean)
    .every(p => words(same ? r.short : r.name).indexOf(words(p)) >= 0);
  const park = r.park && r.park !== r.short && !parkIn ? r.park : null;
  const subParts = same ? [park, r.town, r.postcode].filter(p => p && !inTitle(p)) : [r.name, park].filter(Boolean);
  byId("drAddr").textContent = txt(CFG.drawer.subtitle, "subtitle", subParts.join("  ·  "));

  const M = drawerModel(r);
  const hero = drawerHook("hero", r, M.hero);
  let notes = M.notes;
  /* the "report" note: whatever drawer.note(r, api) returns (html). No unit
     field feeds it by default; a report that keeps its own per-building
     wording in units.json returns that field here, escaped. */
  if(typeof CFG.drawer.note === "function"){
    let n = null;
    try { n = CFG.drawer.note(r, API); } catch(e){ report("drawer.note", e); }
    if(has(n)) notes = notes.concat([{key:"report", html:String(n)}]);
  }
  notes = drawerHook("notes", r, notes);
  let rows = drawerHook("rows", r, M.rows).filter(x => x && has(x.value));
  /* honour {after: key}: move such a row to just after that key. A stock key
     this unit has no value for places the row where that key would have been;
     a key the drawer does not have at all (a typo, or a report row missing
     here) leaves the row at the end of its section, with one console warning. */
  rows.filter(x => x.after).forEach(x => {
    const i = rows.indexOf(x), j = rows.findIndex(y => y.key === x.after);
    if(j >= 0){
      rows.splice(i, 1);
      const k = rows.findIndex(y => y.key === x.after);
      rows.splice(k + 1, 0, Object.assign({}, x, {sec: rows[k].sec}));
      return;
    }
    const oi = M.order.findIndex(o => o.key === x.after);
    if(oi < 0){
      warnOnce("drawer: row '" + x.key + "' is placed after '" + x.after + "', which this drawer does not have " +
        "(a typo, or a row with no value on this unit); it stays at the end of its section");
      return;
    }
    const sec = M.order[oi].sec;
    rows.splice(i, 1);
    let at = -1;
    for(let p = oi - 1; p >= 0 && at < 0; p--){
      const k = rows.findIndex(y => y.key === M.order[p].key && y.sec === sec);
      if(k >= 0) at = k + 1;
    }
    if(at < 0){ const f = rows.findIndex(y => y.sec === sec); at = f < 0 ? rows.length : f; }
    rows.splice(at, 0, Object.assign({}, x, {sec}));
  });

  let html = '<div class="dr-hero">' + hero.slice(0, 4).map(c =>
    '<div><b>'+(has(c.value) ? esc(c.value) : nrBig)+'</b><em>'+esc(c.caption || "")+'</em></div>').join("") + '</div>';
  notes.forEach(n => { if(n && has(n.html)) html += '<div class="dr-note">'+n.html+'</div>'; });

  const dl = sec => rows.filter(x => x.sec === sec).map(x =>
    '<dt>'+esc(x.label)+'</dt><dd'+(x.cls ? ' class="'+esc(x.cls)+'"' : '')+'>'+x.value+'</dd>').join("");
  const custom = [...new Set(rows.map(x => x.sec))].filter(s => !DR_SECS.some(d => d[0] === s));
  /* the flags as recorded: a yes is a chip ("Cross-docked"); a no reads
     labels.flagNo ("Cross-docked: no"), or is left out when that label is "" */
  const flags = ["coldStore","crossDock","circ360","gatehouse","truckwash","hgvFuel","vmu"]
    .map(k => [lbl("flags." + k) || k, r[k]]);
  const flagYes = flags.filter(f=>f[1]===true);
  const flagNo = lbl("flagNo") ? flags.filter(f=>f[1]===false) : [];
  const title = sec => lbl("sections." + (sec === "lease" && r.owned ? "leaseOwned" : sec));
  let mees = M.mees;
  if(typeof CFG.drawer.mees === "function"){
    try { const v = CFG.drawer.mees(r, mees, API); mees = has(v) ? String(v) : null; } catch(e){ report("drawer.mees", e); }
  }
  DR_SECS.forEach(([sec]) => {
    if(sec === "provenance") custom.forEach(c => { const b = dl(c);
      if(b) html += '<div class="dr-sec"><h3>'+esc(c)+'</h3><dl class="dr-g">'+b+'</dl></div>'; });
    const body = dl(sec);
    if(sec === "ops"){
      if(!body && !flagYes.length && !flagNo.length) return;
      html += '<div class="dr-sec"><h3>'+esc(title("ops"))+'</h3>'+(body ? '<dl class="dr-g">'+body+'</dl>' : '')+
        ((flagYes.length||flagNo.length) ? '<div class="dr-flags" style="margin-top:'+(body?'16px':'0')+'">'+
          flagYes.map(f=>'<span class="flag-y">'+esc(f[0])+'</span>').join("")+
          flagNo.map(f=>'<span class="flag-n">'+esc(lbl("flagNo", f[0], r))+'</span>').join("")+'</div>' : '')+'</div>';
      return;
    }
    if(sec === "compliance"){
      html += '<div class="dr-sec"><h3>'+esc(title("compliance"))+'</h3><dl class="dr-g">'+body+'</dl>'+
        (mees ? '<div class="dr-note">'+esc(mees)+'</div>' : '')+'</div>';
      return;
    }
    if(!body) return;
    const gap = sec === "provenance" && M.missing.length && lbl("missing")
      ? '<div class="dr-gap">'+esc(lbl("missing", "\u0000")).replace("\u0000", "<b>"+esc(M.missing.join(", "))+"</b>")+'</div>' : '';
    html += '<div class="dr-sec"><h3>'+esc(title(sec))+'</h3><dl class="dr-g">'+body+'</dl>'+gap+'</div>';
  });

  byId("drBody").innerHTML = html;
  byId("drBody").scrollTop = 0;
  byId("drawer").classList.add("on");
  byId("drawer").setAttribute("aria-hidden","false");
  byId("scrim").classList.add("on");
  byId("drClose").focus();

  const m = markers[r.id];
  if(m && map){
    const reduce = window.matchMedia("(prefers-reduced-motion:reduce)").matches;
    map.setView([r.lat,r.lng], Math.max(map.getZoom(), 9), {animate:!reduce});
    m.setStyle({color:THEME.sem.hot, weight:3.5, dashArray:null});   // --hot on light ground (accent is 1.6:1 on white)
  }
  // toggleAttribute sets an empty string, which never matches
  // tr[aria-selected="true"] — the designed selected state never fired.
  ROOT.querySelectorAll("#tbody tr").forEach(tr=>{
    if(tr.dataset.id===r.id) tr.setAttribute("aria-selected","true");
    else tr.removeAttribute("aria-selected");
  });
}

function closeDrawer(){
  byId("drawer").classList.remove("on");
  byId("drawer").setAttribute("aria-hidden","true");
  byId("scrim").classList.remove("on");
  if(S.selId && markers[S.selId]) markers[S.selId].setStyle({color:markers[S.selId]._edge || "#fff", weight:2});
  S.selId = null;
  ROOT.querySelectorAll("#tbody tr[aria-selected]").forEach(tr=>tr.removeAttribute("aria-selected"));
  if(lastFocus && lastFocus.focus) lastFocus.focus();
}

/* ============================================================ FILTERS
   Stock filters: group (chips; a select above 8 groups), landlord, region,
   tenure. A report may add {field, label, all} (a select over a field's
   values) or {id, label, test} (an on/off chip). A filter only appears when
   its dimension has at least two values in this export. */
function resolveFilters(){
  const want = Array.isArray(CFG.filters) ? CFG.filters : ["group","landlord","region","tenure"];
  const distinct = f => [...new Set(DATA.map(f).filter(has))];
  FILTERS = [];
  want.forEach(x => {
    if(x === "group"){
      if(GROUP.enabled) FILTERS.push({id:"group", kind:"chips", label:GROUP.short, many: GROUP.order.length > 8});
    } else if(x === "landlord"){
      // Third-party landlords of leased units only: offering an owned unit's
      // landlord value would return a unit the page says has no landlord, and
      // an intra-group landlord is not exposure. Leases with a group company as
      // landlord get one option of their own.
      const v = distinct(r => r.owned || r.landlordIntra ? null : r.landlord).sort((a,b)=>a.localeCompare(b,"en-GB"));
      const intra = DATA.some(r => !r.owned && r.landlordIntra);
      if(v.length >= 2 || (v.length && intra)) FILTERS.push({id:"landlord", kind:"select", label:"Landlord", intra,
        // the intra set is one option, in the page's words ("Group landlords", or "Acme itself" with one occupier)
        options: v.map(x => [x, x]).concat(intra ? [[INTRA_KEY, lbl("intraSet")]] : []),
        values: v, all:"All landlords ("+v.length+(intra && GROUP.enabled ? " + group" : "")+")",
        match:(r,val)=> val === INTRA_KEY ? (!r.owned && r.landlordIntra) : (!r.owned && !r.landlordIntra && r.landlord===val)});
    } else if(x === "region"){
      const v = distinct(r => r.region).sort((a,b)=>a.localeCompare(b,"en-GB"));
      if(v.length >= 2) FILTERS.push({id:"region", kind:"select", label:"Region", values:v.concat(DATA.some(r=>!r.region)?[NR]:[]),
        all:"All regions", match:(r,val)=>(r.region||NR)===val});
    } else if(x === "tenure"){
      if(DATA.some(r=>r.owned) && DATA.some(r=>!r.owned)) FILTERS.push({id:"tenure", kind:"select", label:"Tenure",
        options:[["Owned","Owned"],["Leased","Leased"]], all:"Owned and leased",
        match:(r,val)=> val==="Owned" ? r.owned : !r.owned});
    } else if(x && x.field){
      const v = distinct(r => r[x.field]).map(String).sort((a,b)=>a.localeCompare(b,"en-GB"));
      if(v.length >= 2) FILTERS.push({id:x.id || x.field, kind:"select", label:x.label || x.field, values:v,
        all:x.all || "All", match:(r,val)=>String(r[x.field])===val});
    } else if(x && x.id && typeof x.test === "function"){
      const test = r => { try { return !!x.test(r); } catch(e){ return false; } };
      const n = DATA.filter(test).length;
      if(n > 0 && n < DATA.length) FILTERS.push({id:x.id, kind:"toggle", label:x.label || x.id, test, n});
    }
  });
}
function buildControls(){
  const wrap = byId("filterWrap"), before = byId("btnReset");
  wrap.querySelectorAll(".f-group").forEach(n => n.remove());
  FILTERS.forEach(f => {
    const g = document.createElement("div"); g.className = "f-group";
    if(f.kind === "chips" && !f.many){
      g.id = "fGroups";
      g.innerHTML = '<span class="f-lab">'+esc(f.label)+'</span>' + GROUP.order.filter(k=>k!==NR).map(k=>{
        const n = DATA.filter(r=>r._g===k).length;
        return '<button class="chip" type="button" data-g="'+esc(k)+'" aria-pressed="false">'+
          '<span class="sw" style="background:'+GC(k)+'"></span>'+esc(k)+
          '<span class="ct">'+n+'</span></button>';
      }).join("");
      g.querySelectorAll(".chip").forEach(b => b.onclick = () => toggleGroup(b.dataset.g));
    } else if(f.kind === "chips"){
      g.innerHTML = '<label class="f-lab" for="f-group">'+esc(f.label)+'</label><select id="f-group" autocomplete="off">'+
        '<option value="">All ('+GROUP.order.filter(k=>k!==NR).length+')</option>'+
        GROUP.order.filter(k=>k!==NR).map(k=>'<option value="'+esc(k)+'">'+esc(k)+'</option>').join("")+'</select>';
      g.querySelector("select").onchange = e => { S.groups.clear(); if(e.target.value) S.groups.add(e.target.value); renderAll(); };
    } else if(f.kind === "select"){
      const opts = f.options || f.values.map(v=>[v,v]);
      g.innerHTML = '<label class="f-lab" for="f-'+esc(f.id)+'">'+esc(f.label)+'</label>'+
        '<select id="f-'+esc(f.id)+'" autocomplete="off"><option value="">'+esc(f.all)+'</option>'+
        opts.map(([v,l])=>'<option value="'+esc(v)+'">'+esc(l)+'</option>').join("")+'</select>';
      g.querySelector("select").onchange = e => { S.sel[f.id] = e.target.value; renderAll(); };
    } else if(f.kind === "toggle"){
      g.innerHTML = '<button class="chip" type="button" data-t="'+esc(f.id)+'" aria-pressed="false">'+esc(f.label)+
        '<span class="ct">'+f.n+'</span></button>';
      g.querySelector(".chip").onclick = () => { S.tog[f.id] = !S.tog[f.id]; renderAll(); };
    }
    wrap.insertBefore(g, before);
  });
  byId("btnReset").onclick = reset;
  byId("filterBar").hidden = false;
}
function syncControls(){
  FILTERS.forEach(f => {
    if(f.kind === "select"){ const s = byId("f-"+f.id); if(s) s.value = S.sel[f.id] || ""; }
    if(f.kind === "toggle"){ const b = ROOT.querySelector('.chip[data-t="'+f.id+'"]');
      if(b) b.setAttribute("aria-pressed", S.tog[f.id] ? "true" : "false"); }
    if(f.kind === "chips" && f.many){ const s = byId("f-group"); if(s) s.value = [...S.groups][0] || ""; }
  });
  ROOT.querySelectorAll("#fGroups .chip").forEach(b=>
    b.setAttribute("aria-pressed", S.groups.has(b.dataset.g) ? "true" : "false"));
}
function toggleGroup(g){
  if(g === "__other"){                       // the folded tail, as one
    const all = GROUP.folded.every(k => S.groups.has(k));
    GROUP.folded.forEach(k => { if(all) S.groups.delete(k); else S.groups.add(k); });
  } else if(S.groups.has(g)) S.groups.delete(g); else S.groups.add(g);
  renderAll();
}
function setFilter(id, value){
  if(id === "group"){
    S.groups.clear();
    (Array.isArray(value) ? value : has(value) ? [value] : []).forEach(v => S.groups.add(v));
  } else if(FILTERS.some(f => f.id === id && f.kind === "toggle")) S.tog[id] = !!value;
  else S.sel[id] = has(value) ? String(value) : "";
  renderAll();
}
function reset(){
  S.groups.clear(); S.sel = {}; S.tog = {};
  renderAll();
}
function filterSnapshot(){
  const o = {group:[...S.groups]};
  FILTERS.forEach(f => { if(f.kind === "select") o[f.id] = S.sel[f.id] || ""; if(f.kind === "toggle") o[f.id] = !!S.tog[f.id]; });
  return o;
}

/* ================================================================= CSV */
/* The stock CSV columns: [id, header, field | (r, api) => value]. A report
   picks and orders them with csv.columns (ids, or [header, field|fn]), adds
   more with csv.extra ([header, field|fn]), formats one with
   csv.format {id or header: (value, r, api) => value}, and transforms or
   skips a whole row with csv.row((r, api) => object | null). Owned units
   have NO landlord (the value EverGreen leaves there goes to its own column). */
const CSV_STOCK = [
  ["id","Building ID","id"], ["name", () => T("{Unit}"), "name"], ["town","Town","town"], ["postcode","Postcode","postcode"],
  ["region","Region","region"], ["corridor","Road corridor","corridor"], ["park","Logistics park","park"],
  ["group", () => GROUP.label, r => toStr(r[GROUP.full]) || (r._g !== NR ? r._g : null)],
  ["tenure","Tenure", r => r.owned ? lbl("state.owned") : r.tenure],
  ["leaseState","Lease state", r => lbl("state." + r._ls)],       // the page's words (labels.state)
  ["landlord","Landlord", r => r.owned ? null : r.landlord],
  ["landlordIntra", () => lbl("intraCsv") || "Landlord is the client", r => !r.owned && r.landlordIntra ? "Yes" : null],
  ["landlordOnRecord","Landlord named on an owned record (confirm title)", r => r.owned && !r.landlordIntra ? r.landlord : null],
  ["size","Size sq ft","size"], ["siteAcres","Site acres","siteAcres"], ["quality","Quality","quality"],
  ["leaseStart","Lease start","leaseStart"], ["leaseTerm","Lease term yrs","leaseTerm"], ["expiry","Lease expiry","expiry"],
  ["breakDate","Break date","breakDate"], ["rentReview","Rent review","rentReview"],
  ["rent","Achieved rent per sq ft","rent"], ["rentPa","Rent per annum (recorded)","rentPa"], ["dealDate","Deal date","dealDate"],
  ["contractedOut","Contracted out of the 1954 Act", r => r.contractedOut === true ? "Yes" : r.contractedOut === false ? "No" : null],
  ["epc","EPC","epc"], ["breeam","BREEAM","breeam"], ["eaves","Eaves m","eaves"], ["yard","Yard depth m","yard"],
  ["dockDoors","Dock doors","dockDoors"], ["power","Power KVA","power"],
  ["coldStore","Cold storage", r => r.coldStore === true ? "Yes" : r.coldStore === false ? "No" : null],
  ["lat","Latitude","lat"], ["lng","Longitude","lng"]
];
function csvColumns(){
  const stock = {}; CSV_STOCK.forEach(c => { stock[c[0]] = c; });
  const base = Array.isArray(CFG.csv.columns) ? CFG.csv.columns : CSV_STOCK.map(c => c[0]);
  const col = x => typeof x === "string" ? (stock[x] ? {id:x, h:stock[x][1], get:stock[x][2]} : {id:x, h:x, get:x})
    : Array.isArray(x) && x.length ? {id: typeof x[1] === "string" ? x[1] : String(x[0]), h:x[0], get:x[1] || x[0]} : null;
  return base.map(col).concat((Array.isArray(CFG.csv.extra) ? CFG.csv.extra : []).map(col)).filter(Boolean)
    .map(c => Object.assign(c, {h: typeof c.h === "function" ? c.h() : String(c.h)}));
}
function exportCsv(){
  const cols = csvColumns(), fmt = CFG.csv.format || {};
  const rows = sortRows(visible()).map(r => {
    if(typeof CFG.csv.row !== "function") return r;
    try { return CFG.csv.row(r, API); } catch(e){ report("csv.row", e); return r; }
  }).filter(Boolean);
  const valueOf = (c, r) => {
    let v;
    try { v = typeof c.get === "function" ? c.get(r, API) : r[c.get]; } catch(e){ v = null; }
    const f = fmt[c.id] || fmt[c.h];
    if(typeof f === "function"){ try { v = f(v, r, API); } catch(e){ report("csv.format", e); } }
    return v === true ? "Yes" : v === false ? "No" : Array.isArray(v) ? v.join("; ") : v;
  };
  const q = v => (v===null||v===undefined||v==="") ? "" :
    /[",\n]/.test(String(v)) ? '"'+String(v).replace(/"/g,'""')+'"' : String(v);
  const csv = [cols.map(c=>q(c.h)).join(",")]
    .concat(rows.map(r=>cols.map(c=>q(valueOf(c, r))).join(","))).join("\r\n");
  const blob = new Blob(["﻿"+csv], {type:"text/csv;charset=utf-8"});
  const a = document.createElement("a");
  const base = (CFG.csv.name || (META.client ? META.client + " Portfolio" : "Portfolio")).replace(/[^\w-]+/g,"_");
  a.href = URL.createObjectURL(blob);
  a.download = base + "_" + rows.length + "_" + String(noun(rows.length, "unit")).replace(/[^\w-]+/g,"_") + ".csv";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
}

/* ============================================================== PANELS */
let ORDER = [];                 // resolved, visible panel specs in page order
const PANEL_BY_ID = {};
function panelOrder(){
  const base = Array.isArray(CFG.panels) ? CFG.panels.slice()
    : ["map","expiry","rent","landlords","quality","findings","table"];
  const ids = base.map(x => typeof x === "string" ? x : (x && x.id)).filter(Boolean);
  CUSTOM.forEach(p => {
    if(ids.includes(p.id)) return;
    const at = p.after && ids.indexOf(p.after) >= 0 ? ids.indexOf(p.after) + 1
      : p.before && ids.indexOf(p.before) >= 0 ? ids.indexOf(p.before)
      : ids.indexOf("table") >= 0 ? ids.indexOf("table") : ids.length;
    ids.splice(at, 0, p.id);
  });
  const custom = {}; CUSTOM.forEach(p => { custom[p.id] = p; });
  const seen = new Set();
  return ids.map(id => {
    if(seen.has(id)) return null; seen.add(id);
    const spec = custom[id] || STOCK[id];
    if(!spec){ report("panels", "unknown panel '" + id + "'"); return null; }
    return spec;
  }).filter(Boolean);
}
function copyOf(p, key){
  const c = CFG.copy[p.id];
  return c && c[key] !== undefined ? c[key] : p[key];
}
function setCopy(p, rows){
  const f = p._frame; if(!f) return;
  if(f.title) f.title.textContent = val(copyOf(p, "title"), rows);
  if(f.sub) f.sub.innerHTML = val(copyOf(p, "sub"), rows);
  if(f.basis && !p._empty) f.basis.innerHTML = val(copyOf(p, "basis"), rows);
}
function chunkBlocks(run){
  const rows = Math.ceil(run.length / 3), out = [];
  let i = 0;
  for(let r = 0; r < rows; r++){
    const size = Math.ceil((run.length - i) / (rows - r));
    out.push(run.slice(i, i + size)); i += size;
  }
  return out;
}
function frameFor(p, host, block){
  const d = document.createElement("div");
  const idc = "p-" + p.id;
  if(block){
    d.className = "blk"; d.id = idc; d.dataset.panel = p.id;
    d.innerHTML = '<h3></h3><p class="sub"></p><div class="p-body"></div><p class="basis"></p>';
    host.appendChild(d);
    return {root:d, title:d.querySelector("h3"), sub:d.querySelector(".sub"), body:d.querySelector(".p-body"),
            basis:d.querySelector(".basis")};
  }
  host.innerHTML = '<div class="sec-head"><h2></h2><p class="sec-note"></p></div><div class="p-body"></div><p class="basis"></p>';
  return {root:host.parentNode, title:host.querySelector("h2"), sub:host.querySelector(".sec-note"),
          body:host.querySelector(".p-body"), basis:host.querySelector(".basis")};
}
/* A report's CSS. "&" in a SELECTOR stands for the scope: the panel for a
   panel's css, the whole dashboard view for DASH.set({css}). An "&" inside a
   quoted string, a comment or a declaration value ("A&B", url(a&b.png)) is
   left alone; replacing every "&" broke those. At-rule preludes (@media
   print) are kept as written. A selector without "&" is NOT scoped. */
function scopeAmp(css, scope){
  css = String(css || "");
  let out = "", buf = "", q = null;
  const selector = s => {                      // replace & outside quotes
    let r = "", qq = null;
    for(let k = 0; k < s.length; k++){
      const ch = s[k];
      if(qq){ r += ch; if(ch === "\\"){ r += s[++k] || ""; } else if(ch === qq) qq = null; continue; }
      if(ch === '"' || ch === "'"){ qq = ch; r += ch; continue; }
      r += ch === "&" ? scope : ch;
    }
    return r;
  };
  for(let i = 0; i < css.length; i++){
    const c = css[i];
    if(q){ buf += c; if(c === "\\"){ buf += css[++i] || ""; } else if(c === q) q = null; continue; }
    if(c === '"' || c === "'"){ q = c; buf += c; continue; }
    if(c === "/" && css[i+1] === "*"){
      const j = css.indexOf("*/", i + 2), e = j < 0 ? css.length : j + 2;
      out += buf + css.slice(i, e); buf = ""; i = e - 1; continue;
    }
    if(c === "{"){ out += (buf.trim().charAt(0) === "@" ? buf : selector(buf)) + c; buf = ""; continue; }
    if(c === "}" || c === ";"){ out += buf + c; buf = ""; continue; }
    buf += c;
  }
  return out + buf;
}
function buildPanels(){
  const main = byId("main"); main.innerHTML = "";
  if(CFG.css && !byId("dash-report-css")){
    const st = document.createElement("style"); st.id = "dash-report-css";
    st.textContent = scopeAmp(CFG.css, "#view-dash"); ROOT.prepend(st);
  }
  ORDER = []; Object.keys(PANEL_BY_ID).forEach(k => delete PANEL_BY_ID[k]);
  const list = panelOrder().map(p => {
    let w;
    try { w = p.when ? p.when(DATA, API) : true; } catch(e){ report("panel " + p.id + " when()", e); w = false; }
    if(w === false || w === null || w === undefined) return null;
    if(typeof w === "string" && (CFG.emptyPanels === "hide" || copyOf(p, "empty") === "hide")) return null;
    return {p, msg: typeof w === "string" ? w : null};
  }).filter(Boolean);
  let first = true, i = 0;
  const sectionFor = (tone, id) => {
    const sec = document.createElement("section");
    sec.className = tone === "white" ? "tone-white" : (first ? "" : "band");
    if(id) sec.id = "p-" + id;
    const wrap = document.createElement("div"); wrap.className = "wrap"; sec.appendChild(wrap);
    main.appendChild(sec); first = false;
    return wrap;
  };
  const place = (entry, frame) => {
    const p = entry.p; p._frame = frame; p._empty = !!entry.msg; p._w = 0;
    frame.root.dataset.panel = p.id;
    if(p.css){ const st = document.createElement("style");
      st.textContent = scopeAmp(p.css, "#view-dash [data-panel=\"" + p.id + "\"]"); frame.root.prepend(st); }
    ORDER.push(p); PANEL_BY_ID[p.id] = p;
    if(entry.msg){ emptyState(frame.body, entry.msg); if(frame.basis) frame.basis.innerHTML = ""; return; }
    if(p.init){
      try { const b = p.init(frame.body, API); if(b && b.nodeType === 1){ if(frame.basis) frame.basis.remove(); frame.basis = b; } }
      catch(e){ report("panel " + p.id + " init()", e); }
    }
  };
  while(i < list.length){
    const e = list[i];
    if(e.p.layout === "block"){
      const run = [];
      while(i < list.length && list[i].p.layout === "block") run.push(list[i++]);
      chunkBlocks(run).forEach(row => {
        const wrap = sectionFor(row[0].p.tone);
        const grid = document.createElement("div"); grid.className = "grid-" + row.length; wrap.appendChild(grid);
        row.forEach(en => place(en, frameFor(en.p, grid, true)));
      });
    } else {
      const wrap = sectionFor(e.p.tone, e.p.id);
      if(e.p.id === "findings") wrap.parentNode.classList.add("findings");
      place(e, frameFor(e.p, wrap, false));
      i++;
    }
  }
  // Charts relay out when their column changes width (not on height changes,
  // which their own redraw causes).
  const ro = new ResizeObserver(entries => entries.forEach(en => {
    const p = en.target.__panel; if(!p) return;
    const w = Math.round(en.contentRect.width);
    if(p._w && Math.abs(w - p._w) > 1) requestAnimationFrame(() => renderPanel(p, true));
    p._w = w;
  }));
  ORDER.forEach(p => { if(!p._empty && !p.noResize && p._frame){ p._frame.body.__panel = p; ro.observe(p._frame.body); } });
}
function renderPanel(p, resizeOnly){
  if(!p._frame) return;
  const rows = p.live === false ? DATA : visible();
  if(p.live === false && p._drawn && !resizeOnly) return;
  if(!resizeOnly) setCopy(p, rows);
  if(p._empty) return;
  try { p.render(p._frame.body, rows, API); p._drawn = true; }
  catch(e){ report("panel " + p.id + " render()", e);
    emptyState(p._frame.body, "This panel could not be drawn from the data in this export.", "Unavailable"); }
  if(p._frame.body) p._w = Math.round(p._frame.body.clientWidth);
}

/* ============================================================== RENDER */
function renderReadout(){
  const v = visible(), s = sum(v);
  byId("readout").innerHTML =
    'Showing <b>'+v.length+'</b> of '+plural(DATA.length,"unit")+' <span class="dim">·</span> <b>'+
    (sf(s)||0)+'</b> sq ft <span class="dim">· '+pctS(s,TOTAL_SF)+'% of portfolio</span>';
  byId("btnReset").hidden = !anyFilter();
  syncControls();
}
function renderAll(){
  renderReadout(); renderMetrics();
  ORDER.forEach(p => renderPanel(p));
}

function renderTitle(){
  const t = CFG.title || {};
  const h1 = val(t.h1, DATA) || META.client || "Portfolio";
  const light = t.h1Light !== undefined ? val(t.h1Light, DATA) : (META.sector || "Property portfolio");
  byId("tH1").innerHTML = esc(h1) + (light ? '<br><span class="light">'+esc(light)+'</span>' : '');
  const eb = val(t.eyebrow, DATA);
  byId("tEyebrow").hidden = !eb; byId("tEyebrow").textContent = eb;
  const m = summary(DATA);
  const lede = t.lede !== undefined ? val(t.lede, DATA) :
    esc(pluralWord(DATA.length, "unit")) + " and <b>" + msf(m.tot) + " sq ft</b>" +
    (GROUP.enabled ? " across " + word(GROUP.order.filter(k=>k!==NR).length) + " " + esc(GROUP.plural) : "") + ". " +
    (!m.leased.length ? esc(DATA.length === 1 ? T("The {unit} is owned.") : T("Every {unit} is owned.")) :
     !m.own.length ? "All of it is leased" + (m.nll ? ", from " + plural(m.nll, "landlord") : "") + "." :
     m.tot ? "<b>" + pct(m.leasedSf, m.tot) + "%</b> of that floorspace is leased" +
      (m.nll ? ", from " + plural(m.nll, "landlord") : "") + "." : "");
  byId("tLede").innerHTML = lede;
  let meta = t.meta;
  if(typeof meta === "function"){ try { meta = meta(DATA, API); } catch(e){ report("title.meta", e); meta = null; } }
  if(!Array.isArray(meta)) meta = [
    META.exportDate ? "Source: EverGreen export, " + longDate(okIso(META.exportDate)) : "Source: EverGreen export",
    plural(DATA.length, "record"), META.caveat || null];
  byId("tMeta").innerHTML = meta.filter(Boolean).map(s => '<span>'+esc(val(s, DATA))+'</span>').join("");
}
function renderFooter(){
  const f = CFG.footer || {};
  const when = okIso(META.exportDate) ? " dated " + longDate(okIso(META.exportDate)) : "";
  byId("footL").innerHTML = f.left !== undefined ? val(f.left, DATA) :
    '<b>' + esc((META.client ? META.client + " — " : "") + "Portfolio View.") + '</b> Prepared by CBRE from an EverGreen export' +
    when + '. All figures are computed from that export. Where a field was not recorded it is shown as ' +
    '&ldquo;n/r&rdquo; and excluded from every average &mdash; it is never treated as zero.' +
    (META.caveat ? " " + esc(META.caveat) + "." : "");
  byId("footR").innerHTML = f.right !== undefined ? val(f.right, DATA) :
    '<b>' + plural(DATA.length, "unit") + ' &middot; ' + (sf(TOTAL_SF)||0) + ' sq ft</b>' +
    (META.built ? '<br>Built ' + esc(/^\d{4}-\d{2}-\d{2}$/.test(META.built) ? longDate(META.built) : META.built) : '');
}

/* sticky bar: shadow once pinned, and feed its real (wrapped) height to the
   table header. Both read and write the view root, which is where scoping
   puts the tokens — reading --mast from <html> returned nothing, so the
   shadow never appeared, and a --filter-h written to <html> was overridden
   by the root's own 60px, so the column headers pinned behind the bar. */
function wireSticky(){
  const fb = byId("filterBar");
  const mastH = () => parseFloat(getComputedStyle(ROOT).getPropertyValue("--mast")) ||
                      parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--bar-h")) || 56;
  addEventListener("scroll", ()=>{
    if(ROOT.hidden) return;
    fb.classList.toggle("stuck", getComputedStyle(fb).position === "sticky" &&
      fb.getBoundingClientRect().top <= mastH() + 1);
  }, {passive:true});
  const syncFilterH = ()=>{ if(fb.offsetHeight) ROOT.style.setProperty("--filter-h", fb.offsetHeight + "px"); };
  new ResizeObserver(syncFilterH).observe(fb);
  syncFilterH();
}

/* ================================================================= API
   What dash.js and every panel render(el, rows, api) receive. */
const API = {
  // data
  all: DATA, meta: META, asAt: AS_AT, today: TODAY, year: YEAR0,
  get NR(){ return NR; },
  get rows(){ return visible(); },
  get filters(){ return filterSnapshot(); },
  group: GROUP, map: null,
  // lease state: the canonical value the engine counts with (frozen before dash.js ran)
  state: r => r._ls, stateLabel: s => lbl("state." + s) || s, running: r => r._ls === "running",
  // the page's words (labels, §3.2): api.label("state.passed"), api.labels.client
  label: (path, v, r) => lbl(path, v, r), labels: LBL,
  // formatting
  sf, msf, msfT, pct, pctS, money, dmy, longDate, monthYear, my, myy, esc, has, llShort, word, Word,
  noun, plural, pluralWord, andList, cell, UNK, chartFmt,
  sum, by, size: sizeOf, leased: leasedOf, summary: rows => summary(rows || visible()),
  thirdParty: rows => leasedOf(rows).filter(r => r.landlord && !r.landlordIntra),
  eventBand, eventColour: k => EVENT_C[k], eventForm: k => EVENT_FORM[k] || null,
  groupColour: r => groupColour(r), colourOf: k => GC(k),
  // colour and type (design-system.md §3, one table: api.theme)
  theme: THEME, C, palette: PALETTE, ramp: RAMP, hatch: HATCH, onColour, contrast, edge: edgeFor,
  epcColour: k => EPC_C[k] || NEUTRAL, epcPill, stateDot, key: keyHtml, keyable,
  // regulation (uk-rules.md §1)
  mees: () => MEES(), inEW, nation: nationOf, meesNote,
  // interaction
  openDrawer: r => openDrawer(r), setFilter, toggleGroup, reset, refresh: () => renderAll(),
  // chart kit
  width: layoutWidth, svg, ticks, niceStep, axisFmt, hbars, columns, scatter, stack, empty: emptyState,
  csvColumns: () => csvColumns().map(c => ({id:c.id, header:c.h}))
};

/* ================================================================ DASH */
const DASH = window.DASH = {
  version: "1.0",
  errors: [],
  api: API,
  units: DATA,
  meta: META,
  set(cfg){ if(cfg && typeof cfg === "object") merge(CFG, cfg); return DASH; },
  panel(spec){
    if(!spec || !spec.id || typeof spec.render !== "function"){
      report("DASH.panel", "a panel needs an id and a render(el, rows, api) function"); return DASH; }
    const p = Object.assign({layout:"block", live:true}, spec);
    if(p.band && !spec.layout) p.layout = p.band === "full" ? "full" : "block";
    p.layout = p.layout === "full" ? "full" : "block";
    const i = CUSTOM.findIndex(c => c.id === p.id);
    if(i >= 0) CUSTOM[i] = p; else CUSTOM.push(p);
    return DASH;
  },
  stock: STOCK          // the default panels, readable for reference
};

/* ================================================================= BOOT */
let booted = false;
function boot(){
  // "Not recorded" first (groups are keyed by it), then the words that depend on the group dimension
  resolveLabels(false); resolveGroups(); resolveLabels(GROUP.enabled);
  resolveFilters(); resolveMetrics(); buildModes(); resolveColumns(); resolveFindings();
  renderTitle(); renderFooter();
  buildControls(); wireSticky();
  buildPanels();
  if(PANEL_BY_ID.map && !PANEL_BY_ID.map._empty && window.L){
    try { initMap(); } catch(e){ report("map", e); }
  }
  byId("drClose").onclick = closeDrawer;
  byId("scrim").onclick   = closeDrawer;
  document.addEventListener("keydown", e=>{
    if(e.key==="Escape" && byId("drawer").classList.contains("on")) closeDrawer();
  });
  const csv = document.getElementById("btnCsv");
  if(csv) csv.onclick = exportCsv;
  /* Filters are NEVER persisted: every load starts unfiltered (a QA walk after
     a navigation once ran silently in a filtered state). Restored from the
     back-forward cache, the page resets too. */
  addEventListener("pageshow", e => { if(e.persisted) reset(); });
  /* Print: re-lay every chart at the A4 content width, then back. Both the
     print events and the media query, so an emulated print is caught too. */
  const relayout = w => { if(PRINT_W === w) return; PRINT_W = w;
    ORDER.forEach(p => { if(!p._empty && !p.noResize && p._frame) renderPanel(p, true); }); };
  addEventListener("beforeprint", () => relayout(688));
  addEventListener("afterprint", () => relayout(0));
  const mq = window.matchMedia && window.matchMedia("print");
  if(mq && mq.addEventListener) mq.addEventListener("change", e => relayout(e.matches ? 688 : 0));
  renderAll();
}
window.__initDashboard = function(){
  if(booted){ window.__dashResize(); return; }
  booted = true;
  try { boot(); } catch(e){ report("boot", e); }
};
window.__dashResize = function(){
  if(MAP_FIT) MAP_FIT();
  ORDER.forEach(p => { if(!p._empty && !p.noResize && p._frame &&
    Math.abs(p._frame.body.clientWidth - (p._w||0)) > 1) renderPanel(p, true); });
};
window.__dashExportCsv = exportCsv;
window.__dashReset = () => reset();

/* ======================================================= REPORT (dash.js)
   Runs after every definition above and before __initDashboard(). Its own
   function scope, so its names can never collide with the core's; a runtime
   error is logged and the dashboard falls back to its defaults. */
try {
  (function(DASH){
/*__DASH__*/
  })(window.DASH);
} catch(e){ report("dash.js", e); }
</script>
