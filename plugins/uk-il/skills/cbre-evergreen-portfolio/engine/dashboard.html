<script id="dash-core">
"use strict";
/* =====================================================================
   CBRE EverGreen portfolio dashboard — core.
   Inputs arrive through four placeholders (see the header comment). The
   report configures everything through window.DASH (documented in
   reference/dashboard-engine.md); nothing here knows about any client.
   ===================================================================== */
const RAW  = /*__UNITS__*/;
const LAND = /*__LAND__*/null;   // vector basemap, engine/land.json
const META = Object.assign({}, /*__META__*/);

const ROOT = document.getElementById("view-dash") || document.body;
/* Every lookup is confined to this view: the storyline shares the document
   and may use the same ids. */
const byId = id => ROOT.querySelector("#" + (window.CSS && CSS.escape ? CSS.escape(id) : id));

/* ---------------------------------------------------------- formatting */
const UNK = '<span class="unk" title="Not recorded in the source data">n/r</span>';
let   NR  = "Not recorded";          // labels.notRecorded, resolved at boot before anything is grouped
const nf  = new Intl.NumberFormat("en-GB");
const has = v => v !== null && v !== undefined && v !== "" && !(typeof v === "number" && !isFinite(v));
function sf(v){ return has(v) ? nf.format(Math.round(v)) : null; }
/* Millions at a FIXED two decimals, as the storyline prints them (stripping
   trailing zeros put "0.4m" next to "0.44m"). One unit everywhere: a value
   that would round to 0.00m reads "<0.01m", never a switch to "k". */
function msf(v){
  if(!has(v)) return "—";
  if(v === 0) return "0";
  if(Math.abs(v) < 5000) return "<0.01m";
  return (v/1e6).toFixed(2) + "m";
}
/* A KPI tile or a sentence that stands alone: a small selection reads in
   exact sq ft ("7,831") instead of "0.01m". */
function msfT(v){ return has(v) && v > 0 && v < 100000 ? sf(v) : msf(v); }
/* The fewest decimals that print every multiple of `step` exactly: 0.25 -> 2,
   0.5 -> 1, 2 -> 0. (Choosing by the step's size printed 0.25m steps as
   "0.3m, 0.5m, 0.8m": ticks that repeated or lied.) */
function stepDp(step, most){
  for(let d = 0; d < (most == null ? 6 : most); d++){
    const x = step * Math.pow(10, d);
    if(Math.abs(x - Math.round(x)) < 1e-6 * Math.max(1, Math.abs(x))) return d;
  }
  return most == null ? 6 : most;
}
/* A floorspace chart reads in ONE unit on its axis and its value labels:
   millions to fixed decimals, or exact sq ft when the whole scale is under
   100,000 sq ft (where "0.01m, 0.02m" says nothing). */
const SMALL_SCALE = 100000;
const chartFmt = top => top < SMALL_SCALE ? (v => has(v) ? (v ? sf(v) : "0") : "—") : msf;
/* Axis tick labels: one decimal count per axis, taken from the step, so a
   scale never reads "0.5m, 1m" or mixes "400k" with "0.47m". A step finer than
   0.01m, or a scale under 100,000 sq ft, reads in exact sq ft. */
function axisFmt(max, step, unitless){
  if(unitless){ const d = stepDp(step, 4); return v => v.toFixed(d); }
  const d = stepDp(step / 1e6, 3);
  if(d > 2 || max < SMALL_SCALE) return v => !v ? "0" : nf.format(Math.round(v));
  return v => !v ? "0" : (v/1e6).toFixed(d) + "m";
}
function pct(a,b){ return b ? Math.round(a/b*100) : 0; }
/* a share as text: never "0%" for something that exists, never "100%" for
   something that is not everything */
function pctS(a,b){
  if(!b) return "0";
  const p = a / b * 100;
  if(a > 0 && p < .5) return "<1";
  if(a < b && p >= 99.5) return ">99";
  return String(Math.round(p));
}
function money(v){ return has(v) ? "£" + Number(v).toFixed(2) : null; }
function cell(v){ return has(v) ? v : UNK; }
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const MONTH = ["January","February","March","April","May","June","July","August","September",
               "October","November","December"];
const isoDate = iso => iso ? new Date(iso + "T00:00:00Z") : null;
function dmy(iso){
  if(!iso) return null;
  const d = isoDate(iso);
  return String(d.getUTCDate()).padStart(2,"0") + " " + MON[d.getUTCMonth()] + " " + d.getUTCFullYear();
}
function longDate(iso){ if(!iso) return null; const d = isoDate(iso);
  return d.getUTCDate() + " " + MONTH[d.getUTCMonth()] + " " + d.getUTCFullYear(); }
function monthYear(iso){ if(!iso) return null; const d = isoDate(iso);
  return MONTH[d.getUTCMonth()] + " " + d.getUTCFullYear(); }
function my(iso){ if(!iso) return null; const d = isoDate(iso);
  return MON[d.getUTCMonth()] + " " + d.getUTCFullYear(); }
function myy(iso){ if(!iso) return null; const d = isoDate(iso);
  return MON[d.getUTCMonth()] + "-" + String(d.getUTCFullYear()).slice(2); }
function esc(s){ return String(s === null || s === undefined ? "" : s)
  .replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
/* Landlord names come out of EverGreen with legal suffixes and the odd all-caps
   entry. Tidy them for chart labels only — the table and detail panel keep the
   name exactly as recorded. */
function llShort(s){
  if(!has(s)) return NR;
  let t = String(s).replace(/[,\s]+(Limited|Ltd\.?|Plc|LLP)$/i, "");
  if(t === t.toUpperCase() && t.split(/\s+/).length > 1){
    t = t.replace(/\b([A-Z]{4,})\b/g, w => w[0] + w.slice(1).toLowerCase());
  }
  return t;
}
const ONES = ["zero","one","two","three","four","five","six","seven","eight","nine","ten","eleven",
  "twelve","thirteen","fourteen","fifteen","sixteen","seventeen","eighteen","nineteen"];
const TENS = ["","","twenty","thirty","forty","fifty","sixty","seventy","eighty","ninety"];
function word(n){
  n = Math.round(Number(n)||0);
  if(n < 0 || n > 99) return nf.format(n);
  if(n < 20) return ONES[n];
  const t = TENS[Math.floor(n/10)], o = n % 10;
  return o ? t + "-" + ONES[o] : t;
}
const cap  = s => { s = String(s); return s.charAt(0).toUpperCase() + s.slice(1); };
const Word = n => cap(word(n));
/* ONE plural rule for every count on the page: noun(1, "landlord") is
   "landlord", noun(2, "landlord") "landlords", noun(n, "lease", "leases").
   plural() prints the figure ("3 leases"); pluralWord() the word ("Three
   leases", "One landlord": never "One landlords"). A pair such as
   ["has","have"] or ["is","are"] works the same way: noun(n, "has", "have"). */
function noun(n, one, many){
  // "unit", "leased unit", "let unit" follow labels.unit / labels.units ("building")
  if(!many && /(^|\s)unit$/.test(one)) return one.replace(/unit$/, Number(n) === 1 ? LBL.unit : LBL.units);
  return Number(n) === 1 ? one : (many || one + "s");
}
function plural(n, one, many){ return nf.format(n) + " " + noun(n, one, many); }
function pluralWord(n, one, many){ return Word(n) + " " + noun(n, one, many); }
const andList = xs => xs.length < 2 ? xs.join("") : xs.slice(0, -1).join(", ") + " and " + xs[xs.length - 1];
const sizeOf = r => r.size || 0;
const sum = (rows, f) => rows.reduce((a,r)=>{ const v = typeof f === "function" ? f(r) : r[f || "size"];
  return a + (has(v) && isFinite(v) ? Number(v) : 0); }, 0);
function by(rows, key){
  const m = new Map();
  rows.forEach(r => { const k = typeof key === "function" ? key(r) : (has(r[key]) ? r[key] : NR);
    if(!m.has(k)) m.set(k, []); m.get(k).push(r); });
  return [...m.entries()].map(([k, rs]) => ({k, rows:rs, n:rs.length, sf:sum(rs)}))
    .sort((a,b)=>b.sf-a.sf);
}

/* ---------------------------------------------------------- the as-at date */
const okIso = v => (typeof v === "string" && /^\d{4}-\d{2}-\d{2}/.test(v)) ? v.slice(0,10) : null;
const AS_AT = okIso(META.asAt) || okIso(META.exportDate) || new Date().toISOString().slice(0,10);
const TODAY = isoDate(AS_AT);
const YEAR0 = TODAY.getUTCFullYear();

/* ------------------------------------------------------ normalise records
   Every field may be null; EverGreen writes literal 0 for unknown numbers and
   1950-01-01 / 1905-06-01 for unknown dates. The assembler's units.json should
   already be clean — this is a second line of defence so nothing downstream
   ever renders a placeholder as a value. Unknown fields pass through. */
const POS = ["size","siteAcres","siteCover","rent","rentPa","leaseTerm","eaves","yard","office",
  "officeRatio","floorLoad","dockDoors","levelDoors","totalDoors","doorRatio","power","trailers",
  "carSpaces","pcYear","incentive"];
const DATES = ["dealDate","leaseStart","expiry","breakDate","nearestEvent","rentReview","updated"];
const toNum = v => (typeof v === "number" && isFinite(v)) ? v
  : (typeof v === "string" && v.trim() !== "" && isFinite(+v)) ? +v : null;
const toStr = v => (v === null || v === undefined) ? null : (String(v).trim() || null);
const toDate = v => { const d = okIso(v); return (d && d !== "1950-01-01" && d !== "1905-06-01") ? d : null; };
const toBool = v => v === true ? true : v === false ? false : null;
const YEAR_MS = 365.25 * 864e5;
const LEASE_STATES = ["running", "not started", "passed", "undated", "owned"];
const INTRA_KEY = "__intra";          // the landlord filter's value for "a group company as landlord"

const DATA = (Array.isArray(RAW) ? RAW : []).filter(u => u && typeof u === "object").map((u, i) => {
  const r = Object.assign({}, u);
  r.id = toStr(r.id) || ("unit-" + (i+1));
  ["name","short","town","postcode","region","corridor","park","landlord","developer","status",
   "tenure","provenance","quality","epc","breeam","solus","rail","reviewType","updatedBy",
   "group","groupFull","tenantRaw"].forEach(k => { r[k] = toStr(r[k]); });
  r.short = r.short || r.name || r.town || r.id;
  r.name  = r.name || r.short;
  POS.forEach(k => { const v = toNum(r[k]); r[k] = (v !== null && v > 0) ? v : null; });
  ["lat","lng","yearsToExpiry","yearsSinceExpiry","completeness","dealYear","expiryYear"].forEach(k => { r[k] = toNum(r[k]); });
  DATES.forEach(k => { r[k] = toDate(r[k]); });
  if(r.lat !== null && (Math.abs(r.lat) > 90 || (r.lat === 0 && r.lng === 0))) r.lat = r.lng = null;
  if(r.lng !== null && Math.abs(r.lng) > 180) r.lat = r.lng = null;
  if(r.lat === null || r.lng === null){ r.lat = null; r.lng = null; }
  if(r.epc) r.epc = r.epc.toUpperCase().replace(/[^A-G+]/g,"").replace(/\+/,"") || null;
  r.owned = r.owned === true;
  r.landlordIntra = r.landlordIntra === true;
  ["expired","coldStore","crossDock","circ360","gatehouse","truckwash","hgvFuel","vmu","sharedAccess"]
    .forEach(k => { r[k] = toBool(r[k]); });
  r.agentDisposal = Array.isArray(r.agentDisposal) ? r.agentDisposal.filter(has) : [];
  r.agentAcq = Array.isArray(r.agentAcq) ? r.agentAcq.filter(has) : [];
  r.expiryYear = r.expiry ? isoDate(r.expiry).getUTCFullYear() : null;
  /* The lease state, one vocabulary for every view (evergreen_units.py
     lease_state): 'running' | 'not started' | 'passed' | 'undated' | 'owned'.
     A lease that starts after the as-at date is 'not started' and never
     counts as running (WAULT, unexpired, expiry buckets). Taken from the
     canonical field when present, derived with the same rule when not, and
     frozen in r._ls BEFORE dash.js runs: a report may overwrite r.leaseState
     with its own display words without changing what the engine counts. */
  // a canonical value is trusted only while it agrees with the dates (a state
  // with an expiry needs one, "undated" needs none); otherwise it is re-derived
  const canon = LEASE_STATES.includes(r.leaseState) && r.leaseState !== "owned" &&
    ((r.leaseState === "undated") === !r.expiry) ? r.leaseState : null;
  r._ls = r.owned ? "owned" : canon ? canon
    : !r.expiry ? "undated" : r.expiry < AS_AT ? "passed"
    : (r.leaseNotStarted === true || r.started === false || (r.leaseStart && r.leaseStart > AS_AT)) ? "not started"
    : "running";
  if(!LEASE_STATES.includes(r.leaseState)) r.leaseState = r._ls;
  r.expired = r._ls === "passed";                      // = "recorded expiry passed", never "expired lease"
  r.started = r.leaseStart ? r.leaseStart <= AS_AT : (r._ls === "not started" ? false : toBool(r.started));
  r.contractedOut = toBool(r.contractedOut);
  // unexpired term only while the recorded end is ahead; a passed expiry gets
  // yearsSinceExpiry instead, so no average can go negative
  if(r._ls === "passed"){
    r.yearsToExpiry = null;
    if(r.yearsSinceExpiry === null) r.yearsSinceExpiry = +((TODAY - isoDate(r.expiry)) / YEAR_MS).toFixed(2);
  } else if(r.expiry){
    if(r.yearsToExpiry === null) r.yearsToExpiry = +((isoDate(r.expiry) - TODAY) / YEAR_MS).toFixed(2);
    r.yearsSinceExpiry = null;
  } else { r.yearsToExpiry = null; r.yearsSinceExpiry = null; }
  if(r.dealYear === null && r.dealDate) r.dealYear = isoDate(r.dealDate).getUTCFullYear();
  if(!r.dealDate) r.dealYear = r.dealYear && r.dealYear > 1950 ? r.dealYear : null;
  return r;
});
const TOTAL_SF = sum(DATA);
const MAX_SF   = Math.max(1, ...DATA.map(sizeOf));
const GEO      = DATA.filter(r => r.lat !== null);

/* ================================================================ THEME
   ONE table for every colour the engine draws with. It mirrors
   reference/design-system.md §3 (3a semantic, 3b categorical, 3c EPC, 3d
   sequential), which the storyline uses too, so a company and a state have
   the same colour in both views. To re-skin, change this table only.
   The rule it encodes: one chart never uses the same hue for a category and
   a state. Categorical slots exclude every semantic hue; a state drawn beside
   group colours is FORM (a hollow or dashed ring, a hatch, a label). */
const THEME = {
  // 3b, largest group first. Slots 3, 4, 6, 8 and Other are under 3:1 on
  // white and always carry the edge. Above eight groups the tail folds into Other.
  categorical: ["#032842","#885073","#DBD99A","#80BBAD","#778F9C","#C0D4CB","#7F8480","#96B3B6"],
  other: "#E6EAEA",
  edge: "rgba(0,0,0,.30)",                     // --oc-n-edge, 1–1.5px
  // 3a
  sem: { hot:"#003F2D", neutral:"#538184", context:"#E6EAEA", passed:"#A8523A", risk:"#D2785A",
         watch:"#E0A33C", secure:"#3F7F66", owned:"#435254", unknown:"#5C6B66",
         notRec:"#CBD0CC", notRecHatch:"#9AA8A2" },
  // 3c: F and G share a fill (both below the legal minimum); the letter is always printed
  epc: { A:"#23604A", B:"#3F7F66", C:"#80BBAD", D:"#E0A33C", E:"#D2785A", F:"#A8523A", G:"#A8523A" },
  // 3d
  ramp: ["#80BBAD","#5E9C88","#3F7F66","#23604A","#003F2D"],
  // tenure is not in §3: owned = sem.owned, leased = sem.neutral, a regear the sage tint
  tenure: { "Owned":"#435254", "Leased":"#538184", "Leased (regeared)":"#96B3B6" },
  tenureExtra: ["#778F9C","#7F8480","#C0D4CB","#DBD99A"]
};
const PALETTE = THEME.categorical;
const NEUTRAL = THEME.sem.notRec;
const C = { green:"#003F2D", darkGreen:"#012A2D", midnight:"#032842", accent:"#17E88F",
  sage:"#538184", celadon:"#80BBAD", celadonTint:"#C0D4CB", wash:"#E6EAEA", wash2:"#CBD0CC",
  warm:"#D2785A", warmInk:"#A8523A", plum:"#885073", amber:"#E0A33C", ink:"#003F2D",
  body:"#435254", muted:"#5C6B66", line:"#CAD1D3", lineSoft:"#DDE3E1", bg:"#F5F7F7",
  panel:"#FFFFFF", rule:"#B9C2BD", alertBg:"#FBF1ED", hatchStroke:THEME.sem.notRecHatch, neutral:NEUTRAL,
  // semantic roles (3a), by name
  hot:THEME.sem.hot, markNeutral:THEME.sem.neutral, context:THEME.sem.context, passed:THEME.sem.passed,
  risk:THEME.sem.risk, watch:THEME.sem.watch, secure:THEME.sem.secure, owned:THEME.sem.owned,
  unknown:THEME.sem.unknown, other:THEME.other };
const RAMP = THEME.ramp;
const HATCH = "url(#dash-hatch)";
function lum(hex){
  const h = String(hex).replace("#",""); if(h.length < 6) return 0;
  const f = i => { let x = parseInt(h.substr(i,2),16)/255;
    return x <= .03928 ? x/12.92 : Math.pow((x+.055)/1.055, 2.4); };
  return .2126*f(0) + .7152*f(2) + .0722*f(4);
}
function contrast(a, b){ const x = lum(a), y = lum(b); return (Math.max(x,y)+.05)/(Math.min(x,y)+.05); }
/* white or CBRE green, whichever reads better on the given fill */
function onColour(hex){
  if(!/^#[0-9a-f]{6}$/i.test(hex)) return C.ink;
  return contrast("#FFFFFF", hex) >= contrast(C.ink, hex) ? "#FFFFFF" : C.ink;
}

const TENURE_C = THEME.tenure;
const TENURE_EXTRA = THEME.tenureExtra;

/* lease-event urgency, from the lease state: always shipped with a date or a
   word beside the colour. Undated and not-started leases are FORM, not a
   fill: a hollow ring and a dashed ring in --sem-unknown. */
/* ============================================================== LABELS
   Every client-facing word the engine prints outside panel copy (copy.* has
   the titles, subs and bases), with its default in ONE place. A report
   changes any of them with DASH.set({labels:{...}}) (deep-merged;
   dashboard-engine.md §3.2 lists them). A value is plain text (the engine
   escapes it) or a function (v, r, api) => text. Tokens: {v} the value
   passed, {client} / {Client} the client's short name, {unit} / {units} /
   {Unit} / {Units} the word for one record. The intra-group phrases depend on
   whether the group dimension is on: with one occupier there is no "group",
   only the client itself. */
function labelDefaults(groupOn){
  return {
    unit: "unit", units: "units",
    notRecorded: "Not recorded",
    state: { running:"Running", "not started":"Not yet started", passed:"Recorded expiry passed",
             undated:"No expiry recorded", owned:"Owned" },
    band: { soon:"Within 2 years", mid:"2–5 years", long:"Over 5 years" },
    bucket: { passed:"Recorded\nexpiry passed", notStarted:"Not yet\nstarted", undated:"Not recorded" },
    quality: "Recorded as {v}",
    completeness: "Field completeness",
    flags: { coldStore:"Cold storage", crossDock:"Cross-docked", circ360:"360° HGV circulation",
             gatehouse:"Gatehouse", truckwash:"Truckwash", hgvFuel:"HGV refuelling", vmu:"VMU" },
    flagNo: "{v}: no",
    sections: { identity:"Identity", lease:"Tenure and lease", leaseOwned:"Tenure", ops:"Operational fit",
                compliance:"Compliance and ESG", provenance:"Record provenance" },
    rows: {},
    missing: "Not recorded in the source: {v}.",
    popupButton: "Full record",
    noMatch: "No {units} match these filters.",
    clearAll: "Clear all",
    client: toStr(META.clientShort) || toStr(META.client) || "the client",
    intraSet: groupOn ? "Group landlords" : "{Client} itself",
    intraTag: groupOn ? "group company" : "the client",
    intraWho: groupOn ? "a group company" : "{client} itself",
    intraExcluded: groupOn ? "group landlords excluded" : "leases from {client} itself excluded",
    intraCsv: groupOn ? "Landlord is a group company" : "Landlord is {client} itself"
  };
}
const LBL = labelDefaults(false);
function fillT(s, v){
  return String(s).replace(/\{(v|client|Client|unit|units|Unit|Units)\}/g, (m, k) =>
    k === "v" ? (v === null || v === undefined ? "" : String(v)) :
    k === "client" ? LBL.client : k === "Client" ? cap(LBL.client) :
    k === "unit" ? LBL.unit : k === "units" ? LBL.units : k === "Unit" ? cap(LBL.unit) : cap(LBL.units));
}
const T = s => fillT(s);                      // an engine literal with {units} / {client} tokens
/* lbl("state.passed"), lbl("quality", r.quality, r): the resolved label as text */
function lbl(path, v, r){
  let x = String(path).split(".").reduce((o, k) => (o === null || o === undefined) ? o : o[k], LBL);
  if(typeof x === "function"){ try { x = x(v, r, API); } catch(e){ report("labels." + path, e); x = null; } }
  return (x === null || x === undefined || x === false) ? "" : fillT(x, v);
}

function eventBand(r){
  if(r._ls !== "running") return lbl("state." + r._ls);
  const y = r.yearsToExpiry;
  if(y <= 2) return lbl("band.soon");
  if(y <= 5) return lbl("band.mid");
  return lbl("band.long");
}
/* keyed by the words, so they are rebuilt once the labels are resolved */
let EVENT_C = {}, EVENT_FORM = {}, EVENT_ORDER = [];
function buildEventKeys(){
  const s = k => lbl("state." + k), b = k => lbl("band." + k);
  EVENT_ORDER = [s("passed"), b("soon"), b("mid"), b("long"), s("not started"), s("undated"), s("owned")];
  EVENT_C = {};
  [THEME.sem.passed, THEME.sem.risk, THEME.sem.watch, THEME.sem.secure, THEME.sem.unknown, THEME.sem.unknown,
   THEME.sem.owned].forEach((c, i) => { EVENT_C[EVENT_ORDER[i]] = c; });
  EVENT_FORM = {}; EVENT_FORM[s("not started")] = "dashed"; EVENT_FORM[s("undated")] = "hollow";
}
buildEventKeys();
const lsOf = r => r._ls;

/* EverGreen's asset-quality vocabulary; anything else is shown as recorded */
const QUALITY = {
  "Second Hand (Built Before 2010)": {l:"Pre-2010",    c:"#80BBAD", o:0},
  "Second Hand (Built After 2010)":  {l:"Post-2010",   c:"#3F7F66", o:1},
  "New Grade A":                     {l:"New Grade A", c:"#003F2D", o:2}
};
const EPC_C = THEME.epc;
const EPC_RANK = {A:1,B:2,C:3,D:4,E:5,F:6,G:7};

/* ================================================================ CONFIG */
const CFG = { copy:{}, map:{}, group:{}, mees:{}, drawer:{}, popup:{}, csv:{}, table:{}, labels:{} };
/* the labels (above), resolved at boot: the defaults for this portfolio (the
   intra-group words follow the group dimension), then the report's own */
function resolveLabels(groupOn){
  Object.keys(LBL).forEach(k => { delete LBL[k]; });
  merge(LBL, labelDefaults(groupOn));
  merge(LBL, CFG.labels || {});
  NR = lbl("notRecorded") || "Not recorded";
  buildEventKeys();
}
const WARNED = new Set();
function warnOnce(msg){
  if(WARNED.has(msg)) return;
  WARNED.add(msg);
  console.warn("[dashboard] " + msg);
}
const CUSTOM = [];            // DASH.panel() specs in registration order
const PLAIN = v => v && typeof v === "object" && !Array.isArray(v) && typeof v !== "function";
function merge(dst, src){
  Object.keys(src || {}).forEach(k => {
    const v = src[k];
    if(PLAIN(v) && PLAIN(dst[k])) merge(dst[k], v);
    else dst[k] = v;
  });
  return dst;
}

/* ================================================================ STATE */
const S = { groups:new Set(), sel:{}, tog:{}, mode:"group", sort:"size", dir:-1, selId:null };
let FILTERS = [];             // resolved filter defs, see resolveFilters()
function visible(){
  return DATA.filter(r =>
    (S.groups.size === 0 || S.groups.has(r._g)) &&
    FILTERS.every(f => f.kind === "chips" ? true
      : f.kind === "toggle" ? (!S.tog[f.id] || f.test(r))
      : (!S.sel[f.id] || f.match(r, S.sel[f.id]))));
}
const anyFilter = () => S.groups.size > 0 || Object.values(S.sel).some(Boolean) ||
                        Object.values(S.tog).some(Boolean);

/* ================================================================ GROUPS
   The "group" dimension (operating company / occupier entity) is whatever
   field the report names; default `group`. Colours come from the ordered
   palette in floorspace order unless the report pins them. */
const GROUP = { field:"group", full:"groupFull", label:"Operating company", short:"Company",
  plural:"operating companies", order:[], colours:{}, enabled:false };
function resolveGroups(){
  const g = CFG.group || {};
  GROUP.field = g.field || "group";
  GROUP.full  = g.full || (GROUP.field === "group" ? "groupFull" : GROUP.field);
  GROUP.label = g.label || "Operating company";
  GROUP.short = g.short || (g.label ? g.label : "Company");
  GROUP.plural = g.plural || (GROUP.label.toLowerCase().replace(/y$/,"ie") + "s");
  DATA.forEach(r => { r._g = toStr(r[GROUP.field]) || NR; });
  const agg = by(DATA, r => r._g);
  let order = agg.map(a => a.k).filter(k => k !== NR);
  if(Array.isArray(g.order)){
    const pinned = g.order.filter(k => order.includes(k));
    order = pinned.concat(order.filter(k => !pinned.includes(k)));
  }
  if(agg.some(a => a.k === NR)) order.push(NR);
  GROUP.order = order;
  /* Slots in floorspace order, largest first, assigned once from the whole
     portfolio (design-system §3b), so a company keeps its colour in every
     panel and in the storyline. A report pins colours only for house
     colours. Beyond eight groups the tail folds into Other: one colour, one
     legend row "Other (n)", each still filterable by name. */
  const used = new Set(), pin = g.colours || {};
  Object.keys(pin).forEach(k => used.add(String(pin[k]).toUpperCase()));
  const free = PALETTE.filter(c => !used.has(c.toUpperCase()));
  GROUP.colours = {}; GROUP.folded = [];
  order.forEach(k => {
    if(pin[k]){ GROUP.colours[k] = pin[k]; return; }
    if(k === NR){ GROUP.colours[k] = NEUTRAL; return; }
    const c = free.shift();
    if(c) GROUP.colours[k] = c; else { GROUP.colours[k] = THEME.other; GROUP.folded.push(k); }
  });
  GROUP.enabled = order.filter(k => k !== NR).length >= 2;
}
const GC = k => GROUP.colours[k] || NEUTRAL;
/* with the group dimension off, marks are the unemphasised neutral (§3a) */
const groupColour = r => GROUP.enabled ? GC(r._g) : C.markNeutral;
const isFolded = k => GROUP.folded && GROUP.folded.includes(k);

/* ============================================================ COPY HELPERS */
function val(v, rows){
  if(typeof v === "function"){
    try { v = v(rows, API); }
    catch(e){ report("copy", e); v = ""; }
  }
  return (v === null || v === undefined || v === false) ? "" : String(v);
}
function report(where, e){
  const msg = where + ": " + (e && e.message || e);
  if(DASH.errors.includes(msg)) return;      // a broken panel re-fails on every filter; log it once
  DASH.errors.push(msg);
  console.error("[dashboard] " + msg, e);
}

/* ============================================================ CHART KIT
   Shared by the stock panels and exposed to dash.js as api.*, so a new panel
   is drawn by the same code and cannot drift from the house style. */
/* Lay a chart out at its container's width when that is narrower than the
   design width (so 10px type never renders at 8px), and never scale one up by
   more than 1.25x (so a lone block cannot balloon its type). */
/* In print every chart is laid out at the A4 content width (PRINT_W) so its
   viewBox matches the page: a 1200-unit chart printed at 688px shrank 10px
   type to 5.7px. Set on beforeprint / the print media query, cleared after. */
let PRINT_W = 0;
function layoutWidth(el, design){
  if(PRINT_W) return PRINT_W;
  const w = el ? el.clientWidth : 0;
  if(!w) return design;
  return w <= design ? Math.max(w, 200) : Math.max(design, w / 1.25);
}
function svg(W, H, inner, label){
  return '<svg viewBox="0 0 '+Math.round(W)+' '+Math.round(H)+'" role="img" aria-label="'+
    esc(label || "")+'">'+inner+'</svg>';
}
function niceStep(raw){
  if(!(raw > 0)) return 1;
  const p = Math.pow(10, Math.floor(Math.log10(raw))), f = raw / p;
  return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * p;
}
/* Ticks from 0 to the first step AT OR ABOVE the maximum, so the top
   gridline is never under the tallest mark (it used to stop below it).
   Draw the scale to `top`, not to the data maximum. */
function ticks(max, target){
  const step = niceStep((max || 1) / (target || 5)), out = [];
  const top = Math.max(step, Math.ceil((max || 0) / step - 1e-9) * step);
  for(let v = 0; v <= top + step * 1e-6; v += step) out.push(+v.toFixed(8));
  return { step, ticks: out, top };
}
/* The edge for a pale mark (design-system §3b --oc-n-edge): any fill under 3:1
   on white (categorical slots 3, 4, 6, 8 and Other, --sem-watch, EPC C and D)
   carries a 1–1.5px rgba(0,0,0,.30) stroke. Null when the fill holds up. */
function edgeFor(hex){
  if(!/^#[0-9a-f]{6}$/i.test(hex) || contrast(hex, "#FFFFFF") >= 3) return null;
  return THEME.edge;
}
const edgeAttr = fill => { const e = edgeFor(fill); return e ? ' stroke="'+e+'" stroke-width="1"' : ''; };
/* ONE rule for short strings the API takes: a metric's label and note, an
   empty state's message and heading, and every label are TEXT, escaped by the
   engine; pass {html:"…"} where markup is meant. Panel copy (sub, basis,
   empty), findings, drawer values and notes, the lede and the footer are
   HTML, as dashboard-engine.md marks them. */
const isHtml = v => !!(v && typeof v === "object" && has(v.html));
const textOrHtml = v => isHtml(v) ? String(v.html) : esc(v);
function valT(v, rows){
  if(typeof v === "function"){ try { v = v(rows, API); } catch(e){ report("copy", e); v = ""; } }
  if(isHtml(v)) return v;
  return (v === null || v === undefined || v === false) ? "" : String(v);
}
function emptyState(el, msg, head){
  const h = (head === null || head === undefined || head === "") ? NR : head;
  el.innerHTML = '<div class="empty"><b>'+textOrHtml(h)+'</b><span>'+textOrHtml(msg)+'</span></div>';
}
/* A clickable mark is a keyboard button too: Tab reaches it, Enter/Space
   fires it, and its accessible name is its tooltip. */
function keyable(n, go, name){
  n.setAttribute("tabindex", "0");
  n.setAttribute("role", "button");
  const t = n.querySelector("title");
  if(name || t) n.setAttribute("aria-label", name || t.textContent);
  n.addEventListener("click", go);
  n.addEventListener("keydown", e => { if(e.key === "Enter" || e.key === " "){ e.preventDefault(); go(); } });
}
/* One tab stop per item: the segments of a stacked bucket share a data-i, so
   only the first is focusable (named for the bucket); the rest stay
   mouse targets (tabindex -1). The chart svg becomes role=group so assistive
   tech can reach the buttons inside it (role=img hides its children). */
function bindClicks(el, list, fn){
  if(!fn) return;
  const first = new Set();
  el.querySelectorAll(".clk[data-i]").forEach(n => {
    const i = n.dataset.i, it = list[+i], go = () => { if(it) fn(it); };
    if(first.has(i)){ n.setAttribute("tabindex", "-1"); n.addEventListener("click", go); return; }
    first.add(i);
    keyable(n, go, it && (it.title || (it.label != null ? String(it.label) : null)));
  });
  const s = el.querySelector("svg[role=img]");
  if(s && first.size) s.setAttribute("role", "group");
}

/* Horizontal bars, labelled at left, value at right (landlord style).
   items: [{label, value, colour?, hot?, hatch?, muted?, inert?, text?, title?, full?}]
   Bars are the unemphasised neutral unless an item sets `colour` or `hot`
   (the one emphasis, --hot). `hatch` is ONLY for "not recorded". */
function hbars(el, items, o){
  o = o || {};
  const W = layoutWidth(el, o.design || 470);
  // label column measured from the longest label (no fixed cap), at most half
  // the chart; only a name that still cannot fit is cut, keeping a tooltip
  const longest = Math.max(0, ...items.map(b => String(b.label).length));
  const rowH = o.rowH || 25, PR = o.valueWidth || 54;
  const LW = o.labelWidth || Math.round(Math.min(Math.max(longest * 6.2 + 14, 60), W * .5));
  const iw = Math.max(40, W - LW - PR);
  const max = o.max || Math.max(1, ...items.map(b => b.value || 0));
  const chars = Math.max(8, Math.floor((LW - 12) / 6.2));
  const fmt = o.format || chartFmt(max);          // one unit per chart: exact sq ft under 100,000
  let g = "";
  items.forEach((b, i) => {
    const y = i*rowH + 4, w = Math.max(0, (b.value || 0) / max * iw), lab = String(b.label);
    const click = o.onClick && !b.inert, cut = lab.length > chars+1;
    const fill = b.hatch ? HATCH : (b.colour || (b.hot ? C.hot : C.markNeutral));
    // one tooltip, naming the item once: its own title, else "full name · value"
    const tip = b.title || ((b.full || lab) + " · " + (b.text != null ? b.text : fmt(b.value)));
    // the whole row is the target (24px tall, label included) and the tab stop
    if(click) g += '<rect class="hit clk" data-i="'+i+'" x="0" y="'+(y-5)+'" width="'+W+'" height="'+(rowH-1)+
         '" fill="none"><title>'+esc(tip)+'</title></rect>';
    // a name that must be cut keeps its full text as the group's tooltip
    g += (cut ? '<g><title>'+esc(b.full || lab)+'</title>' : '')+
         '<text class="'+(b.muted?"ax":"ax-b")+'" x="'+(LW-9)+'" y="'+(y+13)+'" text-anchor="end">'+
         esc(cut ? lab.slice(0, chars)+"…" : lab)+'</text>'+(cut ? '</g>' : '')+
         '<rect class="bar'+(click?" clk":"")+'" data-i="'+i+'" x="'+LW+'" y="'+y+
         '" width="'+Math.max(w,1)+'" height="15" fill="'+fill+'"'+
         (b.hatch?' stroke="#9AA8A2" stroke-width="1"':edgeAttr(fill))+'>'+
         (click ? '' : '<title>'+esc(tip)+'</title>')+'</rect>'+
         '<text class="val" x="'+(LW+w+7)+'" y="'+(y+12)+'">'+esc(b.text != null ? b.text : fmt(b.value))+'</text>';
  });
  // an unlabelled chart still gets a spoken summary of its data
  el.innerHTML = svg(W, items.length*rowH + 10, g, o.label ||
    items.slice(0, 12).map(b => b.label + ": " + (b.text != null ? b.text : fmt(b.value))).join("; "));
  bindClicks(el, items, o.onClick);
}

/* A key above a chart (direct labels for the colours and the forms in it).
   items: [{label, colour?, form?: "hatch" | "dashed" | "hollow"}] -> html */
function keyHtml(items){
  if(!items || !items.length) return "";
  return '<div class="ck" aria-hidden="true">' + items.map(k => {
    const e = k.colour && edgeFor(k.colour);
    const sw = k.form === "hatch" ? '<i class="ck-sw hatch"></i>'
      : k.form === "dashed" ? '<i class="ck-sw dashed"></i>'
      : k.form === "hollow" ? '<i class="ck-sw hollow"></i>'
      : '<i class="ck-sw" style="background:'+k.colour+(e ? ';box-shadow:inset 0 0 0 1px '+e : '')+'"></i>';
    return '<span>' + sw + esc(k.label) + '</span>';
  }).join("") + '</div>';
}

/* Stacked columns on a floorspace (or any) scale, with detached buckets
   (gap:true) for "not recorded" or another set-apart state.
   buckets: [{label, sub?, segments:[{value, colour?, title?, fill?, stroke?, dash?, hatch?}],
              hatch?, gap?, muted?, hot?, style?:{fill, stroke, dash}, title?}]
   A label may carry "\n" for a second line. A bucket `style` (or a segment's
   own fill/stroke/dash) overrides the fill: a STATE shown beside group colours
   is drawn as form (a dashed outline, a hatch), never as another hue.
   Options: o.rows = true forces the row layout, which is otherwise chosen when
   a label cannot fit its column slot (a phone, or many buckets); o.key = the
   key items above the chart (keyHtml); o.format = value labels (msf);
   o.axis = tick labels (default millions, one unit per axis); o.H; o.design;
   o.onClick(bucket); o.label = the aria-label. */
function columns(el, buckets, o){
  o = o || {};
  const W = layoutWidth(el, o.design || 1200);
  const tot = b => b.segments.reduce((a,s)=>a+(s.value||0),0);
  const max = Math.max(1, ...buckets.map(tot));
  const fmt = o.format || chartFmt(ticks(max, 5).top);   // one unit per chart, as the axis
  const lines = b => String(b.label).split("\n");
  const segs = (b, i, place) => {
    if(b.hatch){ const t = tot(b);
      return t ? place(0, t, {fill:HATCH, stroke:"#9AA8A2"}, b.title || (b.label.replace("\n"," ")+" · "+sf(t))) : ""; }
    let acc = 0, out = "";
    b.segments.forEach(s => { if(!(s.value > 0)) return;
      const st = Object.assign({fill: s.colour || (b.hot ? C.hot : C.markNeutral)}, b.style || {},
        s.hatch ? {fill:HATCH, stroke:"#9AA8A2"} : {}, s.fill ? {fill:s.fill} : {},
        s.stroke ? {stroke:s.stroke} : {}, s.dash ? {dash:s.dash} : {});
      out += place(acc, s.value, st, s.title || ""); acc += s.value; });
    return out;
  };
  const paint = st => ' fill="'+st.fill+'"' +
    (st.stroke ? ' stroke="'+st.stroke+'" stroke-width="'+(st.dash ? 1.5 : 1)+'"' : edgeAttr(st.fill)) +
    (st.dash ? ' stroke-dasharray="'+(st.dash === true ? "4 3" : st.dash)+'"' : '');
  let g = "", H;
  // columns only while every label line fits its own slot
  const need = Math.max(0, ...buckets.map(b => Math.max(...lines(b).map(l => l.length),
    String(b.sub == null ? "" : b.sub).length)));
  const slot = (W - 64 - 16 - 26) / Math.max(1, buckets.length);
  if(!o.rows && slot >= Math.max(40, need * 6.3 + 10)){
    const nl = Math.max(1, ...buckets.map(b => lines(b).length));
    H = (o.H || 290) + (nl - 1) * 13;
    const PL=64, PR=16, PT=22, PB=52 + (nl - 1) * 13, iw = W-PL-PR, ih = H-PT-PB;
    const gap = 26, n = buckets.length, bw = (iw-gap)/n, barW = Math.min(132, bw-22);
    const tk = ticks(max, 5), top = tk.top;           // the scale runs to a gridline at or above the max
    const y = v => PT + ih - (v/top)*ih;
    const axl = o.axis || axisFmt(top, tk.step);
    tk.ticks.forEach(v => {
      g += '<line class="gl" x1="'+PL+'" y1="'+y(v)+'" x2="'+(W-PR)+'" y2="'+y(v)+'"/>'+
           '<text class="ax" x="'+(PL-9)+'" y="'+(y(v)+3.5)+'" text-anchor="end">'+esc(axl(v))+'</text>';
    });
    buckets.forEach((b,i)=>{
      const x = PL + i*bw + (b.gap?gap:0) + (bw-barW)/2, t = tot(b);
      // the column slot (bar, value and labels) is the target and the tab stop
      if(o.onClick) g += '<rect class="hit clk" data-i="'+i+'" x="'+(PL + i*bw + (b.gap?gap:0) + 4)+'" y="'+PT+
        '" width="'+Math.max(24, bw-8)+'" height="'+(ih+40+(nl-1)*13)+'" fill="none"><title>'+
        esc(b.title || (lines(b).join(" ")+" · "+sf(t)))+'</title></rect>';
      g += segs(b, i, (acc, v, st, title) => {
        const h = (v/top)*ih;
        return '<rect class="bar clk" data-i="'+i+'" x="'+x+'" y="'+(y(acc)-h)+'" width="'+barW+
          '" height="'+Math.max(h,0)+'"'+paint(st)+'>'+(title?'<title>'+esc(title)+'</title>':'')+'</rect>'; });
      if(t) g += '<text class="val" x="'+(x+barW/2)+'" y="'+(y(t)-9)+'" text-anchor="middle">'+esc(fmt(t))+'</text>';
      lines(b).forEach((ln, li) => {
        g += '<text class="'+(b.gap||b.muted?"ax":"ax-b")+'" x="'+(x+barW/2)+'" y="'+(H-PB+20+li*13)+
             '" text-anchor="middle">'+esc(ln)+'</text>'; });
      if(b.sub != null) g += '<text class="val-d" x="'+(x+barW/2)+'" y="'+(H-PB+35+(nl-1)*13)+'" text-anchor="middle">'+
           esc(b.sub)+'</text>';
    });
    g += '<line class="bl" x1="'+PL+'" y1="'+(PT+ih)+'" x2="'+(W-PR)+'" y2="'+(PT+ih)+'"/>';
  } else {
    // the label column is measured from the text, never a fixed width
    const lab = b => lines(b).join(" ");
    const LW = Math.round(Math.min(W * .45, Math.max(60, Math.max(...buckets.map(b =>
      Math.max(lab(b).length, String(b.sub == null ? "" : b.sub).length))) * 6.3 + 12)));
    const PR = 52, rowH = 42, iw = Math.max(60, W - LW - PR);
    let yy = 4;
    buckets.forEach((b,i)=>{
      if(b.gap) yy += 10;
      const t = tot(b), y0 = yy;
      if(o.onClick) g += '<rect class="hit clk" data-i="'+i+'" x="0" y="'+(y0-2)+'" width="'+W+'" height="'+(rowH-4)+
        '" fill="none"><title>'+esc(b.title || (lab(b)+" · "+sf(t)))+'</title></rect>';
      g += '<text class="'+(b.gap||b.muted?"ax":"ax-b")+'" x="0" y="'+(y0+13)+'">'+esc(lab(b))+'</text>'+
           (b.sub != null ? '<text class="val-d" x="0" y="'+(y0+27)+'">'+esc(b.sub)+'</text>' : '');
      g += segs(b, i, (acc, v, st, title) =>
        '<rect class="bar clk" data-i="'+i+'" x="'+(LW + acc/max*iw)+'" y="'+(y0+3)+'" width="'+
        Math.max(v/max*iw, .5)+'" height="22"'+paint(st)+'>'+(title?'<title>'+esc(title)+'</title>':'')+'</rect>');
      // an empty bucket prints no value: its sub line already says so
      if(t) g += '<text class="val" x="'+(LW + t/max*iw + 7)+'" y="'+(y0+18)+'">'+esc(fmt(t))+'</text>';
      yy += rowH;
    });
    g += '<line class="bl" x1="'+LW+'" y1="0" x2="'+LW+'" y2="'+(yy-8)+'"/>';
    H = yy;
  }
  el.innerHTML = keyHtml(o.key) + svg(W, H, g, o.label || buckets.map(b => lines(b).join(" ") + ": " + fmt(tot(b))).join("; "));
  bindClicks(el, buckets, o.onClick);
}

/* Scatter with sized circles and an optional dashed reference line (rent
   style). points: [{x, y, size?, colour?, title?}] */
function scatter(el, points, o){
  o = o || {};
  const W = layoutWidth(el, o.design || 470), H = o.H || 290, PL=44, PR=18, PT=18, PB=46;
  const iw = W-PL-PR, ih = H-PT-PB;
  let g = "";
  if(points.length < (o.minPoints || 2)){
    emptyState(el, o.emptyText || "Not enough recorded values in this selection to plot.", "Nothing to plot");
    return;
  }
  const xs = points.map(p=>p.x), ys = points.map(p=>p.y);
  const x0 = Math.min(...xs) - (o.xPad == null ? 1 : o.xPad), x1 = Math.max(...xs) + (o.xPad == null ? 1 : o.xPad);
  const yMax = Math.max(...ys), yTop = Math.ceil(yMax) || 1;
  const ys_ = ticks(yTop, 5), y1 = Math.ceil(yTop / ys_.step) * ys_.step;
  const X = v => PL + (v-x0)/(x1-x0 || 1)*iw;
  const Y = v => PT + ih - v/y1*ih;
  const yd = stepDp(ys_.step, 2);   // one decimal count per axis, from the step (2.5 -> "£2.5")
  const yf = o.yFormat || (v => "£" + v.toFixed(yd));
  for(let v = 0; v <= y1 + 1e-9; v += ys_.step){
    const vv = +v.toFixed(6);
    g += '<line class="gl" x1="'+PL+'" y1="'+Y(vv)+'" x2="'+(W-PR)+'" y2="'+Y(vv)+'"/>'+
         '<text class="ax" x="'+(PL-8)+'" y="'+(Y(vv)+3.5)+'" text-anchor="end">'+esc(yf(vv))+'</text>';
  }
  const xstep = [1,2,5,10,20,25,50].find(s => iw * s / ((x1-x0) || 1) >= 40) || 50;
  const xf = o.xFormat || (v => String(v));
  for(let v = Math.ceil(x0/xstep)*xstep; v <= x1; v += xstep){
    g += '<text class="ax" x="'+X(v)+'" y="'+(H-PB+18)+'" text-anchor="middle">'+esc(xf(v))+'</text>';
  }
  const rad = p => typeof p.r === "number" && p.r > 0 ? p.r : (4 + 9*Math.sqrt((p.size||0)/MAX_SF));
  if(o.ref && has(o.ref.y)){
    /* The reference label takes the first of four slots (right/left of the
       frame, above/below the line) that no circle touches, so it can never
       sit on a mark. Right-above is tried first. */
    const lab = String(o.ref.label || ""), lw = lab.length * 6.1, yl = Y(o.ref.y);
    const slots = [[W-PR, yl-6, "end"], [W-PR, yl+14, "end"], [PL+4, yl-6, "start"], [PL+4, yl+14, "start"]];
    const hit = ([x, y, a]) => { const x0 = a === "end" ? x - lw : x, x1 = x0 + lw, y0 = y - 9, y1 = y + 2;
      return points.reduce((s, p) => { const cx = X(p.x), cy = Y(p.y), r = rad(p) + 1;
        const dx = Math.max(0, Math.max(x0 - cx, cx - x1)), dy = Math.max(0, Math.max(y0 - cy, cy - y1));
        return s + (dx*dx + dy*dy < r*r ? 1 : 0); }, 0); };
    const best = slots.map(s => [s, hit(s)]).sort((a, b) => a[1] - b[1])[0][0];
    // body ink, not a semantic hue: an average is not a lease state
    g += '<line x1="'+PL+'" y1="'+yl+'" x2="'+(W-PR)+'" y2="'+yl+
         '" stroke="#435254" stroke-width="1" stroke-dasharray="3 3"/>'+
         '<text class="val-d" x="'+best[0]+'" y="'+best[1]+'" text-anchor="'+best[2]+'" '+
         'style="fill:#435254">'+esc(lab)+'</text>';
  }
  const idx = points.map((p,i)=>i).sort((a,b)=>(points[b].size||0)-(points[a].size||0));
  // 24px targets: an unpainted r>=12 hit circle per point, all drawn beneath
  // the visible dots, is the tab stop; a direct click on a dot still hits it
  if(o.onClick) idx.forEach(i => { const p = points[i];
    g += '<circle class="hit clk" data-i="'+i+'" cx="'+X(p.x)+'" cy="'+Y(p.y)+'" r="'+Math.max(12, rad(p))+
         '" fill="none">'+(p.title?'<title>'+esc(p.title)+'</title>':'')+'</circle>'; });
  idx.forEach(i => { const p = points[i];
    const r = rad(p);
    g += '<circle class="sc-dot'+(o.onClick?" clk":"")+'" data-i="'+i+'" cx="'+X(p.x)+'" cy="'+Y(p.y)+
         '" r="'+r+'" fill="'+(p.colour||C.markNeutral)+'" fill-opacity=".72" stroke="'+
         (edgeFor(p.colour||C.markNeutral)||'#fff')+'" stroke-width="1.5">'+
         (p.title?'<title>'+esc(p.title)+'</title>':'')+'</circle>';
  });
  g += '<line class="bl" x1="'+PL+'" y1="'+(PT+ih)+'" x2="'+(W-PR)+'" y2="'+(PT+ih)+'"/>'+
       (o.xLabel ? '<text class="ax" x="'+PL+'" y="'+(H-PB+34)+'">'+esc(o.xLabel)+'</text>' : '');
  el.innerHTML = svg(W, H, g, o.label || ("Scatter of " + points.length + " points" +
    (o.xLabel ? " against " + o.xLabel.toLowerCase() : "")));

}

/* 100% stacked bars, one per row (asset quality / EPC style).
   stacks: [{title, items:[{label, value, colour?, hatch?, title?}], total?}] */
function stack(el, stacks, o){
  o = o || {};
  const W = layoutWidth(el, o.design || 470), gapY = 108;
  let g = "";
  stacks.forEach((st, si) => {
    const yTop = 24 + si*gapY;
    const total = st.total || st.items.reduce((a,it)=>a+(it.value||0),0) || 1;
    let x = 0;
    g += '<text class="ax-b" x="0" y="'+(yTop-9)+'">'+esc(st.title)+'</text>';
    st.items.forEach((it, ii) => {
      const w = ((it.value||0)/total)*W; if(w <= 0) return;
      const fill = it.hatch ? HATCH : (it.colour || C.green);
      g += '<rect class="bar'+(o.onClick?' clk':'')+'" data-i="'+si+'.'+ii+'" x="'+x+'" y="'+yTop+
           '" width="'+Math.max(w-1.5,0.5)+'" height="30" fill="'+fill+'"'+
           (it.hatch?' stroke="#9AA8A2" stroke-width="1"':edgeAttr(fill))+'>'+
           '<title>'+esc(it.title || (it.label+" · "+(sf(it.value)||0)))+'</title></rect>';
      // the % sits inside only where it reaches 4.5:1 against the fill;
      // otherwise it moves to the label beneath
      const ink = it.hatch ? C.ink : onColour(fill);
      it._in = w > 46 && (it.hatch || contrast(ink, fill) >= 4.5);
      if(it._in) g += '<text x="'+(x+w/2-1)+'" y="'+(yTop+19)+'" text-anchor="middle" '+
           'style="font:400 10px/1 var(--font-mono);fill:'+ink+'">'+
           Math.round((it.value||0)/total*100)+'%</text>';
      x += w;
    });
    let lx = 0;
    st.items.forEach(it => {
      const w = ((it.value||0)/total)*W; if(w <= 0) return;
      if(w > 58) g += '<text class="ax" x="'+(lx+w/2)+'" y="'+(yTop+45)+'" text-anchor="middle">'+esc(it.label)+
        (it._in ? '' : ' ' + Math.round((it.value||0)/total*100) + '%')+'</text>';
      lx += w;
    });
  });
  el.innerHTML = svg(W, 24 + (stacks.length-1)*gapY + 58, g, o.label || stacks.map(st => st.title + ": " +
    st.items.filter(i => i.value > 0).map(i => i.label + " " + (sf(i.value) || 0)).join(", ")).join(". "));
  if(o.onClick){
    el.querySelectorAll(".clk[data-i]").forEach(n => {
      const [a,b] = n.dataset.i.split(".").map(Number);
      keyable(n, () => o.onClick(stacks[a].items[b], stacks[a]));
    });
    const s = el.querySelector("svg[role=img]"); if(s) s.setAttribute("role", "group");
  }
}

/* ============================================================== METRICS */
function summary(rows, opt){
  opt = opt || {};
  const tot   = sum(rows);
  const own   = rows.filter(r=>r.owned), ownSf = sum(own);
  const leased= rows.filter(r=>!r.owned), leasedSf = sum(leased);
  // running = started and not yet at its recorded end. A lease that starts
  // after the as-at date is NOT running: it never counts in WAULT or "expiring".
  const live  = leased.filter(r => r._ls === "running");
  const liveSf= sum(live);
  const wault = liveSf ? live.reduce((a,r)=>a+sizeOf(r)*r.yearsToExpiry,0)/liveSf : null;
  const lapsed   = leased.filter(r => r._ls === "passed");          // "recorded expiry passed"
  const lapsedSf = sum(lapsed);
  const notStarted = leased.filter(r => r._ls === "not started");
  const years = opt.years || 5;
  const horizon = new Date(TODAY); horizon.setUTCFullYear(horizon.getUTCFullYear()+years);
  const soon    = live.filter(r=> isoDate(r.expiry) <= horizon);
  const soonSf  = sum(soon);
  /* Third-party exposure: leased units only (EverGreen leaves a landlord value
     on units the client owns; counting them overstated concentration by
     several million sq ft), and never an intra-group landlord (landlordIntra:
     the client itself or a group company is not exposure). */
  const tp = leased.filter(r => r.landlord && !r.landlordIntra), tpSf = sum(tp);
  const intra = leased.filter(r => r.landlordIntra);
  const ll = {};
  tp.forEach(r=>{ ll[r.landlord] = (ll[r.landlord]||0) + sizeOf(r); });
  const llv = Object.values(ll).sort((a,b)=>b-a);
  const k = opt.n || 6;
  const topK = llv.slice(0,k).reduce((a,b)=>a+b,0);
  const noExp = leased.filter(r=>!r.expiry);
  return {tot,rows:rows.length,own,ownSf,leased,leasedSf,live,liveSf,running:live,runningSf:liveSf,wault,
          lapsed,lapsedSf,passed:lapsed,passedSf:lapsedSf,notStarted,notStartedSf:sum(notStarted),
          soon,soonSf,years,horizon,tp,tpSf,intra,intraSf:sum(intra),topK,top1:llv[0]||0,k,nll:llv.length,
          noExp,noExpSf:sum(noExp),sizeless: rows.filter(r=>!r.size).length};
}
const METRICS = {
  floorspace: (m) => ({v:msfT(m.tot), u:"sq ft", l:"Total floorspace",
    n: plural(m.rows,"unit") + (m.sizeless ? " · " + m.sizeless + " with no size recorded" : "")}),
  units: (m) => ({v:nf.format(m.rows), l:T("{Units}"), n: msfT(m.tot) + " sq ft"}),
  leased: (m) => ({v: m.tot ? pctS(m.leasedSf,m.tot)+"%" : null, l:"Leased, not owned",
    n: m.rows ? msfT(m.leasedSf)+" sq ft · "+plural(m.leased.length,"unit") : T("no {units} in view")}),
  owned: (m) => ({v: m.tot ? pctS(m.ownSf,m.tot)+"%" : null, l:"Owned",
    n: m.rows ? msfT(m.ownSf)+" sq ft · "+plural(m.own.length,"unit") : T("no {units} in view")}),
  wault: (m) => ({v: m.wault!==null ? m.wault.toFixed(1) : null, u:"yrs", l:"WAULT to expiry",
    n: (m.live.length ? plural(m.live.length,"running lease")+" · "+msfT(m.liveSf)+" sq ft"
                      : "no running leases in view") +
       (m.notStarted.length ? " · " + m.notStarted.length + " " + lbl("state.not started").toLowerCase() + ", excluded" : "")}),
  expiring: (m) => ({v: msfT(m.soonSf), u:"sq ft", l:"Expiring by "+m.horizon.getUTCFullYear(),
    n: plural(m.soon.length,"running lease")+" "+noun(m.soon.length,"ends","end")+" in "+word(m.years)+" "+noun(m.years,"year")}),
  landlordTop: (m) => {
    const ex = lbl("intraExcluded"), excl = m.intra.length && ex ? " · " + ex : "";
    // the label names the holders: "Largest landlord holds" (n:1 or one landlord), "Five landlords hold"
    const holders = k => k === 1 ? "Largest landlord holds" : pluralWord(k, "landlord") + " " + noun(k, "holds", "hold");
    if(!m.tpSf || !m.nll) return {v:null, l:holders(m.k),
      n: m.leased.length ? "no third-party landlord in view" + excl : T("no leased {units} in view")};
    const tail = " third-party leased · " + plural(m.nll, "landlord") + excl;
    if(m.nll > m.k) return {v:pctS(m.topK,m.tpSf)+"%", l:holders(m.k),
      n: msfT(m.topK)+" sq ft of the "+msfT(m.tpSf)+tail};
    return {v:pctS(m.top1,m.tpSf)+"%", l: m.nll > 1 ? "Largest landlord holds" : "One landlord holds",
      n: msfT(m.top1)+" sq ft of the "+msfT(m.tpSf)+tail};
  },
  lapsed: (m) => ({v: msfT(m.lapsedSf), u:"sq ft", l:lbl("state.passed"),
    n: m.lapsed.length ? plural(m.lapsed.length,"lease")+" — confirm status" : "none in view", flag:true,
    click: rows => rows.filter(r=>r._ls === "passed").sort((a,b)=>sizeOf(b)-sizeOf(a))[0]}),
  rent: (m, rows) => { const k = rows.filter(r=>r.rent), ksf = sum(k);
    const w = ksf ? k.reduce((a,r)=>a+r.rent*sizeOf(r),0)/ksf : null;
    return {v: w!==null ? "£"+w.toFixed(2) : null, u:"psf", l:"Weighted average rent",
      n: "recorded on "+k.length+" of "+plural(rows.length,"unit")}; },
  epc: (m) => { const t = MEES(), L = m.leased.filter(inEW);
    const ok = L.filter(r=>r.epc && EPC_RANK[r.epc] <= EPC_RANK[t.target]), none = L.filter(r=>!r.epc).length;
    return {v: L.length ? pctS(ok.length, L.length)+"%" : null, l:"EPC "+t.target+" or better",
      n: ok.length+" of "+plural(L.length,"let unit")+" in England and Wales · "+none+" with no EPC"}; }
};
/* whether a stock metric has anything to say about this export at all */
const METRIC_OK = {
  floorspace: () => true, units: () => true,
  leased: () => DATA.some(r=>!r.owned), owned: () => DATA.some(r=>r.owned),
  wault: () => DATA.some(r=>r._ls === "running"),
  expiring: () => DATA.some(r=>r._ls === "running"),
  landlordTop: () => DATA.some(r=>!r.owned && r.landlord && !r.landlordIntra),
  lapsed: () => DATA.some(r=>r._ls === "passed"),
  rent: () => DATA.some(r=>r.rent), epc: () => DATA.some(r=>!r.owned && r.epc && inEW(r))
};
let METRIC_LIST = [];
function resolveMetrics(){
  if(Array.isArray(CFG.metrics)){ METRIC_LIST = CFG.metrics.map(x => typeof x === "string" ? {id:x} : x); return; }
  const lead = METRIC_OK.leased() ? "leased" : "owned";
  METRIC_LIST = ["floorspace", lead, "wault", "expiring", "landlordTop", "lapsed", "rent", "epc"]
    .filter(id => METRIC_OK[id]()).slice(0, 6).map(id => ({id}));
}
function tileFor(def, rows, m){
  let t;
  try {
    if(def.id && METRICS[def.id] && !def.value){
      t = METRICS[def.id](def.years || def.n ? summary(rows, def) : m, rows);
      if(def.label) t.l = valT(def.label, rows);
      if(def.note)  t.n = valT(def.note, rows);
    } else {
      let v = typeof def.value === "function" ? def.value(rows, API) : def.value;
      let u = val(def.unit, rows);
      if(Array.isArray(v)){ u = v[1] || u; v = v[0]; }
      else if(v && typeof v === "object"){ u = v.u || u; v = v.v; }
      t = {v: (v === null || v === undefined || (typeof v === "number" && !isFinite(v))) ? null : String(v),
           u, l: valT(def.label, rows), n: valT(def.note, rows) || plural(rows.length, "unit") + " in view",
           flag: !!def.flag, click: def.onClick ? (rs => def.onClick(rs, API)) : null};
    }
  } catch(e){ report("metric " + (def.id || def.label), e); return null; }
  if(def.flag === false) t.flag = false;
  if(t.v === null || t.v === undefined || t.v === "NaN") { t.v = "—"; t.u = ""; }
  return t;
}
function renderMetrics(){
  const rows = visible(), m = summary(rows);
  const tiles = METRIC_LIST.map(d => tileFor(d, rows, m)).filter(Boolean);
  const box = byId("metricRow"), n = tiles.length;
  byId("metrics").hidden = !n;
  if(!n) return;
  const cols = n <= 6 ? n : Math.ceil(n/2);
  box.style.setProperty("--mgrid", ["1.35fr"].concat(Array(Math.max(cols-1,0)).fill("1fr")).join(" "));
  const lastRow = Math.floor((n-1)/cols);
  box.innerHTML = tiles.map((t,i)=>{
    const c = i % cols, row = Math.floor(i/cols);
    const btn = !!(t.flag && t.click);
    const cls = "m" + (btn?" flag":"") + (c===0?" d-rs":"") + ((c===cols-1||i===n-1)?" d-re":"") +
                (row < lastRow ? " d-nl" : "");
    const inner = '<span class="m-v">'+esc(t.v)+(t.u && t.v !== "—"?' <small>'+esc(t.u)+'</small>':'')+'</span>'+
                  '<span class="m-l">'+textOrHtml(t.l)+'</span><span class="m-n">'+textOrHtml(t.n)+'</span>';
    return btn
      ? '<button class="'+cls+'" type="button" data-i="'+i+'">'+inner+'</button>'
      : '<div class="'+cls+'">'+inner+'</div>';
  }).join("");
  box.querySelectorAll("button.m").forEach(b => b.onclick = () => {
    const t = tiles[+b.dataset.i]; const r = t && t.click ? t.click(visible()) : null;
    if(r && r.id) openDrawer(r);
  });
}

let map = null, layer, markers = {};
function radius(v){ return 5 + 17*Math.sqrt((v||0)/MAX_SF); }
let MODES = {};
function colourOf(r){
  const md = MODES[S.mode];
  return md ? (md.colour(md.key(r)) || NEUTRAL) : C.markNeutral;
}
/* a state drawn as form: "hollow" (undated) or "dashed" (not yet started) */
function formOf(r){
  const md = MODES[S.mode];
  return md && md.form ? md.form(md.key(r)) : null;
}

/* Two hand-overs, not one. Street tiles bring land detail from zoom 9, but
   Esri's label layer is blank at zoom 10 across the UK (875-byte empty
   tiles), so our own place names stay on until its names genuinely exist. */
const STREET_ZOOM = 9;    // Esri base tiles from here
const LABEL_ZOOM  = 11;   // Esri street names from here; ours step aside

function initMap(){
  const el = byId("map");
  const geoB = L.latLngBounds(GEO.map(r=>[r.lat,r.lng]));
  const maxB = L.latLngBounds([[47.5,-14],[62,9]]);
  if(geoB.isValid()) maxB.extend(geoB.pad(.6));
  map = L.map(el,{scrollWheelZoom:false, attributionControl:true, zoomSnap:.25,
                  minZoom:4, maxZoom:16, maxBounds:maxB, maxBoundsViscosity:.8});
  API.map = map;
  if(map.attributionControl) map.attributionControl.setPrefix("Leaflet");   // plain text, no icon

  /* ---- overview basemap: our own vector land ----
     Raster tiles could not be made to look right: their labels are baked in
     (UNITED KINGDOM, Celtic Sea, FLANDERS…), cannot take CBRE type, sit on
     top of the markers and soften at fractional zoom. This is drawn from the
     GISCO boundaries instead, so it is crisp, quiet and works offline.
     make_land.py dissolves the regions into whole landmasses first, so there
     are no internal edges to crack open when the reader zooms in. */
  map.createPane("land");
  map.getPane("land").style.zIndex = 150;          // beneath tiles (200)
  map.getPane("land").style.pointerEvents = "none";
  if(LAND && LAND.uk){
    const landRenderer = L.canvas({pane:"land", padding:.5});
    const rings = list => list.map(f => { const out = [];
      for (let i = 0; i < f.length; i += 2) out.push([f[i+1], f[i]]); return out; });
    const paint = (list, coast, fill) => rings(list || []).forEach(r =>
      L.polygon(r, {renderer:landRenderer, interactive:false, smoothFactor:.6,
        stroke:true, color:coast, weight:.9, fill:true, fillColor:fill, fillOpacity:1}).addTo(map));
    paint(LAND.other, "#BAC7C3", "#F2F5F4");   // context: Ireland, the Continent
    paint(LAND.uk,    "#A3B3AE", "#FFFFFF");   // the subject
    if(LAND.credit) map.attributionControl.addAttribution(LAND.credit);
  }

  /* ---- street detail: Esri tiles, only once zoomed in ----
     At street level their labels are what a reader wants, so both layers come
     in together. Note Esri orders its path {z}/{y}/{x}. */
  const ESRI = "https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/";
  const street = L.tileLayer(ESRI+"World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}",
    {maxZoom:16, attribution:'Street detail &copy; Esri, HERE, Garmin, &copy; OpenStreetMap'});
  map.createPane("streetLabels");
  map.getPane("streetLabels").style.zIndex = 380;  // beneath the markers (400)
  map.getPane("streetLabels").style.pointerEvents = "none";
  const streetRef = L.tileLayer(ESRI+"World_Light_Gray_Reference/MapServer/tile/{z}/{y}/{x}",
    {maxZoom:16, pane:"streetLabels"});
  let warned = false;
  street.on("tileerror", ()=>{
    if (warned) return; warned = true;
    // a sibling block, never an inline span inside the caption paragraph
    const b = byId("mapBasis");
    if (b) b.insertAdjacentHTML("afterend",
      '<div class="tile-warn">Street-level detail needs an internet connection. '+
      'The portfolio map itself works offline.</div>');
  });
  const syncStreet = ()=>{
    const z = map.getZoom();
    [[street, z >= STREET_ZOOM], [streetRef, z >= LABEL_ZOOM]].forEach(([t, on]) => {
      if (on && !map.hasLayer(t)) t.addTo(map);
      if (!on && map.hasLayer(t)) map.removeLayer(t);
    });
  };
  map.on("zoomend", syncStreet);

  layer = L.layerGroup().addTo(map);

  /* Fit once the layout has actually settled. The map box is sized by the
     legend column beside it, which is still empty when initMap() runs, so a
     fit taken then was computed for a 620px box and left the map a quarter
     of a zoom level too far out — which also meant Leaflet upscaled the
     coarser tile level, softening everything. Refit on every resize until
     the reader takes control of the view. A single site (or several at one
     address) gets a fixed regional zoom instead of Leaflet's maximum. */
  const single = !geoB.isValid() || geoB.getNorthEast().distanceTo(geoB.getSouthWest()) < 2000;
  let userMoved = false;
  ["mousedown","pointerdown","click","wheel","touchstart","keydown"].forEach(ev =>
    el.addEventListener(ev, ()=>{ userMoved = true; }, {passive:true, capture:true}));
  map.on("dragstart", ()=>{ userMoved = true; });
  const doFit = () => { if(single) map.setView(geoB.getCenter(), 8); else map.fitBounds(geoB, {padding:[30,30]}); };
  const fit = ()=>{
    if (el.clientWidth < 50 || el.clientHeight < 50) return;   // view hidden
    map.invalidateSize();
    if (!userMoved) doFit();
  };
  MAP_FIT = fit;
  doFit();
  new ResizeObserver(()=>requestAnimationFrame(fit)).observe(el);

  initPlaces();
}

    return;
  }
  const area = b => Math.max(0,b.x1-b.x0) * Math.max(0,b.y1-b.y0);
  const ov = (a,b) => Math.max(0, Math.min(a.x1,b.x1) - Math.max(a.x0,b.x0)) *
                      Math.max(0, Math.min(a.y1,b.y1) - Math.max(a.y0,b.y0));
  const foot = Object.values(markers).map(m=>{
    const p = map.latLngToLayerPoint(m.getLatLng()), r = m.getRadius() + 2;
    return { x0:p.x-r, y0:p.y-r, x1:p.x+r, y1:p.y+r, cx:p.x, cy:p.y, r,
             w: m.options.fillOpacity > .5 || m.options.dashArray || m.options.fillOpacity === .15 ? 1 : .3 };   // dimmed markers matter less
  });
  // A town whose own point sits under a unit circle is hidden at this zoom (its
  // square would read as part of the unit); it comes back when the zoom clears it.
  const underUnit = q => foot.some(f => f.w === 1 && Math.hypot(q.x - f.cx, q.y - f.cy) <= f.r);
  const placed = [];
  // The visible frame, in layer coordinates, inset a little: a label must sit
  // wholly inside it or not show — on a phone "Glasgow" was running off the edge.
  const sz = map.getSize();
  const tl = map.containerPointToLayerPoint([0, 0]);
  const frame = { x0: tl.x + 4, y0: tl.y + 4, x1: tl.x + sz.x - 4, y1: tl.y + sz.y - 18 };
  const outside = b => area(b) - ov(b, frame);
  // Leaflet's own controls (zoom, attribution) are obstacles too: on a phone
  // "Glasgow" landed under the zoom buttons.
  const cbox = map.getContainer().getBoundingClientRect();
  const ctrls = [...map.getContainer().querySelectorAll(".leaflet-control")].map(c => {
    const r = c.getBoundingClientRect();
    const a = map.containerPointToLayerPoint([r.left - cbox.left - 4, r.top - cbox.top - 4]);
    const z = map.containerPointToLayerPoint([r.right - cbox.left + 4, r.bottom - cbox.top + 4]);
    return { x0:a.x, y0:a.y, x1:z.x, y1:z.y };
  }).filter(b => b.x1 > b.x0 && b.y1 > b.y0);
  // Every town's own point is an obstacle for every OTHER label — a label
  // pushed onto a neighbouring town's dot names the wrong place.
  // …but only towns eligible at this zoom; a hidden tier-3 town reserves nothing
  const dots = placeMarkers
    .filter(pm => pm._tier !== 3 || map.getZoom() >= TIER3_ZOOM)
    .map(pm => { const q = map.latLngToLayerPoint(pm.getLatLng());
      return { m: pm, x0:q.x-5, y0:q.y-5, x1:q.x+5, y1:q.y+5 }; });
  placeMarkers.slice().sort((a,b)=>a._tier-b._tier).forEach(m=>{
    const el = m.getElement(); if (!el) return;
    if (m._tier === 3 && map.getZoom() < TIER3_ZOOM) { el.style.display = "none"; return; }
    const span = el.querySelector("span"), lead = el.querySelector("b");
    const p = map.latLngToLayerPoint(m.getLatLng());
    if (underUnit(p)) { el.style.display = "none"; return; }
    el.style.display = "";
    const w = span.offsetWidth, h = span.offsetHeight || 12;
    /* Eight directions at three distances. Beside the town is preferred; a
       label only moves outward — on a leader line — when every close
       position is covered, because a half-hidden name ("nchester") reads as a
       bug. Any marker overlap at all counts against a position. */
    const dirs = [[1,0],[-1,0],[0,-1],[0,1],[.72,-.72],[.72,.72],[-.72,-.72],[-.72,.72]];
    let best = null;
    // Minor towns may only step a short way from their point; only the
    // anchor cities are allowed out onto a leader line.
    const reach = m._tier === 1 ? [7, 16, 34] : [7, 16];
    reach.forEach((g, ring) => dirs.forEach(([ux,uy], i) => {
      // anchor the box so its nearest edge sits g px from the town point
      const dx = ux > 0 ? g*ux : ux < 0 ? g*ux - w : -w/2;
      const dy = uy > 0 ? g*uy : uy < 0 ? g*uy - h : -h/2;
      const b = { x0:p.x+dx-3, y0:p.y+dy-2, x1:p.x+dx+w+3, y1:p.y+dy+h+2 };
      let hitM = 0, hitL = 0;
      foot.forEach(f=>{ hitM += ov(b,f) * f.w; });
      placed.forEach(q=>{ hitL += ov(b,q); });
      dots.forEach(d=>{ if (d.m !== m) hitL += ov(b,d); });
      ctrls.forEach(c=>{ hitL += ov(b,c); });
      hitL += outside(b);            // off the edge counts like a collision
      const score = hitM*4 + hitL*100 + ring*40 + i*0.5;
      if (!best || score < best.score) best = {dx, dy, b, hitM, hitL, score, ring, ux, uy, g};
    }));
    const clear = best.hitL === 0 && best.hitM < area(best.b) * .04;
    const show = clear || (m._tier === 1 && best.hitL === 0 && best.hitM < area(best.b) * .12);
    el.style.display = show ? "" : "none";
    if (!show) return;
    span.style.left = best.dx + "px";
    span.style.top  = best.dy + "px";
    // Leader only when genuinely pushed out: a 10px line beside a name reads
    // as a dash ("Carlisle —"), not as a connection.
    if (best.ring >= 2) {
      const tx = best.dx + (best.ux > 0 ? 0 : best.ux < 0 ? w : w/2);
      const ty = best.dy + (best.uy > 0 ? 0 : best.uy < 0 ? h : h/2);
      const len = Math.max(0, Math.hypot(tx, ty) - 3);
      lead.style.width = len + "px";
      lead.style.transform = "rotate(" + Math.atan2(ty, tx) + "rad)";
      lead.style.display = "block";
    } else {
      lead.style.display = "none";
    }
    placed.push(best.b);
  });
}

function drawMarkers(){
  if(!map) return;
  layer.clearLayers(); markers = {};
  const vis = new Set(visible().map(r=>r.id));
  // paint largest first so small units stay clickable on top
  GEO.slice().sort((a,b)=>sizeOf(b)-sizeOf(a)).forEach(r=>{
    const on = vis.has(r.id), form = on ? formOf(r) : null;
    // pale fills (under 3:1 on the white land) take the design-system edge
    // instead of white; a state that is FORM is a ring with no fill
    const edge = !on ? "#DDE3E1" : form ? THEME.sem.unknown : (edgeFor(colourOf(r)) || "#fff");
    const m = L.circleMarker([r.lat,r.lng],{
      radius: radius(r.size),
      fillColor: on ? (form ? "#FFFFFF" : colourOf(r)) : "#CBD0CC",
      fillOpacity: on ? (form ? .15 : .78) : .3,
      color: edge,
      weight: on ? 2 : 1,
      dashArray: form === "dashed" ? "4 3" : null,
      className: "mk",
      interactive: true
    });
    m.bindPopup(popupHtml(r), {closeButton:false, offset:[0,-2]});
    m.on("popupopen", e=>{
      const b = e.popup.getElement() && e.popup.getElement().querySelector(".pop-b");
      if(b) b.onclick = ()=>{ map.closePopup(); openDrawer(r); };
    });
    m.on("mouseover", function(){ this.setStyle({weight:3}); });
    m.on("mouseout",  function(){ this.setStyle({weight:on?2:1}); });
    m._edge = edge;
    markers[r.id] = m;
    layer.addLayer(m);
  });
  placeLabels();   // prominence changed, so the clear side of each town may have too
}

/* The map popup, built from a MODEL like the drawer:
     rows [{key, label, value (html)}]  floorspace | group | tenure | landlord | state | expiry
   Hooks (DASH.set({popup:{...}})): rows(r, rows, api) returns the new list;
   title(r, api) and sub(r, api) return text. The lease line uses the page's
   lease-state words (labels.state), never a bare "(passed)". */
function popupModel(r){
  const ls = r._ls, rows = [];
  const add = (key, label, value) => { if(has(value)) rows.push({key, label, value:String(value)}); };
  add("floorspace", "Floorspace", r.size ? sf(r.size)+" sq ft" : UNK);
  if(GROUP.enabled) add("group", GROUP.short, esc(r._g));   // no company label when the dimension is off
  add("tenure", "Tenure", r.owned ? esc(lbl("state.owned")) : r.tenure ? esc(r.tenure) : UNK);
  if(!r.owned){
    add("landlord", "Landlord", r.landlord ? esc(r.landlord) + (r.landlordIntra && lbl("intraTag") ? " (" + esc(lbl("intraTag")) + ")" : "") : UNK);
    add("state", "Lease", esc(lbl("state." + ls)));
    if(r.expiry) add("expiry", "Recorded expiry", dmy(r.expiry));
  }
  return rows;
}
function popupHtml(r){
  const P = CFG.popup || {};
  const txt = (fn, dflt) => { if(typeof fn !== "function") return dflt;
    try { const v = fn(r, API); return has(v) ? String(v) : dflt; } catch(e){ report("popup", e); return dflt; } };
  let rows = popupModel(r);
  if(typeof P.rows === "function"){
    try { const out = P.rows(r, rows.slice(), API); if(Array.isArray(out)) rows = out; } catch(e){ report("popup.rows", e); }
  }
  const title = txt(P.title, r.short);
  const sub = txt(P.sub, [r.town, r.postcode].filter(Boolean).join(" · ") || r.region || "");
  return '<div class="pop-t">'+esc(title)+'</div>'+
    (sub ? '<div class="pop-s">'+esc(sub)+'</div>' : '')+
    '<dl class="pop-g">'+rows.filter(x => x && has(x.value)).map(x =>
      '<dt>'+esc(x.label)+'</dt><dd>'+x.value+'</dd>').join("")+'</dl>'+
    '<button class="pop-b" type="button">'+esc(lbl("popupButton") || "Full record")+'</button>';
}

/* ------------------------------------------------------------- legend */
function buildModes(){
  const tenureKeys = [...new Set(DATA.map(r => r.owned ? "Owned" : (r.tenure || NR)))];
  const tOrder = ["Owned","Leased","Leased (regeared)"].filter(k => tenureKeys.includes(k))
    .concat(tenureKeys.filter(k => !TENURE_C[k] && k !== NR).sort()).concat(tenureKeys.includes(NR) ? [NR] : []);
  const tCol = {}; let ti = 0;
  tOrder.forEach(k => { tCol[k] = TENURE_C[k] || (k === NR ? NEUTRAL : TENURE_EXTRA[ti++ % TENURE_EXTRA.length]); });
  const stock = {
    group:  {id:"group", label:GROUP.short, title:GROUP.label, key:r=>r._g, order:GROUP.order,
             colour:GC, filter:true, all:true, ok:GROUP.enabled},
    tenure: {id:"tenure", label:"Tenure", title:"Tenure", key:r=>r.owned ? "Owned" : (r.tenure || NR), order:tOrder,
             colour:k=>tCol[k], all:true, ok: tOrder.length >= 2},
    // the lease state (running leases banded by time to expiry); undated and
    // not-started leases are rings, never a fill that could be a company
    event:  {id:"event", label:"Lease event", title:"Lease state", key:eventBand, order:EVENT_ORDER,
             colour:k=>EVENT_C[k], form:k=>EVENT_FORM[k] || null, ok: DATA.some(r=>!r.owned)}
  };
  const list = Array.isArray(CFG.map.modes) ? CFG.map.modes : ["group","tenure","event"];
  MODES = {};
  list.forEach(x => {
    if(typeof x === "string"){ if(stock[x] && stock[x].ok) MODES[x] = stock[x]; return; }
    if(!x || !x.id || typeof x.key !== "function") return;
    const keys = [...new Set(DATA.map(r => { try { return x.key(r); } catch(e){ return NR; } }))]
      .map(k => has(k) ? String(k) : NR);
    const order = (x.order || []).filter(k => keys.includes(k)).concat(keys.filter(k => !(x.order||[]).includes(k)));
    const cols = x.colours || {}; let pi = 0;
    const colOf = {}; order.forEach(k => { colOf[k] = cols[k] || (k === NR ? NEUTRAL : PALETTE[pi++ % PALETTE.length]); });
    const forms = x.forms || {};
    MODES[x.id] = {id:x.id, label:x.label || x.id, title:x.title || x.label || x.id,
      key:r => { try { const k = x.key(r); return has(k) ? String(k) : NR; } catch(e){ return NR; } },
      order, colour:k=>colOf[k], form:k=>forms[k] || null};
  });
  if(!Object.keys(MODES).length) MODES.tenure = Object.assign({}, stock.tenure);
  S.mode = MODES[CFG.map.mode] ? CFG.map.mode : Object.keys(MODES)[0];
}
function legendData(){
  const vis = visible(), md = MODES[S.mode];
  // Rebase on the filtered set. Reading the full data here left this list
  // frozen at the portfolio total while the region list beside it correctly
  // showed the filtered figure.
  const fold = md.id === "group" && GROUP.folded && GROUP.folded.length;
  const rows = md.order.filter(k => !(fold && isFolded(k))).map(k=>{
    const set = vis.filter(r=>md.key(r)===k);
    return {key:k, label:k, colour:md.colour(k), form: md.form ? md.form(k) : null,
            n:set.length, sf:sum(set), all:sum(DATA.filter(r=>md.key(r)===k)), filter:!!md.filter && k !== NR};
  });
  // beyond eight groups the tail is one row, "Other (n)", which toggles them all
  if(fold){
    const set = vis.filter(r => isFolded(r._g)), i = rows.findIndex(d => d.key === NR);
    const other = {key:"__other", label:"Other (" + GROUP.folded.length + ")", colour:THEME.other, n:set.length,
      sf:sum(set), all:sum(DATA.filter(r => isFolded(r._g))), filter:true};
    if(i >= 0) rows.splice(i, 0, other); else rows.push(other);
  }
  return md.all ? rows : rows.filter(d=>d.n>0);
}
function renderLegend(){
  const md = MODES[S.mode], rows = legendData();
  // Bars are scaled against the unfiltered maximum so a filtered view reads as
  // a share of the portfolio, not a re-normalised chart of itself.
  const max = Math.max(1, ...rows.map(d => d.all || 0));
  byId("legendTitle").textContent = md.title;
  byId("legend").innerHTML = rows.map(d=>{
    const on = d.filter && (d.key === "__other" ? GROUP.folded.every(k => S.groups.has(k)) : S.groups.has(d.key));
    const e = !d.form && edgeFor(d.colour);
    const sw = d.form ? '<span class="sw '+d.form+'"></span>'
      : '<span class="sw" style="background:'+d.colour+(e ? ';box-shadow:inset 0 0 0 1.5px '+e : '')+'"></span>';
    return '<li>'+
      '<button class="lg-row'+(d.filter?' clk':'')+(d.n===0?' dim':'')+'" type="button" data-k="'+esc(d.key)+'"'+
        (d.filter ? ' aria-pressed="'+(on?'true':'false')+'"' : ' disabled')+'>'+
        sw+
        '<span class="lg-nm">'+esc(d.label)+'</span>'+
        '<span class="lg-n">'+msf(d.sf)+'</span>'+
        '<span class="lg-bar"><i style="width:'+(d.sf/max*100)+'%;background:'+d.colour+'"></i></span>'+
      '</button></li>';
  }).join("");
  byId("legend").querySelectorAll(".lg-row.clk").forEach(b=>{
    b.onclick = ()=>{ toggleGroup(b.dataset.k); };
  });
}
/* size key: three round values spanning this export, drawn at the exact
   diameter a marker of that size gets. The fixed 10/18/30px key understated
   every marker by a third or more. */
function sizeKey(){
  const nice = v => { const p = Math.pow(10, Math.floor(Math.log10(v))), f = v/p;
    const c = [1,2.5,5,10].reduce((a,b)=>Math.abs(b-f) < Math.abs(a-f) ? b : a); return c*p; };
  const hi = Math.floor(MAX_SF / Math.pow(10, Math.floor(Math.log10(MAX_SF)))) * Math.pow(10, Math.floor(Math.log10(MAX_SF)));
  const vals = [...new Set([nice(hi/16), nice(hi/3.2), hi])].filter(v => v > 0 && v <= MAX_SF).sort((a,b)=>a-b);
  const lab = v => v >= 1e6 ? +(v/1e6).toFixed(1)+"m" : v >= 1e3 ? +(v/1e3).toFixed(1)+"k" : String(v);
  return vals.map((v,i)=>{ const d = Math.round(radius(v)*2);
    return '<div><span style="width:'+d+'px;height:'+d+'px"></span><em>'+lab(v)+(i===vals.length-1?' sq ft':'')+'</em></div>'; }).join("");
}

const leasedOf = rows => rows.filter(r=>!r.owned);
