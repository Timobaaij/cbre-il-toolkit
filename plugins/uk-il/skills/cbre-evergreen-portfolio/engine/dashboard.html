<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard engine template</title>
<!--
  CBRE EverGreen portfolio — DASHBOARD ENGINE TEMPLATE. Not opened directly.

  scripts/assemble.py takes three parts out of this file, and relies on there
  being exactly ONE style element and ONE script element (it takes the last of
  each), so never add another, and never write either tag inside a comment:
    1. the stylesheet            -> scope_css(css, '#view-dash', hoist)
    2. the body markup, scripts stripped -> inside div#view-dash
    3. the core script            -> placeholders filled, wrapped in an IIFE
  Placeholders (in the core script only, each appears exactly once):
    UNITS  a JS expression giving the canonical unit array (window.__UNITS__)
    LAND   replaces the literal "LAND-placeholder null" with engine/land.json
    META   a JS expression giving the meta object (window.__META__)
    DASH   the report's dash.js, inserted verbatim
  Fonts and Leaflet are NOT referenced here: the page inlines them once, shared.
  Author reference: reference/dashboard-engine.md
-->
<style id="dash-css">
/* ============================================================ TOKENS */
:root{
  --cbre-green:#003F2D; --dark-green:#012A2D; --midnight:#032842;
  --accent:#17E88F; --sage:#538184; --celadon:#80BBAD; --celadon-tint:#C0D4CB;
  --wash:#E6EAEA; --wash-2:#CBD0CC; --warm:#D2785A; --warm-ink:#A8523A; --plum:#885073;

  --ink:#003F2D; --body:#435254; --muted:#5C6B66;
  --muted-dec:#5C6B66;      /* was #6E7C77 — 4.31:1, under AA at 10px */
  --line:#CAD1D3; --line-soft:#DDE3E1; --bg:#F5F7F7; --panel:#FFFFFF;
  --rule-strong:#B9C2BD;    /* chart gridlines — must survive a projector */

  --owned:#003F2D; --leased:#538184; --regear:#D2785A;
  --alert:#A8523A; --alert-bg:#FBF1ED;

  --font-display:'Financier Display',Georgia,'Times New Roman',serif;
  --font-body:'Calibre',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;
  --font-mono:'Space Mono',ui-monospace,'Courier New',monospace;

  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px;
  --s7:48px; --s8:64px; --s9:96px;
  --maxw:1520px; --gutter:32px;

  --radius:2px; --hair:1px;
  --shadow-1:0 1px 2px rgba(0,63,45,.05), 0 8px 24px rgba(0,63,45,.06);
  --shadow-2:0 4px 12px rgba(0,63,45,.08), 0 24px 60px rgba(0,63,45,.16);
  --ring:0 0 0 2px #fff, 0 0 0 4px #003F2D;

  --d-fast:120ms; --d-base:180ms; --d-drawer:220ms;
  --ease:cubic-bezier(.2,0,.2,1); --ease-out:cubic-bezier(0,0,.25,1);

  /* Height of the shared app bar. Scoping turns this block into the view
     root's own declarations, so it follows the shell's --bar-h instead of
     restating a number that can drift. */
  --mast:var(--bar-h,56px);
  --filter-h:60px;  /* measured at runtime on the view root — see syncFilterH() */
}
@media (prefers-reduced-motion:reduce){
  :root{--d-fast:1ms;--d-base:1ms;--d-drawer:1ms}
  *,*::before,*::after{animation-duration:1ms!important;transition-duration:1ms!important;scroll-behavior:auto!important}
}

/* ==================================================== BROWSER SURFACES */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--body);
  font-family:var(--font-body);font-size:15px;line-height:1.55;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
::selection{background:var(--accent);color:var(--cbre-green)}
:root{scrollbar-color:var(--celadon) var(--wash);caret-color:var(--cbre-green)}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-track{background:var(--wash)}
::-webkit-scrollbar-thumb{background:var(--celadon);border:3px solid var(--wash)}
::-webkit-scrollbar-thumb:hover{background:var(--sage)}
/* Focus is an OUTLINE, not a box-shadow: shadows are clipped by overflow,
   dropped in forced-colours mode and lost on inset-shadowed rows. */
:focus-visible{outline:2px solid var(--cbre-green);outline-offset:2px;box-shadow:none}
.metrics :focus-visible,.dr-head :focus-visible{outline-color:#FFFFFF}
.t-scroll tbody tr:focus-visible{outline-offset:-2px}
a{color:var(--cbre-green);text-underline-offset:3px;text-decoration-thickness:1px}
.num,.n{font-variant-numeric:tabular-nums lining-nums;font-feature-settings:'tnum' 1,'lnum' 1}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
  clip:rect(0 0 0 0);white-space:nowrap;border:0}
/* shared SVG defs (hatch patterns). Never display:none — a pattern inside an
   undisplayed <svg> does not paint where it is referenced. */
.dash-defs{position:absolute;width:0;height:0;overflow:hidden}

/* ============================================================= SHELL */
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 var(--gutter)}

/* The masthead is shared with the storyline and lives outside this view's
   scope — the page shell provides it. */

/* --- title band --- */
.title-band{background:var(--panel);border-bottom:1px solid var(--line);
  padding:var(--s9) 0 var(--s8)}
.title-band .wrap{display:grid;grid-template-columns:minmax(420px,1fr) .92fr;
  gap:var(--s9);align-items:end}
.eyebrow{font:400 11px/1.3 var(--font-mono);letter-spacing:.18em;text-transform:uppercase;
  color:var(--muted);margin:0 0 var(--s4)}
.eyebrow[hidden]{display:none}
h1{font:400 clamp(54px,6.4vw,104px)/.95 var(--font-display);letter-spacing:-.038em;
  color:var(--ink);margin:0;text-wrap:balance}
h1 .light{color:var(--sage)}   /* 4.34:1 on white — celadon at 2.18:1 fails large-text AA */
.rule{width:72px;height:5px;background:var(--accent);margin:var(--s6) 0 0}
.lede{font:400 21px/1.5 var(--font-body);color:var(--body);max-width:52ch;margin:0}
.lede b{font-weight:600;color:var(--ink)}
.title-meta{margin-top:var(--s5);padding-top:var(--s4);border-top:1px solid var(--line-soft);
  font:400 11.5px/1.5 var(--font-body);color:var(--muted);
  display:flex;flex-wrap:wrap;gap:var(--s2) var(--s5)}
.title-meta:empty{display:none}
@media (max-width:1080px){
  .title-band .wrap{grid-template-columns:1fr;gap:var(--s5)}
  .lede{font-size:18px;max-width:68ch;padding-top:0}
}

/* --- metric band ---
   The column template comes from JS (--mgrid) because the tile count is set
   per report. Row-start / row-end / not-last-row classes are computed for
   the desktop grid; the narrower grids below use nth-child formulas, so the
   hairlines are right for any count (they were written for exactly six). */
.metrics{background:var(--dark-green);color:#fff}
.metrics .wrap{display:grid;grid-template-columns:var(--mgrid,1.35fr 1fr 1fr 1fr 1fr 1fr)}
.m{padding:var(--s7) var(--s5) var(--s7) var(--s5);
  border-right:1px solid rgba(255,255,255,.1)}
.m-v{font:400 44px/1 var(--font-display);color:var(--accent);margin-bottom:-3px;
  display:block;letter-spacing:-.028em;white-space:nowrap;
  font-variant-numeric:tabular-nums lining-nums}
.m:first-child .m-v{font-size:clamp(56px,4.8vw,76px)}
.m-v small{font-size:.42em;color:rgba(255,255,255,.72);letter-spacing:0;margin-left:3px}
.m-l{font:400 10px/1.3 var(--font-mono);letter-spacing:.18em;text-transform:uppercase;
  color:rgba(255,255,255,.66);margin-top:var(--s4);display:block}
.m-n{font:400 11.5px/1.4 var(--font-body);color:rgba(255,255,255,.62);margin-top:var(--s1);display:block}
.m.flag{cursor:pointer;background:none;border:0;border-right:1px solid rgba(255,255,255,.13);
  text-align:left;font-family:inherit;position:relative}
.m.flag::before{content:"";position:absolute;top:0;left:var(--s5);right:var(--s5);height:2px;
  background:var(--warm)}
.m.flag .m-v{color:#F0A184}
.m.flag:hover .m-l{color:rgba(255,255,255,.9)}
.m.d-rs{padding-left:0}
.m.d-rs.flag::before{left:0}
.m.d-re{border-right:0}
.m.d-nl{border-bottom:1px solid rgba(255,255,255,.13)}

/* --- filter bar --- */
.filters{position:sticky;top:var(--mast);z-index:50;background:var(--panel);
  border-bottom:1px solid var(--line);transition:box-shadow var(--d-base) var(--ease)}
.filters.stuck{box-shadow:var(--shadow-1)}
/* min-height must NOT read --filter-h: that variable is measured FROM this
   element, so feeding it back created a ResizeObserver loop that grew the bar
   to 1,300px. --filter-h is write-only here and read only by thead. */
.filters .wrap{display:flex;align-items:center;gap:var(--s4);min-height:60px;
  flex-wrap:wrap;padding-top:var(--s3);padding-bottom:var(--s3)}
.f-group{display:flex;align-items:center;gap:var(--s2);flex-wrap:wrap}
.f-lab{font:400 10px/1 var(--font-mono);letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.chip{font:400 10.5px/1 var(--font-mono);letter-spacing:.1em;text-transform:uppercase;
  background:#fff;border:1px solid var(--line);color:var(--body);padding:7px 11px;
  border-radius:var(--radius);cursor:pointer;display:inline-flex;align-items:center;gap:6px;
  transition:border-color var(--d-fast) var(--ease),background var(--d-fast) var(--ease),
             color var(--d-fast) var(--ease)}
.chip:hover{border-color:var(--sage);background:#FAFCFB}
.chip[aria-pressed="true"]{background:var(--cbre-green);color:#fff;border-color:var(--cbre-green)}
.chip .sw{width:9px;height:9px;border-radius:50%;flex:0 0 auto;box-shadow:inset 0 0 0 1px rgba(0,0,0,.30)}
/* 10px rendered is the floor for every text run, at every viewport */
.chip .ct{font-size:10px;color:var(--muted)}
.chip[aria-pressed="true"] .ct{color:rgba(255,255,255,.72)}
select{font:400 12.5px/1 var(--font-body);color:var(--body);background:#fff;
  border:1px solid var(--line);border-radius:var(--radius);padding:8px 28px 8px 10px;
  cursor:pointer;appearance:none;max-width:100%;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M1 1l4 4 4-4' fill='none' stroke='%23538184' stroke-width='1.5'/></svg>");
  background-repeat:no-repeat;background-position:right 10px center}
select:hover{border-color:var(--sage)}
.readout{margin-left:auto;font:400 11.5px/1.5 var(--font-mono);color:var(--cbre-green);
  letter-spacing:.04em;white-space:nowrap;min-width:30ch;text-align:right;
  font-variant-numeric:tabular-nums lining-nums}
.readout b{font-weight:700}
.readout .dim{color:var(--muted)}
.btn-reset{font:400 10px/1 var(--font-mono);letter-spacing:.12em;text-transform:uppercase;
  background:transparent;border:1px solid transparent;color:var(--warm-ink);padding:7px 9px;
  cursor:pointer;border-radius:var(--radius)}
.btn-reset:hover{border-color:var(--warm)}
.btn-reset[hidden]{display:none}

/* --- sections --- */
/* Only the page's own bands: a <section> inside a custom panel is left alone. */
main > section{padding:var(--s9) 0 var(--s8)}
/* baseline, not end — box-bottom alignment left the note 13-19px above the
   heading's baseline in every band, because a 44px serif and a 13.5px sans
   sit very differently inside their boxes. */
.sec-head{display:grid;grid-template-columns:1fr minmax(0,42ch);align-items:baseline;
  gap:var(--s7);margin-bottom:var(--s6);padding-bottom:var(--s4);
  border-bottom:1px solid var(--line-soft)}
h2{font:400 clamp(30px,3.2vw,44px)/1.04 var(--font-display);letter-spacing:-.028em;
  color:var(--ink);margin:0;text-wrap:balance}
.sec-note{font:400 13.5px/1.55 var(--font-body);color:var(--muted)}
.sec-note:empty{display:none}
.basis{font:400 12px/1.5 var(--font-body);color:var(--muted);margin-top:var(--s4);
  max-width:104ch}
.basis:empty{display:none}
.basis b{font-weight:600;color:var(--body)}
@media (max-width:900px){
  .sec-head{grid-template-columns:1fr;gap:var(--s3)}
}

/* --- map --- */
.map-row{display:grid;grid-template-columns:1fr 340px;gap:var(--s5);align-items:stretch}
/* The map fills whatever height the legend column needs, so the two never
   disagree and no dead space opens under either. */
.map-row > div:first-child{display:flex;flex-direction:column;min-width:0}
/* The container IS the sea: the vector land is drawn over it.
   isolation: Leaflet's panes carry z-index 400-1000 and the container made no
   stacking context, so a map scrolled under the sticky filter bar and the
   fixed app bar painted over both of them. */
#map{flex:1;min-height:620px;border:1px solid var(--line-soft);background:#DAE3E0;
  border-radius:var(--radius);isolation:isolate}
.leaflet-container{font-family:var(--font-body);background:#DAE3E0}
/* 10px and AA: Leaflet's default link blue was 3.5:1 on the translucent strip */
.leaflet-control-attribution{font:400 10px/1.4 var(--font-body)!important;color:var(--body)!important;
  background:rgba(255,255,255,.9)!important}
.leaflet-control-attribution a{color:var(--cbre-green)!important}
.leaflet-bar a{border-radius:0!important;color:var(--cbre-green)!important}
/* Place labels: set in the house sans, beneath the markers, with a white halo
   so a label that brushes a marker edge stays legible. The town point is a
   small square so it can never be mistaken for a (round) unit marker. */
.place{pointer-events:none}
.place i{position:absolute;left:-2px;top:-2px;width:4px;height:4px;background:#435254;
  box-shadow:0 0 0 1.5px #fff}
.place span{position:absolute;white-space:nowrap;
  font:500 11.5px/1 var(--font-body);letter-spacing:.01em;color:#3A4A4C;
  text-shadow:1px 0 0 #fff,-1px 0 0 #fff,0 1px 0 #fff,0 -1px 0 #fff,
              1px 1px 0 #fff,-1px -1px 0 #fff,1px -1px 0 #fff,-1px 1px 0 #fff,
              0 0 4px #fff}
.place.t1 span{font-weight:600;font-size:12.5px;color:var(--ink)}
.place b{position:absolute;left:0;top:0;height:1px;background:#5C6B66;
  transform-origin:0 50%;display:none}
.place.t1 i{width:5px;height:5px;left:-2.5px;top:-2.5px;background:var(--ink)}
.place.t3 span{font-weight:400;font-size:11px;color:#4E5E5F}
.place.t3 i{width:3px;height:3px;left:-1.5px;top:-1.5px;background:#6E7C77}
.map-side{display:flex;flex-direction:column;gap:var(--s4);min-width:0}
.map-toggle{display:flex;gap:0;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.map-toggle[hidden]{display:none}
.map-toggle button{flex:1;font:400 10px/1 var(--font-mono);letter-spacing:.08em;text-transform:uppercase;
  background:#fff;border:0;border-right:1px solid var(--line);color:var(--body);padding:9px 4px;
  cursor:pointer;transition:background var(--d-fast) var(--ease)}
.map-toggle button:last-child{border-right:0}
.map-toggle button[aria-pressed="true"]{background:var(--cbre-green);color:#fff}
.legend{background:#fff;border:1px solid var(--line);border-radius:var(--radius);
  padding:var(--s4) var(--s4) var(--s3);display:flex;flex-direction:column;min-height:0;flex:1}
.legend h3{font:400 18px/1.1 var(--font-display);color:var(--ink);margin:0 0 var(--s2);
  letter-spacing:-.018em;flex:0 0 auto}
.legend h3.second{margin-top:var(--s4);padding-top:var(--s3);border-top:1px solid var(--line)}
.legend [hidden]{display:none}
.lg-list{list-style:none;margin:0;padding:0;flex:0 0 auto}
.lg-list li{margin:0}
.lg-row{width:100%;display:grid;grid-template-columns:11px 1fr auto;gap:7px;align-items:center;
  background:none;border:0;border-bottom:1px solid var(--line-soft);padding:5px 2px;cursor:pointer;
  font-family:inherit;text-align:left;transition:background var(--d-fast) var(--ease)}
.lg-row[disabled]{cursor:default}
.lg-list li:last-child .lg-row{border-bottom:0}
.lg-row:not([disabled]):hover{background:#F3F7F5}
.lg-row[aria-pressed="true"]{background:#EDF4F1}
.lg-row .sw{width:11px;height:11px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.30)}
/* states drawn as FORM (design-system §3a): hollow = no expiry recorded,
   dashed = not yet started, both in --sem-unknown */
.lg-row .sw.hollow{background:transparent;box-shadow:inset 0 0 0 2px #5C6B66}
.lg-row .sw.dashed{background:transparent;box-shadow:none;border:1.5px dashed #5C6B66}
/* "nothing in view" rows: a muted token, not opacity. At .42 opacity the name
   fell to 2.4:1; muted on white is 5.6:1. */
.lg-row.dim .lg-nm{color:var(--muted)}
/* a dimmed row keeps its own swatch: greying two rows gave two meanings one look */
.lg-row .sw.none{background:transparent;box-shadow:none}
.lg-nm{font:400 12.5px/1.25 var(--font-body);color:var(--ink);white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis}
.lg-n{font:400 10.5px/1 var(--font-mono);color:var(--muted)}
.lg-bar{grid-column:2/4;height:3px;background:var(--wash);margin-top:3px}
.lg-bar i{display:block;height:100%}
.size-key{border-top:1px solid var(--line);margin-top:var(--s3);padding-top:var(--s3);
  display:flex;align-items:flex-end;gap:var(--s4);justify-content:flex-start;flex:0 0 auto}
.size-key div{text-align:center}
.size-key span{display:block;border-radius:50%;background:rgba(0,63,45,.5);
  border:1.5px solid #fff;box-shadow:0 0 0 1px rgba(0,63,45,.3);margin:0 auto 5px}
.size-key em{font:400 10px/1 var(--font-mono);color:var(--muted);font-style:normal;white-space:nowrap}
.mk{border-radius:50%;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.leaflet-popup-content-wrapper{border-radius:var(--radius);box-shadow:var(--shadow-2);padding:0}
.leaflet-popup-content{margin:0;padding:13px 15px;width:248px!important;font-family:var(--font-body)}
.leaflet-popup-tip{box-shadow:none}
.pop-t{font:400 15px/1.25 var(--font-display);color:var(--ink);margin-bottom:2px}
.pop-s{font:400 11px/1.4 var(--font-mono);color:var(--muted);letter-spacing:.03em}
.pop-g{margin:9px 0;padding-top:9px;border-top:1px solid var(--line-soft);
  display:grid;grid-template-columns:auto auto;gap:3px var(--s3);
  font:400 11.5px/1.45 var(--font-body)}
.pop-g dt{color:var(--muted)}
.pop-g dd{margin:0;color:var(--ink);text-align:right;font-family:var(--font-mono);font-size:11px}
.pop-b{font:400 10px/1 var(--font-mono);letter-spacing:.12em;text-transform:uppercase;
  background:var(--cbre-green);color:#fff;border:0;padding:8px 10px;width:100%;cursor:pointer;
  border-radius:var(--radius)}
.tile-warn{display:block;font:400 11.5px/1.4 var(--font-body);color:var(--warm-ink);
  background:var(--alert-bg);border:1px solid #EBC9BB;padding:8px 11px;
  border-radius:var(--radius);margin-top:var(--s3)}

/* --- generic chart block --- */
.band{border-top:1px solid var(--line)}
.grid-3{display:grid;grid-template-columns:1.15fr 1fr 1fr;gap:var(--s7)}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:var(--s7)}
.grid-1{display:grid;grid-template-columns:minmax(0,1fr)}
.grid-1 .blk{max-width:1040px}
.grid-3 > .blk,.grid-2 > .blk{min-width:0}
.blk h3{font:400 24px/1.15 var(--font-display);color:var(--ink);margin:0 0 var(--s2);
  letter-spacing:-.02em;text-wrap:balance}
.blk .sub{font:400 13px/1.5 var(--font-body);color:var(--muted);margin:0 0 var(--s5);
  max-width:44ch}
.blk .sub:empty{display:none}
.p-body{min-width:0}
svg{display:block;max-width:100%;overflow:visible}
.ax{font:400 10px/1 var(--font-mono);fill:var(--muted);letter-spacing:.04em}
.ax-b{font:400 10px/1 var(--font-mono);fill:var(--body);letter-spacing:.04em}
.gl{stroke:var(--rule-strong);stroke-width:1}
.bl{stroke:var(--sage);stroke-width:1}
.bar{transition:opacity var(--d-fast) var(--ease)}
.bar:hover{opacity:.82}
.clk{cursor:pointer}
/* clickable marks are keyboard buttons too (bindClicks): Tab reaches them,
   Enter/Space fires them, and the ring is drawn in the mark's own geometry */
svg .clk:focus{outline:none}
svg .clk:focus-visible{stroke:#012A2D;stroke-width:2.5px;opacity:1}
/* a bar row / column slot is one 24px+ target (.hit); its labels let clicks through */
/* unpainted (fill:none, so it never reads as a chart tile) but hit-testable */
svg .hit{fill:none;pointer-events:all}
svg .hit:hover{fill:rgba(0,63,45,.045)}
.p-body svg text{pointer-events:none}
.val{font:400 11px/1 var(--font-mono);fill:var(--ink)}
.val-d{font:400 10px/1 var(--font-mono);fill:var(--muted)}

/* --- empty state: an honest "not recorded", never a blank chart --- */
.empty{border:1px dashed #94A29D;border-radius:var(--radius);padding:var(--s6) var(--s5);
  display:flex;flex-direction:column;justify-content:center;gap:var(--s2);min-height:200px;
  background:rgba(255,255,255,.55)}
.empty b{font:400 10px/1.3 var(--font-mono);letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.empty span{font:400 13.5px/1.55 var(--font-body);color:var(--body);max-width:56ch}

/* --- white band (findings, or any panel with tone:'white') --- */
.findings,.tone-white{background:var(--panel);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}

/* --- findings --- */
/* One row of up to five columns; the count is set per report (--fc). auto-fit
   gave 4 + 1 orphan, and an adjacent-sibling padding rule indented the
   wrapped item off the page's left edge. */
.f-list{display:grid;grid-template-columns:repeat(var(--fc,5),minmax(0,1fr));gap:0;
  border-top:1px solid var(--line)}
.f-item{padding:var(--s5);border-right:1px solid var(--line-soft)}
.f-item.rs{padding-left:0}
.f-item.re{border-right:0}
.f-item.nl{border-bottom:1px solid var(--line-soft)}
@media (max-width:1400px){
  .f-list{grid-template-columns:repeat(2,minmax(0,1fr))}
  .f-list .f-item{border-bottom:1px solid var(--line-soft);padding-left:var(--s5);
    border-right:1px solid var(--line-soft)}
  .f-list .f-item:nth-child(odd){padding-left:0}
  .f-list .f-item:nth-child(even),.f-list .f-item:last-child{border-right:0}
}
.f-n{font:400 11px/1 var(--font-mono);color:var(--cbre-green);letter-spacing:.1em}
.f-h{font:400 23px/1.16 var(--font-display);color:var(--ink);margin:var(--s3) 0 var(--s3);
  letter-spacing:-.02em;text-wrap:balance}
.f-b{font:400 13.5px/1.6 var(--font-body);color:var(--body);margin:0;max-width:72ch}
.f-b b{font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
/* hanging indent so runover text sits under the first word, not the rule */
.f-a{display:block;margin-top:var(--s3);font:400 12.5px/1.5 var(--font-body);
  color:var(--warm-ink);padding-left:21px;text-indent:-21px;max-width:72ch}
.f-a::before{content:"";display:inline-block;width:14px;height:1px;background:var(--warm);
  vertical-align:middle;margin-right:7px}

/* --- unit table --- */
/* overflow-x:auto computes overflow-y:auto, which makes this a scrollport and
   resolves the sticky <thead> against the table box instead of the viewport.
   So the box scrolls ONLY when the table is measured not to fit (.scrolls,
   set by fitTable()); otherwise the header stays sticky under the filter bar.
   Rules are confined to .t-scroll so a custom panel's own <table> is left alone. */
.t-scroll{border:1px solid var(--line);background:#fff;border-radius:var(--radius)}
.t-scroll.scrolls{overflow-x:auto}
@media (max-width:1079px){ .t-scroll{overflow-x:auto} }
.t-scroll table{border-collapse:collapse;width:100%;min-width:1080px}
.t-scroll thead th{position:sticky;top:calc(var(--mast) + var(--filter-h));z-index:20;background:#fff;
  border-bottom:1px solid var(--line);padding:0;text-align:left}
.t-scroll.scrolls thead th{position:static}
/* when the box scrolls sideways (a phone), the unit column stays put, so the
   row labels never scroll away from their values */
.t-scroll.scrolls td:first-child,.t-scroll.scrolls thead th:first-child{position:sticky;left:0;z-index:3}
.t-scroll.scrolls td:first-child{background:#fff;box-shadow:1px 0 0 var(--line-soft)}
.t-scroll.scrolls thead th:first-child{background:#fff;box-shadow:1px 0 0 var(--line-soft);top:auto}   /* sideways only */
.t-scroll.scrolls tbody tr:nth-child(even) td:first-child{background:#FAFCFB}
.t-scroll.scrolls tbody tr:hover td:first-child{background:#EFF5F2}
.t-scroll.scrolls tbody tr[aria-selected="true"] td:first-child{background:#E4EFEA}
@media (max-width:860px){ .t-scroll.scrolls td.nm{min-width:140px;max-width:170px} }
.t-scroll thead button{width:100%;font:400 10px/1 var(--font-mono);letter-spacing:.14em;text-transform:uppercase;
  color:var(--muted);background:none;border:0;padding:13px 12px;cursor:pointer;text-align:left;
  display:flex;align-items:center;gap:5px;transition:color var(--d-fast) var(--ease)}
.t-scroll thead button:hover{color:var(--ink)}
.t-scroll thead th.r button{justify-content:flex-end}
.t-scroll thead th[aria-sort] button{color:var(--ink)}
.caret{width:7px;height:7px;opacity:0}
thead th[aria-sort] .caret{opacity:1}
thead th[aria-sort="descending"] .caret{transform:rotate(180deg)}
.t-scroll tbody tr{border-bottom:1px solid var(--line-soft);cursor:pointer;
  transition:background var(--d-fast) var(--ease)}
.t-scroll tbody tr:nth-child(even){background:#FAFCFB}
.t-scroll tbody tr:hover{background:#EFF5F2;box-shadow:inset 3px 0 0 var(--cbre-green)}
.t-scroll tbody tr[aria-selected="true"]{background:#E4EFEA;box-shadow:inset 3px 0 0 var(--cbre-green)}
.t-scroll td{padding:9px 12px;font:400 13.5px/1.4 var(--font-body);color:var(--body);vertical-align:middle}
.t-scroll td.n{font-family:var(--font-mono);font-size:12.5px;text-align:right;color:var(--ink);white-space:nowrap}
.t-scroll td.nm{color:var(--ink);font-weight:500;max-width:290px}
.t-scroll td.nm span{display:block;font:400 11px/1.3 var(--font-mono);color:var(--muted);letter-spacing:.03em;
  margin-top:1px}
.szbar{display:inline-block;vertical-align:middle;width:66px;height:5px;background:var(--wash);
  margin-right:9px}
.szbar i{display:block;height:100%;background:var(--cbre-green)}
.unk{color:var(--muted);font-size:11px;letter-spacing:.04em;font-family:var(--font-mono)}
.pill{display:inline-block;font:400 10px/1 var(--font-mono);letter-spacing:.1em;text-transform:uppercase;
  padding:4px 7px;border-radius:var(--radius);white-space:nowrap}
/* tenure pills: owned = --sem-owned, leased = --sem-neutral tint. A regear is a
   lease, not a risk, so it no longer borrows the warm "passed / risk" hue. */
.p-own{background:#ECEFEE;color:#435254}
.p-lease{background:#EEF4F4;color:#3F6467}
.p-regear{background:#EEF4F4;color:#3F6467;box-shadow:inset 0 0 0 1px #B9CACB}
/* EPC (design-system §3c): the letter always printed in ink, the band colour a swatch */
.p-epc{background:#FFFFFF;color:var(--ink);box-shadow:inset 0 0 0 1px var(--line);text-transform:none;letter-spacing:.04em}
.p-epc i{display:inline-block;width:8px;height:8px;margin-right:5px;vertical-align:0;border-radius:1px}
.p-ab{background:#E8F2EE;color:var(--cbre-green)}
.p-c{background:#EEF4F4;color:#3F6467}
.p-d{background:var(--alert-bg);color:var(--warm-ink)}
/* one null token across the system — text-transform was rendering it "N/R" */
.p-none{border:1px dashed #94A29D;color:var(--muted);background:transparent;
  text-transform:none;letter-spacing:.04em}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:7px;vertical-align:1px;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.30)}
.dot.hollow{background:transparent;box-shadow:inset 0 0 0 1.5px #5C6B66}
.dot.dashed{background:transparent;box-shadow:none;border:1.5px dashed #5C6B66}
/* a key above a chart (api.key / columns({key})) */
.ck{display:flex;flex-wrap:wrap;gap:6px 18px;margin:0 0 14px;font:400 12.5px/1.4 var(--font-body);color:var(--body)}
.ck span{display:inline-flex;align-items:center;gap:7px}
.ck-sw{display:inline-block;width:11px;height:11px;flex:0 0 auto;border-radius:1px}
.ck-sw.hatch{background:repeating-linear-gradient(45deg,#CBD0CC 0 3px,#9AA8A2 3px 4px);box-shadow:inset 0 0 0 1px #9AA8A2}
.ck-sw.dashed{background:#FFFFFF;border:1.5px dashed #5C6B66}
.ck-sw.hollow{background:transparent;border-radius:50%;box-shadow:inset 0 0 0 2px #5C6B66}
.empty-row td{padding:var(--s7) var(--s4);text-align:center;color:var(--muted);font-size:14px}
.t-scroll tbody tr.empty-row{cursor:default}
.t-scroll tbody tr.empty-row:hover{background:transparent;box-shadow:none}

/* --- compact list (events panel; reusable by custom panels) --- */
.ev-list{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.ev-list li{margin:0}
.ev-row{width:100%;display:grid;grid-template-columns:96px minmax(0,1fr) auto;gap:var(--s3);
  align-items:baseline;background:none;border:0;border-bottom:1px solid var(--line-soft);
  padding:9px 2px;text-align:left;font-family:inherit;cursor:pointer;
  transition:background var(--d-fast) var(--ease)}
.ev-row:hover{background:#F3F7F5}
.ev-d{font:400 11px/1.3 var(--font-mono);color:var(--ink);white-space:nowrap}
.ev-k{display:block;font:400 10px/1.3 var(--font-mono);letter-spacing:.1em;text-transform:uppercase;
  color:var(--muted);margin-top:3px}
.ev-u{font:400 13px/1.35 var(--font-body);color:var(--ink);min-width:0}
.ev-u span{display:block;font:400 11px/1.3 var(--font-mono);color:var(--muted);letter-spacing:.03em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ev-s{font:400 11px/1 var(--font-mono);color:var(--body);white-space:nowrap}

/* --- mini table for custom panels (the unit table's rules do not reach it) --- */
.mini{border-collapse:collapse;width:100%}
.mini th{font:400 10px/1.2 var(--font-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);
  text-align:left;padding:8px 8px 8px 0;border-bottom:1px solid var(--line)}
.mini td{font:400 13px/1.4 var(--font-body);color:var(--body);padding:8px 8px 8px 0;
  border-bottom:1px solid var(--line-soft);vertical-align:baseline}
.mini td.n,.mini th.n{text-align:right;font-family:var(--font-mono);font-size:12px;color:var(--ink);white-space:nowrap}

/* --- drawer --- */
/* Below the app bar, not under it: at top:0 the bar (z 200) covered the
   drawer's location line and its close button. */
.scrim{position:fixed;top:var(--mast);left:0;right:0;bottom:0;background:rgba(1,42,45,.34);opacity:0;pointer-events:none;
  transition:opacity var(--d-base) var(--ease);z-index:80}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:var(--mast);right:0;bottom:0;width:490px;max-width:100vw;background:#fff;
  z-index:90;transform:translateX(100%);
  transition:transform var(--d-drawer) var(--ease-out),visibility 0s linear var(--d-drawer);
  display:flex;flex-direction:column;box-shadow:var(--shadow-2);pointer-events:none;visibility:hidden}
/* hidden when closed so its controls leave the tab order */
.drawer.on{transform:translateX(0);pointer-events:auto;visibility:visible;
  transition:transform var(--d-drawer) var(--ease-out),visibility 0s}
.dr-head{background:var(--cbre-green);color:#fff;padding:var(--s5);flex:0 0 auto;position:relative}
.dr-head h2{font:400 32px/1.08 var(--font-display);color:#fff;margin:0 var(--s6) 0 0;
  letter-spacing:-.028em;text-wrap:balance}
.dr-head .loc{font:400 11px/1.4 var(--font-mono);letter-spacing:.1em;text-transform:uppercase;
  color:var(--accent);margin-bottom:var(--s2);min-height:1px}
.dr-head .addr{font:400 12.5px/1.5 var(--font-body);color:rgba(255,255,255,.75);margin-top:var(--s2)}
/* 40px: the close target a thumb can hit (30px failed the target-size check) */
.dr-x{position:absolute;top:var(--s3);right:var(--s3);width:40px;height:40px;background:none;
  border:1px solid rgba(255,255,255,.3);color:#fff;cursor:pointer;border-radius:var(--radius);
  font-size:16px;line-height:1;transition:background var(--d-fast) var(--ease)}
.dr-x:hover{background:rgba(255,255,255,.14)}
.dr-body{overflow-y:auto;flex:1;padding:0 var(--s5) var(--s7)}
.dr-sec{padding-top:var(--s5)}
.dr-sec h3{font:400 10px/1 var(--font-mono);letter-spacing:.18em;text-transform:uppercase;
  color:var(--muted);margin:0 0 var(--s3);padding-bottom:var(--s2);border-bottom:1px solid var(--line)}
/* Values left-align next to their label. Right-aligning strings across a
   490px panel opened 375px voids between "Setting" and "Park". */
.dr-g{display:grid;grid-template-columns:132px 1fr;gap:var(--s2) var(--s4);align-items:baseline;margin:0}
.dr-g dt{font:400 12.5px/1.5 var(--font-body);color:var(--muted)}
.dr-g dd{margin:0;font:400 13px/1.5 var(--font-body);color:var(--ink);text-align:left}
.dr-g dd.n{font-family:var(--font-mono);font-size:12.5px;
  font-variant-numeric:tabular-nums lining-nums}
.dr-hero{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line-soft);
  border:1px solid var(--line-soft);margin-top:var(--s5)}
.dr-hero div{background:#fff;padding:var(--s4)}
.dr-hero b{display:block;font:400 25px/1 var(--font-display);color:var(--ink)}
.dr-hero em{display:block;font:400 10px/1 var(--font-mono);letter-spacing:.14em;text-transform:uppercase;
  color:var(--muted);font-style:normal;margin-top:7px}
.dr-flags{display:flex;flex-wrap:wrap;gap:6px}
.flag-y{font:400 10px/1 var(--font-mono);letter-spacing:.08em;text-transform:uppercase;
  background:#E8F2EE;color:var(--cbre-green);padding:6px 9px;border-radius:var(--radius)}
.flag-n{font:400 10px/1 var(--font-mono);letter-spacing:.08em;text-transform:uppercase;
  background:transparent;color:var(--muted-dec);border:1px solid var(--line-soft);
  padding:5px 8px;border-radius:var(--radius)}
.dr-note{background:var(--alert-bg);border-left:1px solid var(--warm);padding:var(--s3) var(--s4);
  font:400 12.5px/1.5 var(--font-body);color:var(--warm-ink);margin-top:var(--s4)}
.dr-gap{margin-top:var(--s5);padding-top:var(--s4);border-top:1px solid var(--line);
  font:400 11.5px/1.5 var(--font-body);color:var(--muted)}
.dr-gap b{font-weight:400;color:var(--body)}

/* --- footer --- */
footer{background:var(--dark-green);color:rgba(255,255,255,.66);padding:var(--s7) 0;
  font:400 12px/1.6 var(--font-body)}
footer .wrap{display:flex;justify-content:space-between;gap:var(--s6);flex-wrap:wrap}
footer b{color:#fff;font-weight:500}
footer .fl{max-width:62ch}

/* --- responsive --- */
/* Charts are laid out at their container's width whenever it is narrower than
   the design width (see layoutWidth()), so a declared 10px axis label never
   renders below 10px. Three columns still give way to two from 1400 down. */
@media (max-width:1400px){
  .grid-3{grid-template-columns:1fr 1fr;gap:var(--s6) var(--s7)}
}
@media (max-width:1240px){
  .map-row{grid-template-columns:1fr}
  #map{height:460px;min-height:460px}
  .metrics .wrap{grid-template-columns:1.3fr 1fr 1fr;row-gap:0}
  .metrics .m{border-right:1px solid rgba(255,255,255,.13);border-bottom:1px solid rgba(255,255,255,.13);
    padding-left:var(--s5)}
  .metrics .m:nth-child(3n+1){padding-left:0}
  .metrics .m:nth-child(3n),.metrics .m:last-child{border-right:0}
  .metrics .m:nth-child(3n+1):nth-last-child(-n+3),
  .metrics .m:nth-child(3n+1):nth-last-child(-n+3) ~ .m{border-bottom:0}
  .metrics .m.flag:nth-child(3n+1)::before{left:0}
}
@media (max-width:860px){
  :root{--gutter:18px}
  .grid-3,.grid-2{grid-template-columns:1fr}
  .metrics .wrap{grid-template-columns:1fr 1fr}
  /* nth-child rules authored for one tile count left a half-length hairline
     terminating mid-band; these hold for any count. */
  .metrics .m{border-right:1px solid rgba(255,255,255,.13);
     border-bottom:1px solid rgba(255,255,255,.13);padding:var(--s5) var(--s4)}
  .metrics .m:nth-child(2n),.metrics .m:last-child{border-right:0}
  .metrics .m:nth-child(2n+1):nth-last-child(-n+2),
  .metrics .m:nth-child(2n+1):nth-last-child(-n+2) ~ .m{border-bottom:0}
  .metrics .m:nth-child(odd){padding-left:0}
  .metrics .m.flag::before{left:var(--s4)}
  .metrics .m.flag:nth-child(odd)::before{left:0}
  .m-v{font-size:32px}
  .m:first-child .m-v{font-size:44px}   /* the hero stays the largest */
  .f-list,.f-list.f-list{grid-template-columns:1fr}
  .f-list .f-item,.f-list .f-item:nth-child(odd){
    border-right:0;border-bottom:1px solid var(--line-soft);padding-left:0}
  .readout{margin-left:0;text-align:left;min-width:0;width:100%;white-space:normal}
  .chip,select,.switch a{min-height:44px}   /* touch target floor */
  .drawer{width:100%}
  main > section{padding:var(--s7) 0}
  .t-scroll thead th{top:0}
  /* A wrapped filter bar is ~450px tall on a phone; pinned, it covered most of
     the screen. It scrolls away with the page here. */
  .filters{position:relative;top:auto}
  .ev-row{grid-template-columns:84px minmax(0,1fr)}
  .ev-s{grid-column:2}
}
.print-note{display:none}
@page{size:A4;margin:12mm}
/* Print: ink on white, one column at the A4 content width (~688px, where the
   charts are re-laid out; see PRINT_W), no fixed or sticky bars, a table that
   fits the page, and a note in place of the interactive map. */
@media print{
  :root{--gutter:0px;--mast:0px;--filter-h:0px}
  .filters,.map-toggle,.drawer,.scrim,.skip{display:none!important}
  body{background:#fff}
  main > section{padding:var(--s5) 0;break-inside:avoid}
  .title-band{padding:0 0 var(--s5)}
  .title-band .wrap,.grid-3,.grid-2,.map-row{grid-template-columns:1fr!important;gap:var(--s5)!important}
  h1{font-size:40px}
  .lede{font-size:14px;max-width:none}
  .sec-head{grid-template-columns:1fr;gap:var(--s2)}
  .blk{break-inside:avoid}
  /* chart type at >= 10.5px on paper */
  svg .ax,svg .ax-b,svg .val-d{font-size:10.5px}
  /* a scatter disc's white separator vanishes on white paper, leaving a dark
     disc that reads as a ring's fill: on paper it carries the toned edge */
  svg circle.sc-dot{stroke:rgba(0,0,0,.30)!important;stroke-width:1px}
  svg .val{font-size:11.5px}
  .map-row{display:none!important}
  .print-note{display:block;font:400 12px/1.5 var(--font-body);color:var(--body);border:1px dashed #94A29D;
    padding:10px 12px;margin:0}
  .metrics .wrap{grid-template-columns:repeat(3,minmax(0,1fr))!important}
  .metrics .m{padding:10px 8px!important;border:0!important}
  .metrics .m::before{display:none}
  .m-v,.m:first-child .m-v{font-size:26px!important}
  .t-scroll,.t-scroll.scrolls{overflow:visible!important;border:0}
  /* The page is the frame: the table at 100%, columns sized to their content.
     Cells wrap at spaces only, so a figure ("123,456") or a word ("LANDLORD")
     is never split; a long word in a text cell hyphenates only where its
     column cannot hold it (lang="en-GB"). overflow-wrap:anywhere split both. */
  .t-scroll table{min-width:0!important;width:100%;table-layout:auto}
  .t-scroll td,.t-scroll td.n,.t-scroll thead button{white-space:normal!important;overflow-wrap:normal;word-break:normal}
  .t-scroll td:not(.n){hyphens:auto;-webkit-hyphens:auto}
  .t-scroll td.n,.t-scroll thead button{hyphens:manual;-webkit-hyphens:manual}
  .t-scroll .caret{display:none}
  /* a pill cannot wrap, so in a narrow print column it spilled into the next
     cell: print it as plain text, wrapping at its spaces */
  .t-scroll .pill{background:none!important;box-shadow:none!important;border:0!important;padding:0;
    text-transform:none;letter-spacing:0;white-space:normal;overflow-wrap:normal;font-size:10.5px}
  .t-scroll thead th,.t-scroll td:first-child,.t-scroll thead th:first-child{position:static!important;box-shadow:none!important}
  .t-scroll td{padding:4px 5px;font-size:10.5px}
  .t-scroll td.n{font-size:10.5px}
  .t-scroll td.nm{max-width:none}
  .t-scroll thead button{padding:6px 5px;letter-spacing:.06em}
  .szbar{display:none}
  .t-scroll tbody tr{break-inside:avoid}
  .f-list{grid-template-columns:repeat(2,minmax(0,1fr))!important}
  /* ink on white: the dark KPI band and footer printed as solid blocks */
  .metrics,footer{background:#fff!important;color:var(--body)!important;border-top:1px solid var(--line)}
  .m-v{color:var(--ink)!important}
  .m.flag .m-v{color:var(--warm-ink)!important}
  .m-v small,.m-l,.m-n{color:var(--muted)!important}
  .m,.m.flag,.m.d-nl{border-color:var(--line)!important}
  footer b{color:var(--ink)!important}
}
</style>
</head>
<body>

<svg class="dash-defs" aria-hidden="true" focusable="false">
  <defs>
    <pattern id="dash-hatch" width="6" height="6" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <rect width="6" height="6" fill="#CBD0CC"/>
      <line x1="0" y1="0" x2="0" y2="6" stroke="#9AA8A2" stroke-width="1.2"/>
    </pattern>
  </defs>
</svg>

<div class="title-band">
  <div class="wrap">
    <div>
      <p class="eyebrow" id="tEyebrow" hidden></p>
      <h1 id="tH1"></h1>
      <div class="rule"></div>
    </div>
    <div>
      <p class="lede" id="tLede"></p>
      <div class="title-meta" id="tMeta"></div>

</div>

<div class="metrics" id="metrics">
  <div class="wrap" id="metricRow"></div>
</div>

<div class="filters" id="filterBar">
  <div class="wrap" id="filterWrap">
    <button class="btn-reset" id="btnReset" type="button" hidden>Clear all</button>
    <div class="readout" id="readout" aria-live="polite"></div>
  </div>
</div>

<main id="main"></main>

<footer>
  <div class="wrap">
    <div class="fl" id="footL"></div>
    <div id="footR"></div>
  </div>
</footer>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drTitle" aria-hidden="true">
  <div class="dr-head">
    <div class="loc" id="drLoc"></div>
