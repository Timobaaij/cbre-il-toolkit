<!DOCTYPE html>
<html lang="__LANG__">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="__APPTITLE__">
<meta name="theme-color" content="#003F2D">
<title>__TITLE__</title>
<style>
/* --------------------------------------------------------- leaflet 1.9.4 */
__LEAFLET_CSS__
</style>
<style>
/* ---------------------------------------------------------------- fonts */
__FONTS__

/* ------------------------------------------------------- design tokens */
/* Palette and type ladder are lifted from the CBRE longlist dashboard so the
   tour app and the dashboard read as one family. Do not drift these. */
:root{
  /* CBRE reference palette */
  --brand:#003F2D; --cbre-green:#003F2D; --dark-green:#012A2D; --accent:#17E88F;
  --dark-grey:#435254; --light-grey:#CAD1D3; --white:#FFFFFF;
  --celadon:#80BBAD; --celadon-tint:#C0D4CB; --sage:#538184;
  --bg-soft:#F5F7F7;
  /* semantic */
  --ink:#003F2D; --body:#435254; --muted:#6E7C77;
  --line:#CAD1D3; --line-soft:#E3E8E7; --bg:#F5F7F7; --panel:#FFFFFF;
  /* type */
  --font-display:'Financier Display',Georgia,serif;
  --font-body:'Calibre',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;
  --font-mono:'Space Mono','Courier New',monospace;
  /* geometry: the dashboard is a 2px-radius, sharp-cornered system */
  --radius:2px;
  --shadow:0 1px 2px rgba(0,63,45,.05),0 8px 24px rgba(0,63,45,.06);
  --shadow-lg:0 4px 12px rgba(0,63,45,.08),0 24px 60px rgba(0,63,45,.16);
  --topsafe:env(safe-area-inset-top,0px);
  --botsafe:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:var(--font-body);background:var(--bg);color:var(--body);
  font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}
body.locked{overflow:hidden}
a{color:inherit}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* Mono eyebrows and labels: the signature CBRE tag style. */
.eyebrow,.wordmark,.countdown,.pill-k,.stop-t,.chip,.spec-k,.section-title,
.kpi-label,.kpi-sub,.market-k,.dev-line,.tabbar span,.ref,.foot,.market-pack,
.daymeta,.sheet-h .loc,.doc .dsize,.search input::placeholder{
  font-family:var(--font-mono);
}
.eyebrow,.kpi-label,.section-title,.spec-k,.dev-line,.market-k{letter-spacing:.14em}

/* ---------------------------------------------------------------- shell */
.app{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}

/* ------------------------------------------------------------- top bar */
.top{
  position:sticky;top:0;z-index:40;background:var(--cbre-green);color:#fff;
  padding:calc(var(--topsafe) + 14px) 18px 0;
}
.top-row{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.wordmark{font-weight:700;letter-spacing:.16em;font-size:13px}
.top h1{
  font-family:var(--font-display);font-weight:500;font-size:27px;line-height:1.04;
  margin:8px 0 2px;letter-spacing:-.01em;color:#fff;
}
.top h1 em{font-style:normal;color:var(--accent)}
.los{display:block;width:56px;height:4px;background:var(--accent);margin:12px 0}
.top .sub{font-size:12.5px;color:var(--celadon-tint);letter-spacing:.02em}
.top .sub b{font-weight:400;color:rgba(255,255,255,.62)}
.countdown{
  font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--accent);white-space:nowrap;
}

/* Day pills: sharp corners, mono labels. */
.pills{display:flex;gap:8px;overflow-x:auto;padding:0 0 12px;scrollbar-width:none;scroll-snap-type:x proximity}
.pills::-webkit-scrollbar{display:none}
.pill{
  flex:0 0 auto;scroll-snap-align:start;
  border:1px solid rgba(255,255,255,.22);border-radius:var(--radius);
  padding:8px 14px;text-align:left;min-width:104px;transition:background .15s,border-color .15s;
}
.pill .pill-k{
  display:block;font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;
  color:rgba(255,255,255,.55);margin-bottom:2px;
}
.pill .pill-v{display:block;font-size:13.5px;font-weight:500;color:#fff}
.pill.on{background:var(--accent);border-color:var(--accent)}
.pill.on .pill-k{color:rgba(1,42,45,.66)}
.pill.on .pill-v{color:var(--dark-green);font-weight:600}
.pill.past{opacity:.5}
/* A one-day tour has nothing to switch between: the rail is dead weight. */
.pills.solo{display:none}
.top.solo{padding-bottom:16px}

/* ------------------------------------------------------------- day map */
/* Every day opens on its own map. Numbered pins follow the running order,
   so the shape of the day is legible before reading a single card. */
.daymap-wrap{margin:0 0 18px}
.daymap{
  height:230px;border:1px solid var(--line);border-radius:var(--radius);
  background:var(--bg-soft);box-shadow:var(--shadow);
  /* Leaflet needs an explicit stacking context below the sticky header. */
  position:relative;z-index:1;
}
.daymap.tall{height:300px}
.daymap-cap{
  display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline;
  font-family:var(--font-mono);font-size:10px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--muted);margin-top:7px;
}
.daymap-cap .warn{color:#B24020;text-transform:none;letter-spacing:.04em}
/* OpenStreetMap's own style is saturated. Filtering just the tile pane
   pulls it back to a quiet grey basemap so the green pins and the dashed
   route stay the loudest things on the map. Only the tiles are filtered:
   markers, popups and controls sit in other panes and keep full colour. */
.daymap.muted-tiles .leaflet-tile-pane{
  filter:saturate(.32) contrast(1.04) brightness(1.04);
}
.leaflet-container{font-family:var(--font-body);background:var(--bg-soft)}
.leaflet-container a{color:var(--cbre-green)}
.leaflet-control-attribution{
  font-family:var(--font-mono);font-size:9px;letter-spacing:.04em;
  background:rgba(255,255,255,.82);
}
.leaflet-bar,.leaflet-popup-content-wrapper,.leaflet-popup-tip{border-radius:var(--radius)}
.leaflet-bar a{color:var(--cbre-green)}

/* Numbered marker: a div icon, so no image assets and no extra requests. */
.mk{
  width:26px;height:26px;border-radius:50%;
  background:var(--cbre-green);color:#fff;border:2px solid #fff;
  box-shadow:0 1px 4px rgba(1,42,45,.4);
  display:grid;place-items:center;
  font-family:var(--font-mono);font-size:11px;font-weight:700;line-height:1;
}
.mk.k-travel{background:var(--sage)}
.mk.k-meal{background:var(--celadon);color:var(--dark-green)}
.mk.k-meet{background:var(--dark-green)}
.mk.on{background:var(--accent);color:var(--dark-green);transform:scale(1.15)}

.leaflet-popup-content{margin:12px 14px;min-width:150px}
.pop-t{font-family:var(--font-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--sage);margin-bottom:3px}
.pop-n{font-family:var(--font-display);font-weight:500;font-size:16px;line-height:1.2;color:var(--ink);margin:0 0 8px}
.pop-a{display:flex;gap:6px;flex-wrap:wrap}
.pop-b{
  display:inline-flex;align-items:center;gap:5px;
  background:var(--cbre-green);color:#fff!important;text-decoration:none;
  border-radius:var(--radius);padding:6px 10px;
  font-family:var(--font-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;
}
.pop-b.ghost{background:#fff;color:var(--cbre-green)!important;border:1px solid var(--cbre-green)}

/* --------------------------------------------------------- KPI band */
/* Dark-green stat band with big accent serif numbers: dashboard signature. */
.kpis{background:var(--dark-green)}
.kpis-inner{display:grid;grid-template-columns:repeat(auto-fit,minmax(84px,1fr))}
.kpi{padding:14px 16px 16px;border-right:1px solid rgba(255,255,255,.12)}
.kpi:last-child{border-right:0}
.kpi-label{font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.6);margin-bottom:4px}
.kpi-value{
  font-family:var(--font-display);font-weight:500;font-size:26px;line-height:1;
  color:var(--accent);letter-spacing:-.02em;
}
.kpi-value.txt{font-size:18px;letter-spacing:-.01em}
.kpi-sub{font-size:10.5px;color:rgba(255,255,255,.55);letter-spacing:.06em;margin-top:3px}

/* ---------------------------------------------------------------- main */
.main{flex:1;padding:20px 18px calc(var(--botsafe) + 84px)}

.dayhead{margin:0 0 18px}
.dayhead .eyebrow{
  font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--sage);
  display:inline-flex;align-items:center;gap:9px;margin-bottom:10px;
}
.dayhead .eyebrow::before{content:"";width:24px;height:1px;background:var(--accent)}
.dayhead h2{
  font-family:var(--font-display);font-weight:500;font-size:30px;line-height:1.05;
  margin:0 0 10px;letter-spacing:-.01em;color:var(--ink);
}
.dayhead p{margin:0 0 12px;color:var(--body);font-size:14px;line-height:1.6;max-width:62ch}
.daymeta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:11.5px;color:var(--muted);letter-spacing:.06em}
.daymeta b{font-family:var(--font-display);font-weight:500;color:var(--cbre-green);font-size:14px;letter-spacing:0}

/* -------------------------------------------------------- stop cards */
/* Sharp corners plus a 4px left accent border: the dashboard card motif.
   Left-border colour encodes stop kind, so the day reads at a glance. */
.stop{
  background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--accent);
  border-radius:var(--radius);box-shadow:var(--shadow);
  margin:0 0 12px;overflow:hidden;
}
.stop.k-travel{border-left-color:var(--sage)}
.stop.k-meal{border-left-color:var(--celadon)}
.stop.k-meet{border-left-color:var(--dark-green)}
.stop-main{display:flex;gap:14px;padding:16px 16px 0;align-items:flex-start;width:100%;text-align:left}
.stop-t{
  flex:0 0 auto;font-size:11.5px;letter-spacing:.04em;color:var(--cbre-green);
  font-weight:700;padding-top:3px;min-width:78px;
  display:flex;flex-direction:column;align-items:flex-start;gap:6px;
}
/* Pin number ties the card to its marker on the day map. */
.stop-pin{
  display:grid;place-items:center;width:21px;height:21px;border-radius:50%;
  background:var(--cbre-green);color:#fff;font-size:10px;font-weight:700;
  line-height:1;letter-spacing:0;
}
.stop.k-travel .stop-pin{background:var(--sage)}
.stop.k-meal .stop-pin{background:var(--celadon);color:var(--dark-green)}
.stop.k-meet .stop-pin{background:var(--dark-green)}
.stop-b{flex:1;min-width:0}
.stop-n{
  font-family:var(--font-display);font-weight:500;font-size:19px;line-height:1.2;
  color:var(--ink);margin:0 0 4px;letter-spacing:-.01em;
}
.stop-note{font-size:13.5px;color:var(--body);line-height:1.55;margin:0}
.chev{flex:0 0 auto;color:var(--light-grey);margin-top:4px}
.stop.has-detail .stop-main{cursor:pointer}
.stop.has-detail:active{background:var(--bg-soft)}

.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0}
.chip{
  font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  border:1px solid var(--line);border-radius:var(--radius);
  padding:4px 8px;color:var(--muted);background:var(--white);white-space:nowrap;
}
.chip.dev{background:var(--bg-soft);color:var(--cbre-green);border-color:var(--celadon-tint);font-weight:700}
.chip.attend{background:var(--cbre-green);color:#fff;border-color:var(--cbre-green);font-weight:700}
.chip.tbc{background:var(--bg-soft);color:var(--sage)}
.chip.off{background:var(--white);color:var(--muted);border-color:var(--line);border-style:dashed}

.acts{display:flex;flex-wrap:wrap;gap:8px;padding:14px 16px 16px}
.btn{
  display:inline-flex;align-items:center;gap:7px;
  background:var(--cbre-green);color:var(--white);border:1px solid var(--cbre-green);
  border-radius:var(--radius);padding:9px 14px;font-size:12.5px;font-weight:600;
  letter-spacing:.02em;text-decoration:none;transition:background .15s;
}
.btn:hover{background:var(--dark-green)}
.btn.ghost{background:var(--white);color:var(--cbre-green);border-color:var(--cbre-green)}
.btn.ghost:hover{background:var(--celadon-tint)}
.btn svg{width:14px;height:14px;flex:0 0 auto}

/* ------------------------------------------------------ options view */
.market{margin:0 0 26px}
.market-h{display:flex;align-items:baseline;flex-wrap:wrap;gap:6px 12px;margin:0 0 4px}
.market-h h2{font-family:var(--font-display);font-weight:500;font-size:26px;margin:0;color:var(--ink);letter-spacing:-.01em}
.market-k{font-size:10.5px;text-transform:uppercase;color:var(--muted)}
.market-pack{font-size:11px;color:var(--muted);letter-spacing:.04em;margin:0 0 14px}

.ref{
  flex:0 0 auto;font-size:10.5px;letter-spacing:.08em;font-weight:700;
  color:var(--cbre-green);padding-top:3px;min-width:52px;text-transform:uppercase;
}

.search{position:sticky;bottom:calc(var(--botsafe) + 68px);z-index:20;margin:0 0 16px}
.search input{
  width:100%;font-family:var(--font-body);font-size:14px;color:var(--ink);
  background:#fff;border:1px solid var(--line);border-radius:var(--radius);
  padding:11px 13px;outline:none;box-shadow:var(--shadow);
}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(23,232,143,.18)}

.empty{
  background:var(--bg-soft);border:1px solid var(--line-soft);border-radius:var(--radius);
  padding:28px 20px;text-align:center;
}
.empty h3{font-family:var(--font-display);font-weight:500;color:var(--cbre-green);margin:0 0 6px;font-size:19px}
.empty p{margin:0;font-size:13.5px;color:var(--muted)}

/* ------------------------------------------------------------- detail */
.sheet-bd{
  position:fixed;inset:0;z-index:60;background:rgba(1,42,45,.55);
  opacity:0;pointer-events:none;transition:opacity .2s;
}
.sheet-bd.on{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:61;
  max-height:92dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;
  background:var(--panel);border-radius:var(--radius) var(--radius) 0 0;
  transform:translateY(100%);transition:transform .26s cubic-bezier(.32,.72,0,1);
  padding-bottom:calc(var(--botsafe) + 20px);
}
.sheet.on{transform:translateY(0)}
.sheet-h{position:sticky;top:0;background:var(--cbre-green);color:#fff;padding:18px 52px 16px 18px;z-index:2}
.sheet-h .dev-line{font-size:10px;text-transform:uppercase;color:var(--accent);margin-bottom:6px}
.sheet-h h3{font-family:var(--font-display);font-weight:500;font-size:23px;line-height:1.15;margin:0;color:#fff;letter-spacing:-.01em}
.sheet-h .loc{font-size:12px;color:var(--celadon-tint);margin-top:4px;letter-spacing:.06em}
.sheet-x{
  position:absolute;top:14px;right:14px;width:30px;height:30px;
  display:grid;place-items:center;border-radius:var(--radius);
  background:rgba(255,255,255,.14);color:#fff;font-size:18px;line-height:1;
}
.sheet-x:hover{background:rgba(255,255,255,.26)}
.sheet-b{padding:18px}
.section-title{
  font-size:10.5px;text-transform:uppercase;color:var(--sage);
  display:flex;align-items:center;gap:9px;margin:22px 0 10px;
}
.section-title:first-child{margin-top:0}
.section-title::before{content:"";width:16px;height:2px;background:var(--accent);flex:0 0 auto}
.desc{font-size:13.5px;line-height:1.65;color:var(--body);margin:0}
.spec-grid{display:grid;gap:0}
.spec{display:flex;justify-content:space-between;gap:14px;padding:9px 0;border-bottom:1px dotted var(--line-soft)}
.spec:last-child{border-bottom:0}
.spec-k{font-size:10px;text-transform:uppercase;color:var(--muted);flex:0 0 42%}
.spec-v{font-size:13px;color:var(--body);text-align:right;flex:1;min-width:0}
.spec-v.tbc{color:var(--sage);font-style:italic}
.docs{display:flex;flex-direction:column;gap:7px}
.doc{
  display:flex;align-items:center;gap:9px;font-size:12.5px;color:var(--cbre-green);
  border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px;
  text-decoration:none;background:var(--white);
}
.doc:hover{background:var(--bg-soft)}
.doc svg{width:15px;height:15px;flex:0 0 auto;color:var(--sage)}
.doc .dsize{margin-left:auto;font-size:10.5px;color:var(--muted);letter-spacing:.04em}

/* ------------------------------------------------------------- tabbar */
.tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:50;
  background:var(--dark-green);
  display:grid;grid-template-columns:repeat(var(--tabs,2),1fr);
  padding-bottom:var(--botsafe);
}
.tabbar button{
  display:flex;flex-direction:column;align-items:center;gap:4px;
  padding:11px 6px 10px;color:rgba(255,255,255,.55);transition:color .15s;
}
.tabbar button.on{color:var(--accent)}
.tabbar span{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:700}
.tabbar svg{width:19px;height:19px}

/* ------------------------------------------------------------- footer */
.foot{
  background:var(--dark-green);color:var(--light-grey);
  font-size:10.5px;letter-spacing:.08em;line-height:1.7;
  padding:22px 18px calc(var(--botsafe) + 22px);
}
.foot p{margin:0 0 8px}
.foot p:last-child{margin:0;color:rgba(255,255,255,.45)}

/* ---------------------------------------------------- day layout (phone) */
/* Phone order: heading, map, then the timeline. The map opens the day. */
.daygrid{display:flex;flex-direction:column}

/* -------------------------------------------------------- wide screens */
/* Tablet: the same single column, just roomier. Bands stay full-bleed and
   only their inner content is capped, so the green never stops short. */
@media (min-width:720px) and (max-width:1023px){
  /* width:100% for the same flex-item reason as the desktop block below. */
  .top-inner,.main,.foot-inner,.kpis-inner{width:100%;max-width:820px;margin-left:auto;margin-right:auto}
  .kpis-inner{grid-template-columns:repeat(auto-fit,minmax(120px,1fr))}
  .sheet{left:50%;transform:translate(-50%,100%);width:min(680px,100%);border-radius:var(--radius)}
  .sheet.on{transform:translate(-50%,0)}
  .tabbar{max-width:820px;left:50%;transform:translateX(-50%)}
  .dayhead h2{font-size:36px}
  .main{padding-left:24px;padding-right:24px}
  .daymap{height:320px}
}

/* ------------------------------------------------------------- desktop */
/* Desktop is a different layout, not a wider phone: full-bleed green
   bands, an editorial hero, day tabs in the header, and the map parked
   sticky beside a scrolling timeline. */
@media (min-width:1024px){
  :root{--gutter:32px;--maxw:1400px}

  /* Bands run edge to edge; the inner content is what gets capped.
     The header stops being sticky here: it is a tall editorial hero, and a
     sticky one would sit over the sticky map column. */
  .top{padding:0;display:block;position:static}
  /* width:100% is load-bearing. .main is a flex item of .app, and auto
     cross-axis margins switch off align-self:stretch, so without it the
     column collapses to fit-content and sits inset from the green bands. */
  .top-inner,.kpis-inner,.main,.foot-inner{
    width:100%;max-width:var(--maxw);margin:0 auto;
    padding-left:var(--gutter);padding-right:var(--gutter);
  }
  .top-inner{padding-top:26px;padding-bottom:0}

  .top-row{align-items:center}
  .wordmark{font-size:14px}
  .top h1{font-size:clamp(38px,3.6vw,56px);margin:14px 0 0;max-width:22ch}
  .los{margin:18px 0 16px}
  .top .sub{font-size:14px;max-width:70ch}
  .countdown{font-size:12px}

  /* Day pills become header tabs, sitting on the fold of the green band. */
  .pills{gap:6px;padding:22px 0 0;overflow:visible;flex-wrap:wrap}
  .pill{min-width:0;padding:9px 16px}
  .pill .pill-k{font-size:9px}
  .pill .pill-v{font-size:13px}

  .kpis-inner{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
  .top.solo .top-inner{padding-bottom:20px}
  .kpi{padding:22px 26px 24px}
  .kpi-value{font-size:clamp(30px,2.6vw,44px)}
  .kpi-value.txt{font-size:26px}
  .kpi-label{font-size:10px}

  /* The bottom tab bar is a phone idiom. On desktop it becomes a normal
     inline control row under the hero. */
  .tabbar{
    position:static;background:transparent;display:flex;justify-content:flex-start;
    gap:6px;width:100%;max-width:var(--maxw);margin:26px auto 0;
    padding:0 var(--gutter);
  }
  .tabbar button{
    flex:0 0 auto;flex-direction:row;gap:8px;padding:10px 20px;
    border:1px solid var(--line);border-radius:var(--radius);
    background:#fff;color:var(--muted);
  }
  .tabbar button.on{background:var(--cbre-green);border-color:var(--cbre-green);color:#fff}
  .tabbar button.on svg{color:var(--accent)}
  .tabbar span{font-size:11px;letter-spacing:.1em}
  .main{padding-top:26px;padding-bottom:56px}

  /* Two columns: timeline left, sticky map right. */
  .daygrid{
    display:grid;
    grid-template-columns:minmax(0,1fr) minmax(340px,42%);
    grid-template-areas:"head map" "stops map";
    column-gap:32px;align-items:start;
  }
  .dayhead-slot{grid-area:head}
  .stopcol{grid-area:stops;min-width:0}
  .mapcol{grid-area:map;position:sticky;top:24px}
  .daymap{height:min(640px,calc(100vh - 140px))}
  .daymap.tall{height:min(720px,calc(100vh - 120px))}
  .dayhead h2{font-size:42px}
  .dayhead p{font-size:15px}

  /* Two-up stop cards would fight the sticky map, so the timeline stays
     one column and simply gets more air. */
  .stop-main{padding:18px 18px 0}
  .stop-t{min-width:92px;font-size:12px}
  .stop-n{font-size:21px}
  .acts{padding:14px 18px 18px}

  /* Options view: a real card grid, the dashboard's own motif. */
  .market-h h2{font-size:32px}
  .optgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:18px}
  .optgrid .stop{margin:0;display:flex;flex-direction:column}
  .optgrid .acts{margin-top:auto}
  .search{position:static;max-width:460px}

  /* Centred dialog rather than a bottom sheet. It sits in the viewport even
     when closed, so pointer-events must be switched off or it eats clicks. */
  .sheet{
    left:50%;top:50%;bottom:auto;
    transform:translate(-50%,-46%) scale(.98);opacity:0;pointer-events:none;
    width:min(760px,calc(100vw - 64px));max-height:86vh;
    border-radius:var(--radius);box-shadow:var(--shadow-lg);
  }
  .sheet.on{transform:translate(-50%,-50%) scale(1);opacity:1;pointer-events:auto}
  .sheet-b{padding:24px}

  .foot{padding:28px 0 34px}
  .foot-inner{display:flex;flex-wrap:wrap;gap:10px 32px;justify-content:space-between;align-items:baseline}
  .foot p{margin:0;max-width:88ch}
}

@media (min-width:1400px){
  .daygrid{column-gap:44px}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important}
}
@media print{
  .tabbar,.search,.chev,.leaflet-control-container{display:none}
  .stop{break-inside:avoid;box-shadow:none}
  .top{position:static}
  .sheet,.sheet-bd{display:none}
  .daymap{height:260px;break-inside:avoid}
}
</style>
